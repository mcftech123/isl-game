<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ISL Penalty Shootout</title>

<style>
:root{
    --accent:#f5c400;
    --accent2:#123d91;
    --bg:#05090c;
    --panel:#091118;
    --line:rgba(255,255,255,.15);
    --muted:#9da8ae;
    --white:#fff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 50% 0%,#17222a 0%,#05080b 45%,#020304 100%);
    color:white;
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px;
}

button,
select,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:min(1280px,100%);
}

#gameFrame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:15px;
    background:#0b2413;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 35px 100px rgba(0,0,0,.8),
        0 0 0 1px rgba(255,255,255,.03);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* =====================================================
   TEAM SCREEN
===================================================== */

#teamScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        linear-gradient(
            180deg,
            rgba(2,6,9,.90),
            rgba(2,5,8,.97)
        );
    backdrop-filter:blur(12px);
}

.teamPanel{
    width:min(920px,100%);
    max-height:94%;
    overflow:auto;
    padding:28px;
    border-radius:18px;
    background:
        linear-gradient(
            145deg,
            rgba(15,24,31,.98),
            rgba(4,10,15,.98)
        );
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 30px 90px #000;
}

.gameTitle{
    text-align:center;
    font-size:clamp(25px,4vw,48px);
    font-weight:1000;
    letter-spacing:2px;
}

.gameSubtitle{
    text-align:center;
    color:#89979f;
    font-size:11px;
    letter-spacing:2px;
    margin-top:6px;
    margin-bottom:25px;
}

.selectionTitle{
    color:#9ca9b1;
    font-size:10px;
    font-weight:1000;
    letter-spacing:1.7px;
    margin:18px 0 9px;
}

.teamGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.teamCard{
    min-height:86px;
    padding:10px 6px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
    background:
        linear-gradient(
            180deg,
            #16242d,
            #091117
        );
    color:#fff;
    transition:.18s ease;
}

.teamCard:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.35);
}

.teamCard.selected{
    border-color:var(--accent);
    box-shadow:
        0 0 0 2px var(--accent),
        0 0 28px rgba(255,200,40,.16);
}

.teamBadge{
    width:35px;
    height:35px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:1000;
    border:2px solid rgba(255,255,255,.5);
}

.teamName{
    margin-top:8px;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#startMatch{
    display:block;
    width:270px;
    max-width:100%;
    height:49px;
    margin:26px auto 0;
    border:0;
    border-radius:9px;
    background:
        linear-gradient(
            180deg,
            #ffe85a,
            #d6a817
        );
    color:#171200;
    font-size:11px;
    font-weight:1000;
    letter-spacing:1px;
}

#startMatch:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =====================================================
   HUD
===================================================== */

#topHUD{
    position:absolute;
    z-index:100;
    top:13px;
    left:13px;
    right:13px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    pointer-events:none;
}

.scoreBox{
    width:340px;
    max-width:43%;
    overflow:hidden;
    border-radius:7px;
    background:rgba(3,9,14,.92);
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 12px 35px #0009;
    backdrop-filter:blur(10px);
}

.scoreTeam{
    display:grid;
    grid-template-columns:70px 1fr 50px;
    min-height:47px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.scoreTeam:last-child{
    border-bottom:0;
}

.scoreName{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:1000;
}

.scoreSlots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
}

.slot{
    width:21px;
    height:15px;
    border:1px solid rgba(255,255,255,.8);
    background:#e6eaec;
    border-radius:2px;
}

.slot.goal{
    background:#22d579;
    border-color:#a1ffd0;
}

.slot.miss{
    background:#ed4a58;
    border-color:#ffb0b8;
}

.scoreNumber{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4cf1b;
    color:#111;
    font-size:21px;
    font-weight:1000;
}

#centerInfo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    padding:7px 18px;
    border-radius:30px;
    background:rgba(3,9,14,.88);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(9px);
}

#centerInfo small{
    display:block;
    color:#89979e;
    font-size:7px;
    letter-spacing:2px;
}

#centerInfo strong{
    font-size:12px;
}

#gameButtons{
    display:flex;
    gap:5px;
    pointer-events:auto;
}

.smallBtn{
    height:37px;
    padding:0 12px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,.17);
    background:rgba(4,12,18,.94);
    color:white;
    font-size:9px;
    font-weight:1000;
}

#resetBtn{
    background:#b73543;
}

/* =====================================================
   STATUS
===================================================== */

#statusBox{
    position:absolute;
    z-index:90;
    top:91px;
    left:50%;
    transform:translateX(-50%);
    min-width:270px;
    text-align:center;
    padding:9px 17px;
    border-radius:12px;
    background:rgba(3,9,14,.76);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
}

#statusMain{
    font-size:19px;
    font-weight:1000;
    letter-spacing:1px;
}

#statusSub{
    margin-top:3px;
    color:#aab5bb;
    font-size:9px;
}

/* =====================================================
   DIFFICULTY
===================================================== */

#difficultyBox{
    position:absolute;
    z-index:100;
    top:63px;
    right:13px;
    display:none;
    align-items:center;
    gap:7px;
    padding:7px 9px;
    border-radius:7px;
    background:rgba(3,10,15,.92);
    border:1px solid rgba(255,255,255,.14);
}

#difficultyBox span{
    color:#87949b;
    font-size:7px;
    font-weight:1000;
}

#difficulty{
    background:transparent;
    color:white;
    border:0;
    outline:0;
    font-size:8px;
    font-weight:1000;
}

/* =====================================================
   SHOOT CONTROLS
===================================================== */

#shootControls{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

.zoneGrid{
    display:grid;
    grid-template-columns:repeat(3,72px);
    gap:5px;
}

.zone{
    height:35px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(3,11,17,.94);
    color:white;
    font-size:8px;
    font-weight:1000;
}

.zone.selected{
    background:var(--accent);
    color:#111;
    border-color:#fff4a0;
}

.powerWrap{
    width:220px;
    padding:5px 8px;
    border-radius:20px;
    background:rgba(3,10,15,.93);
    border:1px solid rgba(255,255,255,.17);
}

#power{
    width:100%;
    accent-color:var(--accent);
}

#shootBtn{
    width:155px;
    height:40px;
    border:0;
    border-radius:8px;
    background:
        linear-gradient(
            180deg,
            #ffe965,
            #d5a619
        );
    color:#151200;
    font-size:10px;
    font-weight:1000;
    letter-spacing:1px;
}

/* =====================================================
   DEFEND CONTROLS
===================================================== */

#defendControls{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
}

.diveBtn{
    min-width:95px;
    height:43px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(3,11,17,.95);
    color:white;
    font-size:9px;
    font-weight:1000;
}

.diveBtn.center{
    background:
        linear-gradient(
            180deg,
            #31d87d,
            #109b51
        );
    color:#03170b;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:0;
        align-items:center;
    }

    #gameFrame{
        width:100vw;
        max-width:100vw;
        border-radius:0;
        border-left:0;
        border-right:0;
    }

    #teamScreen{
        padding:8px;
    }

    .teamPanel{
        padding:15px 11px;
        border-radius:12px;
    }

    .gameTitle{
        font-size:24px;
    }

    .gameSubtitle{
        font-size:7px;
        margin-bottom:10px;
    }

    .teamGrid{
        grid-template-columns:repeat(3,1fr);
        gap:5px;
    }

    .teamCard{
        min-height:65px;
        padding:6px 3px;
    }

    .teamBadge{
        width:25px;
        height:25px;
        font-size:7px;
    }

    .teamName{
        font-size:7px;
        margin-top:5px;
    }

    .selectionTitle{
        margin:10px 0 6px;
        font-size:8px;
    }

    #startMatch{
        height:43px;
        margin-top:13px;
        font-size:9px;
    }

    #topHUD{
        top:5px;
        left:5px;
        right:5px;
    }

    .scoreBox{
        width:205px;
        max-width:57%;
    }

    .scoreTeam{
        grid-template-columns:40px 1fr 29px;
        min-height:30px;
    }

    .scoreName{
        font-size:8px;
    }

    .scoreSlots{
        gap:2px;
    }

    .slot{
        width:13px;
        height:9px;
    }

    .scoreNumber{
        font-size:14px;
    }

    #centerInfo{
        display:none;
    }

    .smallBtn{
        height:27px;
        padding:0 7px;
        font-size:6px;
    }

    #statusBox{
        top:43px;
        min-width:175px;
        max-width:60%;
        padding:6px 8px;
    }

    #statusMain{
        font-size:11px;
    }

    #statusSub{
        font-size:6.5px;
    }

    #difficultyBox{
        top:35px;
        right:5px;
        padding:4px 6px;
    }

    #difficultyBox span{
        font-size:5px;
    }

    #difficulty{
        font-size:6px;
    }

    #shootControls{
        bottom:5px;
        gap:4px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,52px);
        gap:3px;
    }

    .zone{
        height:25px;
        font-size:6px;
    }

    .powerWrap{
        width:165px;
        padding:2px 6px;
    }

    #shootBtn{
        width:120px;
        height:32px;
        font-size:7px;
    }

    #defendControls{
        bottom:5px;
        gap:3px;
    }

    .diveBtn{
        min-width:69px;
        height:32px;
        font-size:6px;
    }
}

@media(max-height:500px) and (orientation:landscape){

    #shootControls{
        bottom:3px;
        transform:translateX(-50%) scale(.85);
        transform-origin:bottom center;
    }

    #defendControls{
        bottom:3px;
        transform:translateX(-50%) scale(.85);
        transform-origin:bottom center;
    }

    #statusBox{
        top:38px;
        transform:translateX(-50%) scale(.85);
    }
}
</style>
</head>

<body>

<div id="app">

<div id="gameFrame">

<canvas id="game" width="1280" height="720"></canvas>

<!-- =====================================================
     TEAM SELECTION
===================================================== -->

<div id="teamScreen">

<div class="teamPanel">

<div class="gameTitle">
    ISL PENALTY SHOOTOUT
</div>

<div class="gameSubtitle">
    SELECT YOUR TEAM AND OPPONENT
</div>

<div class="selectionTitle">
    YOUR TEAM
</div>

<div class="teamGrid" id="yourTeams"></div>

<div class="selectionTitle">
    OPPONENT
</div>

<div class="teamGrid" id="opponentTeams"></div>

<button id="startMatch" disabled>
    START MATCH
</button>

</div>
</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="topHUD">

<div class="scoreBox">

<div class="scoreTeam">
    <div class="scoreName" id="yourName">YOU</div>
    <div class="scoreSlots" id="yourSlots"></div>
    <div class="scoreNumber" id="yourScore">0</div>
</div>

<div class="scoreTeam">
    <div class="scoreName" id="oppName">CPU</div>
    <div class="scoreSlots" id="oppSlots"></div>
    <div class="scoreNumber" id="oppScore">0</div>
</div>

</div>

<div id="centerInfo">
    <small>ISL PENALTY SHOOTOUT</small>
    <strong>
        ROUND <span id="round">1</span> /
        <span id="maxRound">5</span>
    </strong>
</div>

<div id="gameButtons">
    <button class="smallBtn" id="changeTeams">
        TEAMS
    </button>

    <button class="smallBtn" id="resetBtn">
        RESET
    </button>
</div>

</div>

<!-- =====================================================
     STATUS
===================================================== -->

<div id="statusBox">

    <div id="statusMain">
        SELECT TEAMS
    </div>

    <div id="statusSub">
        Choose your team and opponent
    </div>

</div>

<!-- =====================================================
     DIFFICULTY
===================================================== -->

<div id="difficultyBox">

    <span>DIFFICULTY</span>

    <select id="difficulty">

        <option value="easy">
            EASY
        </option>

        <option value="medium" selected>
            MEDIUM
        </option>

        <option value="hard">
            HARD
        </option>

    </select>

</div>

<!-- =====================================================
     SHOOT CONTROLS
===================================================== -->

<div id="shootControls">

    <div class="zoneGrid">

        <button class="zone"
                data-x="-2.75"
                data-z="2.05">
            ↖ HIGH
        </button>

        <button class="zone"
                data-x="0"
                data-z="2.05">
            ↑ HIGH
        </button>

        <button class="zone"
                data-x="2.75"
                data-z="2.05">
            ↗ HIGH
        </button>

        <button class="zone"
                data-x="-2.75"
                data-z="1.20">
            ← MID
        </button>

        <button class="zone selected"
                data-x="0"
                data-z="1.20">
            CENTER
        </button>

        <button class="zone"
                data-x="2.75"
                data-z="1.20">
            MID →
        </button>

        <button class="zone"
                data-x="-2.75"
                data-z=".32">
            ↙ LOW
        </button>

        <button class="zone"
                data-x="0"
                data-z=".32">
            ↓ LOW
        </button>

        <button class="zone"
                data-x="2.75"
                data-z=".32">
            ↘ LOW
        </button>

    </div>

    <div class="powerWrap">
        <input
            id="power"
            type="range"
            min="40"
            max="100"
            value="76">
    </div>

    <button id="shootBtn">
        SHOOT
    </button>

</div>

<!-- =====================================================
     DEFENSE CONTROLS
===================================================== -->

<div id="defendControls">

    <button class="diveBtn" data-dir="-1">
        ← LEFT
    </button>

    <button class="diveBtn center" data-dir="0">
        CENTER
    </button>

    <button class="diveBtn" data-dir="1">
        RIGHT →
    </button>

</div>

</div>
</div>

<script>
"use strict";

/* =====================================================
   BASIC SETUP
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 1280;
const H = 720;

const $ = id => document.getElementById(id);

const clamp = (v,min,max) =>
    Math.max(min,Math.min(max,v));

const lerp = (a,b,t) =>
    a+(b-a)*t;

const easeOut = t =>
    1-Math.pow(1-t,3);

const rand = (a,b) =>
    a+Math.random()*(b-a);


/* =====================================================
   TEAMS
===================================================== */

const TEAMS = {

    kbfc:{
        name:"Kerala Blasters",
        short:"KBFC",
        primary:"#f4c400",
        secondary:"#123d91",
        accent:"#ffe36b",
        badge:"KB"
    },

    mbsg:{
        name:"Mohun Bagan",
        short:"MBSG",
        primary:"#008f52",
        secondary:"#7b173d",
        accent:"#27c982",
        badge:"MB"
    },

    mumbai:{
        name:"Mumbai City",
        short:"MCFC",
        primary:"#65c4e8",
        secondary:"#123c73",
        accent:"#8cddff",
        badge:"MC"
    },

    bengaluru:{
        name:"Bengaluru FC",
        short:"BFC",
        primary:"#0871c9",
        secondary:"#e8edf1",
        accent:"#55aef5",
        badge:"BFC"
    },

    eastbengal:{
        name:"East Bengal",
        short:"EBFC",
        primary:"#df332f",
        secondary:"#f3c300",
        accent:"#ff5b55",
        badge:"EB"
    },

    goa:{
        name:"FC Goa",
        short:"FCG",
        primary:"#e66d16",
        secondary:"#243b8c",
        accent:"#ff913e",
        badge:"GOA"
    },

    chennaiyin:{
        name:"Chennaiyin FC",
        short:"CFC",
        primary:"#087bb9",
        secondary:"#102f61",
        accent:"#35b5ff",
        badge:"CFC"
    },

    hyderabad:{
        name:"Hyderabad FC",
        short:"HFC",
        primary:"#f4a900",
        secondary:"#171717",
        accent:"#ffd34c",
        badge:"HFC"
    },

    odisha:{
        name:"Odisha FC",
        short:"OFC",
        primary:"#241b78",
        secondary:"#e33d43",
        accent:"#6f66dd",
        badge:"OFC"
    },

    jamshedpur:{
        name:"Jamshedpur FC",
        short:"JFC",
        primary:"#d71920",
        secondary:"#102b55",
        accent:"#ff454c",
        badge:"JFC"
    },

    northeast:{
        name:"NorthEast United",
        short:"NEUFC",
        primary:"#e9b51d",
        secondary:"#15285d",
        accent:"#ffda45",
        badge:"NEU"
    },

    punjab:{
        name:"Punjab FC",
        short:"PFC",
        primary:"#ed2939",
        secondary:"#f2b300",
        accent:"#ff5d6b",
        badge:"PFC"
    }

};

let selectedYour = null;
let selectedOpponent = null;


/* =====================================================
   TEAM SELECTION
===================================================== */

function createTeamCards(){

    $("yourTeams").innerHTML = "";
    $("opponentTeams").innerHTML = "";

    Object.entries(TEAMS).forEach(([id,team])=>{

        $("yourTeams").appendChild(
            createTeamCard(id,team,"your")
        );

        $("opponentTeams").appendChild(
            createTeamCard(id,team,"opponent")
        );

    });

}

function createTeamCard(id,team,type){

    const button =
        document.createElement("button");

    button.className = "teamCard";

    button.dataset.team = id;

    button.innerHTML = `
        <div
            class="teamBadge"
            style="
                background:${team.primary};
                color:${team.secondary};
                border-color:${team.secondary};
            ">
            ${team.badge}
        </div>

        <div class="teamName">
            ${team.name}
        </div>
    `;

    button.onclick = ()=>{

        if(type === "your"){

            selectedYour = id;

            document
                .querySelectorAll("#yourTeams .teamCard")
                .forEach(x =>
                    x.classList.remove("selected")
                );

            button.classList.add("selected");

        }else{

            selectedOpponent = id;

            document
                .querySelectorAll("#opponentTeams .teamCard")
                .forEach(x =>
                    x.classList.remove("selected")
                );

            button.classList.add("selected");
        }

        checkSelection();

    };

    return button;
}

function checkSelection(){

    $("startMatch").disabled =
        !selectedYour ||
        !selectedOpponent ||
        selectedYour === selectedOpponent;

}

createTeamCards();


/* =====================================================
   GAME STATE
===================================================== */

const game = {

    active:false,

    phase:"selection",

    round:1,

    maxRounds:5,

    yourScore:0,

    opponentScore:0,

    yourTaken:false,

    opponentTaken:false,

    suddenDeath:false,

    yourTeam:null,

    opponentTeam:null,

    difficulty:"medium",

    messageTimer:null

};


/* =====================================================
   DIFFICULTY
===================================================== */

const DIFFICULTY = {

    easy:{
        reaction:.48,
        sideReach:.58,
        centerReach:.70,
        diveReach:1.30,

/* =====================================================
   SHOOT BALL
===================================================== */

function shootBall(x,z,power,owner){

    if(ball.active)
        return;

    const cfg =
        DIFFICULTY[game.difficulty];

    ball.active = true;

    ball.owner = owner;

    ball.x = 0;

    ball.z = .12;

    /*
       Better accuracy model:
       More power = slightly less accuracy.
       Human shots still remain controllable.
    */

    let accuracyError;

    if(owner === "you"){

        accuracyError =
            .035 +
            (100-power)*.001;

    }else{

        accuracyError =
            .10;

    }

    ball.targetX =
        clamp(
            x + rand(-accuracyError,accuracyError),
            -3.75,
            3.75
        );

    ball.targetZ =
        clamp(
            z + rand(-accuracyError,accuracyError),
            .05,
            2.40
        );

    /*
       Power changes flight speed.
    */

    const speed =
        19 + power*.115;

    ball.duration =
        10.8/speed;

    /*
       Make powerful shots slightly faster.
    */

    if(power > 88)
        ball.duration *= .91;

    ball.startTime =
        performance.now();

    ball.trail = [];

    game.phase =
        owner === "you"
            ? "playerFlight"
            : "cpuFlight";

    showShootControls(false);

    showDefendControls(false);

    if(owner === "you"){

        status(
            "SHOT!",
            game.opponentTeam.name +
            " goalkeeper reacts..."
        );

        startCPUKeeper();

    }else{

        status(
            "CPU SHOOTS!",
            "Your goalkeeper is diving..."
        );

    }

}


/* =====================================================
   CPU KEEPER AI
===================================================== */

function startCPUKeeper(){

    const cfg =
        DIFFICULTY[game.difficulty];

    /*
       Keeper does NOT instantly teleport.
       He reacts after a realistic delay.
    */

    let prediction =
        rand(
            -cfg.predictionError,
            cfg.predictionError
        );

    /*
       Hard mode reads the direction better.
    */

    if(game.difficulty === "hard"){

        prediction *= .55;

    }

    keeper.startX = 0;

    keeper.x = 0;

    keeper.targetX =
        clamp(
            ball.targetX + prediction,
            -3.35,
            3.35
        );

    if(
        keeper.targetX < -.55
    ){

        keeper.direction = -1;

    }else if(
        keeper.targetX > .55
    ){

        keeper.direction = 1;

    }else{

        keeper.direction = 0;

    }

    keeper.startTime =
        performance.now() +
        cfg.reaction*1000;

    keeper.duration =
        .42;

    keeper.active = true;

}

function chooseDive(direction){

    )

    keeper.startX = keeper.x;

    keeper.targetX =

            ? -3.15
            : direction === 1
                ? 3.15

            ? .28
            : .43;

            ? "DIVING LEFT"
            : direction > 0

                : "STAYING CENTER",

    );

/* =====================================================
   CPU SHOOT
===================================================== */

function cpuShoot(){

    if(
        !game.active ||
        game.phase !== "defend"
    )
        return;

    const r = Math.random();

    let x;

    /*
       CPU distribution.
    */

    if(r < .32){

        x = rand(-3.25,-2.15);

    }else if(r < .64){

        x = rand(2.15,3.25);

    }else if(r < .82){

        x = rand(-.65,.65);

    }else{

        x = rand(-2.8,2.8);

    }

    let z;

    if(Math.random() < .30){

        z = rand(1.75,2.30);

    }else{

        z = rand(.30,1.55);

    }

    let power =
        rand(67,96);

    /*
       Difficulty affects CPU accuracy.
    */

    if(game.difficulty === "easy"){

        x += rand(-.55,.55);

        z += rand(-.25,.25);

    }

    if(game.difficulty === "hard"){

        x += rand(-.12,.12);

        z += rand(-.08,.08);

    }

    shootBall(
        x,
        z,
        power,
        "cpu"
    );

}


/* =====================================================
   BALL UPDATE
===================================================== */

function updateBall(now){

    if(!ball.active)
        return;

    const t =
        clamp(
            (now-ball.startTime) /
            (1000*ball.duration),
            0,
            1
        );

    /*
       Ball moves toward goal.
    */

    ball.x =
        lerp(
            0,
            ball.targetX,
            easeOut(t)
        );

    /*
       Realistic vertical arc.
    */

    const arc =
        Math.sin(Math.PI*t);

    ball.z =
        lerp(
            .12,
            ball.targetZ,
            t
        ) +
        arc*.62;

    const p =
        ballScreen(t);

    ball.trail.push({
        x:p.x,
        y:p.y
    });

    if(ball.trail.length > 13)
        ball.trail.shift();

    if(t >= 1){

        ball.active = false;

        resolveShot();

    }

}


/* =====================================================
   KEEPER UPDATE
===================================================== */

function updateKeeper(now){

    if(!keeper.active)
        return;

    /*
       CPU keeper waits before reacting.
    */

    if(
        ball.owner === "you" &&
        now < keeper.startTime
    ){

        return;

    }

    const t =
        clamp(
            (now-keeper.startTime) /
            (1000*keeper.duration),
            0,
            1
        );

    keeper.x =
        lerp(
            keeper.startX,
            keeper.targetX,
            easeOut(t)
        );

    if(t >= 1){

        keeper.active = false;

    }

}


/* =====================================================
   SHOT RESOLUTION
===================================================== */

function resolveShot(){

    const x = ball.targetX;

    const z = ball.targetZ;

    /*
       Shot outside frame.
    */

    if(
        x < -3.66 ||
        x > 3.66 ||
        z < 0 ||
        z > 2.44
    ){

        finishShot(
            false,
            x < -3.66 || x > 3.66
                ? "WIDE!"
                : "OVER THE BAR!"
        );

        return;

    }

    const cfg =
        DIFFICULTY[game.difficulty];

    /*
       Distance between shot and keeper.
    */

    const horizontalDistance =
        Math.abs(
            x - keeper.x
        );

    /*
       Height makes high shots harder.
    */

    let reach;

    if(
        keeper.direction === 0
    ){

        reach =
            cfg.centerReach;

    }else{

        reach =
            cfg.diveReach;

    }

    /*
       Keeper diving the wrong side
       cannot magically reach the ball.
    */

    if(
        keeper.direction === -1 &&
        x > -.45
    ){

        reach = .16;

    }

    if(
        keeper.direction === 1 &&
        x < .45
    ){

        reach = .16;

    }

    /*
       Center keeper has very limited reach
       toward extreme corners.
    */

    if(
        keeper.direction === 0 &&
        Math.abs(x) > 1.05
    ){

        reach = .12;

    }

    /*
       High corners are harder.
    */

    if(z > 1.65){

        reach *= .72;

    }

    /*
       Very low corners are also harder
       because the keeper has to get down.
    */

    if(z < .48){

        reach *= .86;

    }

    /*
       Distance from keeper's actual body.
    */

    const saved =
        horizontalDistance <= reach;

    if(saved){

        finishShot(
            false,
            ball.owner === "you"
                ? "SAVED!"
                : "GREAT SAVE!"
        );

    }else{

        finishShot(
            true,
            ball.owner === "you"
                ? "GOAL!"
                : "CPU SCORES!"
        );

    }

}


/* =====================================================
   FINISH SHOT
===================================================== */

function finishShot(scored,text){

    const owner =
        ball.owner;

    /*
       IMPORTANT:
       Save current round before changing anything.
       This fixes scoreboard slot problems.
    */

    const shotRound =
        game.round - 1;

    if(owner === "you"){

        if(scored){

            game.yourScore++;

            markSlot(
                "you",
                "goal",
                shotRound
            );

        }else{

            markSlot(
                "you",
                "miss",
                shotRound
            );

        }

        game.yourTaken = true;

    }else{

        if(scored){

            game.opponentScore++;

            markSlot(
                "opp",
                "goal",
                shotRound
            );

        }else{

            markSlot(
                "opp",
                "miss",
                shotRound
            );

        }

        game.opponentTaken = true;

    }

    /*
       Update immediately.
    */

    updateScoreboard();

    status(
        text,
        `${game.yourTeam.short} ${game.yourScore} - ` +
        `${game.opponentScore} ${game.opponentTeam.short}`
    );

    setTimeout(
        nextTurn,
        1150
    );

}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn(){

    ball.active = false;

    keeper.active = false;

    /*
       Player finished.
       CPU now shoots.
    */

    if(
        game.yourTaken &&
        !game.opponentTaken
    ){

        beginDefense();

        return;

    }

    /*
       Both penalties finished.
    */

    if(
        game.yourTaken &&
        game.opponentTaken
    ){

        /*
           Normal 5 rounds.
        */

        if(
            game.round >= game.maxRounds &&
            game.yourScore !== game.opponentScore
        ){

            finishGame();

            return;

        }

        /*
           Still tied after normal rounds.
        */

        if(
            game.round >= game.maxRounds &&
            game.yourScore === game.opponentScore
        ){

            game.suddenDeath = true;

            game.maxRounds++;

        }

        game.round++;

        game.yourTaken = false;

        game.opponentTaken = false;

        /*
           IMPORTANT:
           Do NOT recreate old slots.
           Preserve previous round results.
           Add one new slot only for sudden death.
        */

        if(
            $("yourSlots").children.length <
            game.maxRounds
        ){

            const a =
                document.createElement("span");

            a.className = "slot";

            $("yourSlots").appendChild(a);


            const b =
                document.createElement("span");

            b.className = "slot";

            $("oppSlots").appendChild(b);

        }

        updateScoreboard();

        if(game.suddenDeath){

            status(
                "SUDDEN DEATH",
                "One penalty each — winner takes it"
            );

        }

        startYourPenalty();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function finishGame(){

    game.active = false;

    showShootControls(false);

    showDefendControls(false);

    let title;

    if(
        game.yourScore >
        game.opponentScore
    ){

        title =
            game.yourTeam.name.toUpperCase() +
            " WIN!";

    }else{

        title =
            game.opponentTeam.name.toUpperCase() +
            " WIN!";

    }

    status(
        title,
        `${game.yourScore} - ${game.opponentScore} • RESET TO PLAY AGAIN`
    );

}


/* =====================================================
   FIELD PROJECTION
===================================================== */

function goalX(worldX){

    return W/2 +
        worldX*80;

}

function goalY(worldZ){

    return 316 -
        worldZ*72;

}


/*
   Ball perspective:
   starts near kicker and finishes at goal.
*/

function ballScreen(t){

    const scale =
        lerp(
            190,
            80,
            t
        );

    return {

        x:
            W/2 +
            ball.x*scale,

        y:
            lerp(
                WORLD.kickerY,
                316,
                t
            ) -
            ball.z*72

    };

}


/* =====================================================
   STADIUM
===================================================== */

function drawStadium(){

    /*
       Sky / stadium roof.
    */

    const sky =
        ctx.createLinearGradient(
            0,0,
            0,330
        );

    sky.addColorStop(
        0,
        "#08131c"
    );

    sky.addColorStop(
        .45,
        "#263b45"
    );

    sky.addColorStop(
        1,
        "#111c20"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        330
    );


    /*
       Stadium lights.
    */

    for(let i=0;i<8;i++){

        const x =
            80+i*160;

        ctx.fillStyle =
            "rgba(255,255,230,.9)";

        ctx.beginPath();

        ctx.arc(
            x,
            92 + (i%2)*18,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "rgba(255,255,220,.08)";

        ctx.beginPath();

        ctx.moveTo(
            x-9,
            100+(i%2)*18
        );

        ctx.lineTo(
            x+9,
            100+(i%2)*18
        );

        ctx.lineTo(
            x+90,
            315
        );

        ctx.lineTo(
            x-90,
            315
        );

        ctx.closePath();

        ctx.fill();

    }


    /*
       Upper stadium.
    */

    ctx.fillStyle="#0b1115";

    ctx.fillRect(
        0,
        135,
        W,
        110
    );


    /*
       Crowd.
    */

    for(let row=0;row<7;row++){

        const y =
            150 + row*14;

        for(let i=0;i<80;i++){

            const x =
                i*17 +
                (row%2)*8;

            const shade =
                45+
                Math.floor(
                    Math.random()*30
                );

            ctx.fillStyle =
                `rgb(${shade},${shade+5},${shade+8})`;

            ctx.fillRect(
                x,
                y,
                7,
                5
            );

        }

    }


    /*
       Advertising boards.
    */

    ctx.fillStyle="#101b20";

    ctx.fillRect(
        0,
        244,
        W,
        45
    );

    for(let i=0;i<12;i++){

        ctx.fillStyle =
            i%2===0
                ? "#26353b"
                : "#17252a";

        ctx.fillRect(
            i*110,
            250,
            104,
            29
        );

    }


    /*
       Stadium lower shadow.
    */

    const shade =
        ctx.createLinearGradient(
            0,
            230,
            0,
            340
        );

    shade.addColorStop(
        0,
        "rgba(0,0,0,.1)"
    );

    shade.addColorStop(
        1,
        "rgba(0,0,0,.65)"
    );

    ctx.fillStyle = shade;

    ctx.fillRect(
        0,
        220,
        W,
        110
    );

}


/* =====================================================
   PITCH
===================================================== */

function drawPitch(){

    const top = 290;

    const pitch =
        ctx.createLinearGradient(
            0,
            top,
            0,
            H
        );

    pitch.addColorStop(
        0,
        "#2f8b43"
    );

    pitch.addColorStop(
        .5,
        "#176a31"
    );

    pitch.addColorStop(
        1,
        "#0a3d20"
    );

    ctx.fillStyle = pitch;

    ctx.fillRect(
        0,
        top,
        W,
        H-top
    );


    /*
       Grass stripes.
    */

    for(let i=0;i<12;i++){

        ctx.fillStyle =
            i%2===0
                ? "rgba(255,255,255,.025)"
                : "rgba(0,0,0,.045)";

        ctx.fillRect(
            0,
            top+i*38,
            W,
            38
        );

    }


    /*
       Penalty area perspective.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.65)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(385,315);

    ctx.lineTo(895,315);

    ctx.lineTo(1035,720);

    ctx.moveTo(385,315);

    ctx.lineTo(245,720);

    ctx.stroke();


    /*
       Small six-yard box.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.4)";

    ctx.beginPath();

    ctx.moveTo(475,315);

    ctx.lineTo(805,315);

    ctx.lineTo(855,445);

    ctx.lineTo(425,445);

    ctx.closePath();

    ctx.stroke();


    /*
       Penalty spot.
    */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        W/2,
        WORLD.kickerY,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   GOAL
===================================================== */

function drawGoal(){

    const left =
        goalX(WORLD.goalLeft);

    const right =
        goalX(WORLD.goalRight);

    const top =
        goalY(WORLD.goalHeight);

    const bottom =
        goalY(0);


    /*
       Net.
    */

    ctx.save();

    ctx.strokeStyle =
        "rgba(255,255,255,.24)";

    ctx.lineWidth = 1;

    for(
        let x=left;
        x<=right;
        x+=16
    ){

        ctx.beginPath();

        ctx.moveTo(x,top);

        ctx.lineTo(x,bottom);

        ctx.stroke();

    }

    for(
        let y=top;
        y<=bottom;
        y+=13
    ){

        ctx.beginPath();

        ctx.moveTo(left,y);

        ctx.lineTo(right,y);

        ctx.stroke();

    }

    ctx.restore();


    /*
       Goal posts.
    */

    ctx.strokeStyle="#f3f5f6";

    ctx.lineWidth=7;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(left,bottom);

    ctx.lineTo(left,top);

    ctx.lineTo(right,top);

    ctx.lineTo(right,bottom);

    ctx.stroke();

}


/* =====================================================
   PLAYER / KICKER
===================================================== */

function drawPlayer(){

    const team =
        ball.owner === "cpu"
            ? game.opponentTeam
            : game.yourTeam;

    if(!team)
        return;

    /*
       Player stands far enough
       behind the ball.
    */

    const x = W/2;

    const y = 637;

    ctx.save();

    ctx.translate(x,y);

    /*
       Shadow.
    */

    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        49,
        30,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs.
    */

    ctx.fillStyle="#111923";

    ctx.fillRect(
        -14,
        18,
        11,
        37
    );

    ctx.fillRect(
        3,
        18,
        11,
        37
    );


    /*
       Boots.
    */

    ctx.fillStyle="#090b0d";

    ctx.fillRect(
        -18,
        49,
        18,
        7
    );

    ctx.fillRect(
        1,
        49,
        18,
        7
    );


    /*
       Jersey.
    */

    ctx.fillStyle =
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -23,
        -36,
        46,
        60,
        7
    );

    ctx.fill();


    /*
       Team secondary center design.
    */

    ctx.fillStyle =
        team.secondary;

    ctx.fillRect(
        -4,
        -36,
        8,
        60
    );


    /*
       Arms.
    */

    ctx.strokeStyle =
        team.primary;

    ctx.lineWidth=12;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -20,
        -22
    );

    ctx.lineTo(
        -39,
        3
    );

    ctx.moveTo(
        20,
        -22
    );

    ctx.lineTo(
        39,
        3
    );

    ctx.stroke();


    /*
       Head.
    */

    ctx.fillStyle="#9b6954";

    ctx.beginPath();

    ctx.arc(
        0,
        -52,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair.
    */

    ctx.fillStyle="#171719";

    ctx.beginPath();

    ctx.arc(
        0,
        -58,
        16,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
       Jersey badge.
    */

    ctx.fillStyle =
        team.secondary;

    ctx.beginPath();

    ctx.arc(
        -13,
        -21,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   KEEPER
===================================================== */

function drawKeeper(){

    const team =
        game.yourTeam &&
        game.opponentTeam
            ? (
                game.phase === "defend" ||
                ball.owner === "cpu"
                    ? game.yourTeam
                    : game.opponentTeam
              )
            : {
                primary:"#f4c400",
                secondary:"#123d91"
              };

    const x =
        goalX(keeper.x);

    const y =
        WORLD.keeperGoalLineY;

    const movement =
        keeper.targetX -
        keeper.startX;

    const lean =
        clamp(
            movement/3,
            -1,
            1
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );


    /*
       Diving body becomes more horizontal.
    */

    if(keeper.active){

        ctx.rotate(
            lean*.25
        );

    }


    /*
       Keeper shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        65,
        38 +
        Math.abs(lean)*30,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs.
    */

    ctx.fillStyle =
        team.secondary;

    ctx.fillRect(
        -18,
        20,
        13,
        43
    );

    ctx.fillRect(
        5,
        20,
        13,
        43
    );


    /*
       Keeper body.
    */

    ctx.fillStyle =
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -26,
        -43,
        52,
        70,
        8
    );

    ctx.fill();


    /*
       Secondary stripe.
    */

    ctx.fillStyle =
        team.secondary;

    ctx.fillRect(
        -4,
        -43,
        8,
        70
    );


    /*
       Arms.
    */

    const stretch =
        31 +
        Math.abs(lean)*45;

    ctx.strokeStyle =
        team.primary;

    ctx.lineWidth=14;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -21,
        -27
    );

    ctx.lineTo(
        lean < 0
            ? -stretch
            : -31,
        -17
    );

    ctx.moveTo(
        21,
        -27
    );

    ctx.lineTo(
        lean > 0
            ? stretch
            : 31,
        -17
    );

    ctx.stroke();


    /*
       Gloves.
    */

    ctx.fillStyle="#f2f4f4";

    ctx.beginPath();

    ctx.arc(
        lean < 0
            ? -stretch
            : -31,
        -17,
        9,
        0,
        Math.PI*2
    );

    ctx.arc(
        lean > 0
            ? stretch
            : 31,
        -17,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Head.
    */

    ctx.fillStyle="#a96f56";

    ctx.beginPath();

    ctx.arc(
        0,
        -61,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair.
    */

    ctx.fillStyle="#151719";

    ctx.beginPath();

    ctx.arc(
        0,
        -67,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   BALL
===================================================== */

function drawBall(){

    if(!ball.active)
        return;

    /*
       Trail.
    */

    ball.trail.forEach((p,i)=>{

        const alpha =
            (i/ball.trail.length)*.22;

        ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

    });


    const t =
        clamp(
            (performance.now()-ball.startTime) /
            (1000*ball.duration),
            0,
            1
        );

    const p =
        ballScreen(t);

    const radius =
        lerp(
            16,
            7,
            t
        );


    /*
       Ball shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+10,
        radius*1.25,
        radius*.34,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball.
    */

    const gradient =
        ctx.createRadialGradient(
            p.x-radius*.3,
            p.y-radius*.35,
            1,
            p.x,
            p.y,
            radius
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .72,
        "#e5e8e9"
    );

    gradient.addColorStop(
        1,
        "#8b9499"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball pattern.
    */

    ctx.strokeStyle="#222";

    ctx.lineWidth =
        Math.max(
            .5,
            radius*.07
        );

    ctx.beginPath();

    ctx.moveTo(
        p.x-radius*.42,
        p.y
    );

    ctx.lineTo(
        p.x+radius*.42,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-radius*.42
    );

    ctx.lineTo(
        p.x,
        p.y+radius*.42
    );

    ctx.stroke();

}


/* =====================================================
   TARGET
===================================================== */

function drawTarget(){

    if(game.phase !== "shoot")
        return;

    const x =
        goalX(
            selectedZone.x
        );

    const y =
        goalY(
            selectedZone.z
        );

    const color =
        game.yourTeam
            ? game.yourTeam.primary
            : "#ffd43b";

    ctx.save();

    ctx.strokeStyle=color;

    ctx.lineWidth=3;

    ctx.shadowColor=color;

    ctx.shadowBlur=15;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        18,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.beginPath();

    ctx.moveTo(
        x-24,
        y
    );

    ctx.lineTo(
        x+24,
        y
    );

    ctx.moveTo(
        x,
        y-24
    );

    ctx.lineTo(
        x,
        y+24
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   CAMERA / VIGNETTE
===================================================== */

function drawVignette(){

    const gradient =
        ctx.createRadialGradient(
            W/2,
            H/2,
            250,
            W/2,
            H/2,
            780
        );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.42)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawStadium();

    drawPitch();

    drawGoal();

    /*
       Player remains visible behind
       the ball during penalty setup.
    */

    drawPlayer();

    drawKeeper();

    drawTarget();

    drawBall();

    drawVignette();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(now){

    updateBall(now);

    updateKeeper(now);

    render();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =====================================================
   DIFFICULTY
===================================================== */

$("difficulty").onchange = ()=>{

    updateDifficulty();

    if(game.active){

        status(
            "DIFFICULTY UPDATED",
            "Keeper AI adjusted for the next shot"
        );

    }

};


/* =====================================================
   INITIAL UI
===================================================== */

setupScoreSlots();

updateScoreboard();

status(
    "SELECT TEAMS",
    "Choose your team and opponent"
);

</script>
