<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<meta name="theme-color" content="#07100c">

<title>ISL Penalty Shootout</title>

<style>

/* =========================================================
   RESET
========================================================= */

:root{
    --accent:#f4c400;
    --accent2:#123d91;
    --green:#1cc96b;
    --danger:#e94350;
    --bg:#030708;
    --panel:#091116;
    --panel2:#0d171d;
    --line:rgba(255,255,255,.14);
    --muted:#91a0a7;
    --white:#fff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 0%,
            #1b292f 0%,
            #071014 42%,
            #020405 100%
        );
    color:#fff;
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

button,
select,
input{
    font:inherit;
}

button{
    border:0;
    color:#fff;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.97);
}

/* =========================================================
   APP
========================================================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#gameFrame{
    position:relative;
    width:min(100vw,177.78vh);
    height:min(100vh,56.25vw);

    overflow:hidden;

    background:#0d3d20;

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        0 30px 90px rgba(0,0,0,.8);

    isolation:isolate;
}

#game{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}

/* =========================================================
   SAFE AREA
========================================================= */

.safeTop{
    padding-top:env(safe-area-inset-top);
}

.safeBottom{
    padding-bottom:env(safe-area-inset-bottom);
}

/* =========================================================
   TEAM SCREEN
========================================================= */

#teamScreen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(16px,env(safe-area-inset-top))
        max(16px,env(safe-area-inset-right))
        max(16px,env(safe-area-inset-bottom))
        max(16px,env(safe-area-inset-left));

    background:
        linear-gradient(
            180deg,
            rgba(2,6,9,.82),
            rgba(2,5,8,.97)
        );

    backdrop-filter:blur(14px);
}

.teamPanel{
    width:min(900px,100%);
    max-height:94%;

    overflow:auto;

    padding:28px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(18,29,36,.98),
            rgba(5,11,16,.99)
        );

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 35px 100px rgba(0,0,0,.85);
}

.gameTitle{
    text-align:center;

    font-size:
        clamp(24px,4vw,48px);

    line-height:1;

    font-weight:1000;

    letter-spacing:
        clamp(1px,.3vw,3px);
}

.gameSubtitle{
    margin-top:8px;

    text-align:center;

    color:#84939a;

    font-size:10px;

    letter-spacing:2px;
}

.selectionTitle{
    margin:
        22px 0 10px;

    color:#9aa8ae;

    font-size:10px;

    font-weight:1000;

    letter-spacing:1.6px;
}

.teamGrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.teamCard{
    min-height:82px;

    padding:10px 6px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #17252d,
            #091117
        );

    border:1px solid rgba(255,255,255,.11);

    transition:
        transform .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;
}

.teamCard:hover{
    transform:translateY(-2px);
}

.teamCard.selected{
    border-color:var(--accent);

    box-shadow:
        0 0 0 2px var(--accent),
        0 0 28px rgba(255,200,50,.18);
}

.teamBadge{
    width:36px;
    height:36px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.5);

    font-size:9px;
    font-weight:1000;
}

.teamName{
    margin-top:8px;

    font-size:10px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#startMatch{
    width:270px;
    max-width:100%;

    height:50px;

    display:block;

    margin:
        25px auto 0;

    border-radius:10px;

    background:
        linear-gradient(
            180deg,
            #ffe866,
            #d4a315
        );

    color:#171200;

    font-size:11px;
    font-weight:1000;

    letter-spacing:1px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

#startMatch:disabled{
    opacity:.32;
    cursor:not-allowed;
}

/* =========================================================
   TOP HUD
========================================================= */

#topHUD{
    position:absolute;

    z-index:100;

    top:
        max(10px,env(safe-area-inset-top));

    left:
        max(10px,env(safe-area-inset-left));

    right:
        max(10px,env(safe-area-inset-right));

    display:grid;

    grid-template-columns:
        minmax(220px,340px)
        1fr
        auto;

    align-items:start;

    gap:10px;

    pointer-events:none;
}

/* =========================================================
   SCOREBOARD
========================================================= */

.scoreBox{
    width:100%;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(3,9,14,.92);

    border:
        1px solid rgba(255,255,255,.16);

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);

    backdrop-filter:blur(12px);

    pointer-events:auto;
}

.scoreTeam{
    display:grid;

    grid-template-columns:
        62px
        1fr
        44px;

    min-height:43px;

    border-bottom:
        1px solid rgba(255,255,255,.09);
}

.scoreTeam:last-child{
    border-bottom:0;
}

.scoreName{
    display:flex;

    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:1000;
}

.scoreSlots{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:4px;

    overflow:hidden;
}

.slot{
    width:19px;
    height:13px;

    flex:0 0 auto;

    border-radius:3px;

    background:#e8ecee;

    border:1px solid rgba(255,255,255,.6);
}

.slot.goal{
    background:#22d47b;
    border-color:#9affca;
}

.slot.miss{
    background:#e74855;
    border-color:#ffadb5;
}

.scoreNumber{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#f2cf1b;

    color:#101000;

    font-size:19px;
    font-weight:1000;
}

/* =========================================================
   CENTER MATCH INFO
========================================================= */

#centerInfo{
    justify-self:center;

    padding:
        7px 18px;

    border-radius:30px;

    background:
        rgba(3,9,14,.88);

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(10px);

    text-align:center;

    pointer-events:none;
}

#centerInfo small{
    display:block;

    color:#89979e;

    font-size:7px;

    letter-spacing:2px;
}

#centerInfo strong{
    font-size:12px;
}

/* =========================================================
   TOP BUTTONS
========================================================= */

#gameButtons{
    display:flex;

    gap:6px;

    pointer-events:auto;
}

.smallBtn{
    min-width:54px;

    height:38px;

    padding:
        0 11px;

    border-radius:8px;

    background:
        rgba(4,12,18,.94);

    border:
        1px solid rgba(255,255,255,.16);

    font-size:8px;

    font-weight:1000;
}

.smallBtn:hover{
    background:#17252c;
}

#resetBtn{
    background:#9f303d;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    z-index:90;

    top:86px;

    left:50%;

    transform:translateX(-50%);

    min-width:260px;

    max-width:55%;

    padding:
        8px 17px;

    border-radius:12px;

    text-align:center;

    background:
        rgba(3,9,14,.78);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(10px);

    pointer-events:none;
}

#statusMain{
    font-size:18px;
    font-weight:1000;

    letter-spacing:.8px;
}

#statusSub{
    margin-top:3px;

    color:#aab5bb;

    font-size:9px;
}

/* =========================================================
   DIFFICULTY
========================================================= */

#difficultyBox{
    position:absolute;

    z-index:110;

    top:58px;
    right:10px;

    display:none;

    align-items:center;
    gap:6px;

    padding:
        6px 8px;

    border-radius:8px;

    background:
        rgba(3,10,15,.9);

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(8px);
}

#difficultyBox span{
    color:#87949b;

    font-size:7px;
    font-weight:1000;
}

#difficulty{
    padding:0;

    background:transparent;

    color:white;

    border:0;

    outline:0;

    font-size:8px;

    font-weight:1000;
}

/* =========================================================
   FULLSCREEN
========================================================= */

#fullscreenBtn{
    position:absolute;

    z-index:150;

    right:10px;

    bottom:10px;

    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        rgba(3,10,15,.72);

    border:
        1px solid rgba(255,255,255,.15);

    font-size:15px;

    opacity:.7;
}

/* =========================================================
   SHOOT DOCK
========================================================= */

#shootControls{
    position:absolute;

    z-index:120;

    left:50%;

    bottom:
        max(12px,env(safe-area-inset-bottom));

    transform:translateX(-50%);

    width:min(460px,92%);

    display:none;

    flex-direction:column;

    align-items:center;

    gap:7px;

    padding:9px;

    border-radius:15px;

    background:
        rgba(3,10,15,.72);

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(12px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);
}

.zoneGrid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;
}

.zone{
    height:32px;

    border-radius:7px;

    background:
        rgba(12,25,32,.96);

    border:
        1px solid rgba(255,255,255,.14);

    color:#fff;

    font-size:8px;

    font-weight:1000;
}

.zone.selected{
    background:var(--accent);

    color:#111;

    border-color:#fff5a0;

    box-shadow:
        0 0 12px
        color-mix(
            in srgb,
            var(--accent) 35%,
            transparent
        );
}

.powerRow{
    width:100%;

    display:flex;

    align-items:center;

    gap:7px;
}

.powerLabel{
    width:38px;

    color:#a9b5ba;

    font-size:7px;

    font-weight:1000;
}

.powerWrap{
    flex:1;

    height:30px;

    display:flex;

    align-items:center;

    padding:
        0 8px;

    border-radius:15px;

    background:
        rgba(3,10,15,.9);

    border:
        1px solid rgba(255,255,255,.13);
}

#power{
    width:100%;

    accent-color:var(--accent);
}

#powerValue{
    width:34px;

    text-align:right;

    font-size:8px;

    font-weight:1000;
}

#shootBtn{
    width:100%;

    height:39px;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #ffe967,
            #d4a516
        );

    color:#151200;

    font-size:10px;

    font-weight:1000;

    letter-spacing:1px;
}

/* =========================================================
   DEFEND DOCK
========================================================= */

#defendControls{
    position:absolute;

    z-index:120;

    left:50%;

    bottom:
        max(12px,env(safe-area-inset-bottom));

    transform:translateX(-50%);

    width:min(430px,92%);

    display:none;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    padding:9px;

    border-radius:15px;

    background:
        rgba(3,10,15,.76);

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(12px);
}

.diveBtn{
    height:46px;

    border-radius:9px;

    background:
        linear-gradient(
            180deg,
            #16252c,
            #091217
        );

    border:
        1px solid rgba(255,255,255,.16);

    font-size:9px;

    font-weight:1000;
}

.diveBtn.center{
    background:
        linear-gradient(
            180deg,
            #35d67e,
            #119d53
        );

    color:#03160a;
}

/* =========================================================
   PAUSE
========================================================= */

#pauseOverlay{
    position:absolute;

    inset:0;

    z-index:400;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:blur(8px);
}

.pauseCard{
    width:min(320px,85%);

    padding:24px;

    border-radius:16px;

    background:#0a141a;

    border:1px solid rgba(255,255,255,.15);

    text-align:center;
}

.pauseTitle{
    font-size:24px;
    font-weight:1000;
}

.pauseText{
    margin-top:7px;

    color:#93a0a6;

    font-size:10px;
}

#resumeBtn{
    width:100%;

    height:42px;

    margin-top:18px;

    border-radius:8px;

    background:var(--accent);

    color:#111;

    font-size:10px;

    font-weight:1000;
}

/* =========================================================
   TOUCH FEEDBACK
========================================================= */

button{
    user-select:none;
    -webkit-user-select:none;
}

@media (hover:hover){

    button:hover{
        filter:brightness(1.08);
    }

}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

    .teamGrid{
        grid-template-columns:
            repeat(3,1fr);
    }

    #topHUD{
        grid-template-columns:
            minmax(190px,270px)
            1fr
            auto;
    }

}

/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media(max-width:700px) and (orientation:landscape){

    #gameFrame{
        width:100vw;
        height:100svh;

        border:0;
        border-radius:0;
    }

    #topHUD{
        top:5px;
        left:5px;
        right:5px;

        grid-template-columns:
            minmax(165px,220px)
            1fr
            auto;

        gap:5px;
    }

    .scoreTeam{
        min-height:29px;

        grid-template-columns:
            39px
            1fr
            28px;
    }

    .scoreName{
        font-size:7px;
    }

    .slot{
        width:12px;
        height:8px;
    }

    .scoreNumber{
        font-size:13px;
    }

    #centerInfo{
        padding:5px 10px;
    }

    #centerInfo small{
        font-size:5px;
    }

    #centerInfo strong{
        font-size:8px;
    }

    .smallBtn{
        height:28px;

        min-width:43px;

        padding:0 7px;

        font-size:6px;
    }

    #statusBox{
        top:39px;

        min-width:170px;

        padding:5px 9px;
    }

    #statusMain{
        font-size:10px;
    }

    #statusSub{
        font-size:6px;
    }

    #difficultyBox{
        top:35px;
        right:5px;

        padding:4px 6px;
    }

    #difficultyBox span,
    #difficulty{
        font-size:5px;
    }

    #shootControls{
        width:min(360px,65vw);

        bottom:4px;

        padding:5px;

        gap:4px;
    }

    .zone{
        height:23px;

        font-size:6px;
    }

    .powerRow{
        height:22px;
    }

    .powerWrap{
        height:22px;
    }

    .powerLabel,
    #powerValue{
        font-size:6px;
    }

    #shootBtn{
        height:28px;

        font-size:7px;
    }

    #defendControls{
        width:min(350px,65vw);

        bottom:4px;

        padding:5px;

        gap:3px;
    }

    .diveBtn{
        height:30px;

        font-size:6px;
    }

    #fullscreenBtn{
        width:28px;
        height:28px;

        right:5px;
        bottom:5px;

        font-size:12px;
    }

}

/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media(max-width:700px) and (orientation:portrait){

    #gameFrame{
        width:100vw;
        height:100svh;

        border:0;
        border-radius:0;
    }

    #topHUD{
        top:
            max(5px,env(safe-area-inset-top));

        left:5px;
        right:5px;

        display:flex;

        justify-content:space-between;

        align-items:flex-start;

        gap:5px;
    }

    .scoreBox{
        width:calc(100vw - 105px);

        max-width:none;
    }

    .scoreTeam{
        min-height:31px;

        grid-template-columns:
            42px
            1fr
            29px;
    }

    .scoreName{
        font-size:7px;
    }

    .scoreNumber{
        font-size:13px;
    }

    .slot{
        width:12px;
        height:8px;
    }

    #centerInfo{
        display:none;
    }

    #gameButtons{
        flex-direction:column;

        gap:4px;
    }

    .smallBtn{
        width:46px;
        min-width:46px;

        height:28px;

        padding:0;

        font-size:6px;
    }

    #statusBox{
        top:68px;

        min-width:170px;

        max-width:78%;

        padding:7px 9px;
    }

    #statusMain{
        font-size:11px;
    }

    #statusSub{
        font-size:6.5px;
    }

    #difficultyBox{
        top:112px;

        left:50%;
        right:auto;

        transform:translateX(-50%);

        padding:5px 8px;
    }

    #difficultyBox span,
    #difficulty{
        font-size:6px;
    }

    #shootControls{
        width:calc(100% - 18px);

        bottom:
            max(8px,env(safe-area-inset-bottom));

        padding:7px;

        gap:5px;
    }

    .zone{
        height:30px;

        font-size:7px;
    }

    .powerWrap{
        height:27px;
    }

    .powerLabel{
        font-size:6px;
    }

    #powerValue{
        font-size:7px;
    }

    #shootBtn{
        height:37px;

        font-size:9px;
    }

    #defendControls{
        width:calc(100% - 18px);

        bottom:
            max(8px,env(safe-area-inset-bottom));

        padding:7px;
    }

    .diveBtn{
        height:43px;

        font-size:8px;
    }

    #fullscreenBtn{
        display:none;
    }

    #teamScreen{
        padding:
            max(8px,env(safe-area-inset-top))
            8px
            max(8px,env(safe-area-inset-bottom))
            8px;
    }

    .teamPanel{
        max-height:96%;

        padding:
            16px 10px;

        border-radius:14px;
    }

    .gameTitle{
        font-size:23px;
    }

    .gameSubtitle{
        margin-top:5px;
        margin-bottom:7px;

        font-size:6px;
    }

    .selectionTitle{
        margin:
            9px 0 5px;

        font-size:7px;
    }

    .teamGrid{
        grid-template-columns:
            repeat(3,1fr);

        gap:4px;
    }

    .teamCard{
        min-height:58px;

        padding:
            5px 2px;

        border-radius:8px;
    }

    .teamBadge{
        width:24px;
        height:24px;

        font-size:6px;
    }

    .teamName{
        margin-top:4px;

        font-size:6px;
    }

    #startMatch{
        width:100%;

        height:40px;

        margin-top:11px;

        font-size:8px;
    }

}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px) and (orientation:portrait){

    .scoreBox{
        width:calc(100vw - 94px);
    }

    .scoreTeam{
        grid-template-columns:
            34px
            1fr
            25px;
    }

    .slot{
        width:10px;
    }

    .smallBtn{
        width:41px;
        min-width:41px;
    }

    .zone{
        height:27px;
        font-size:6px;
    }

    #shootControls{
        padding:5px;
    }

    #shootBtn{
        height:34px;
    }

}

/* =========================================================
   FULLSCREEN DEVICE
========================================================= */

:fullscreen #gameFrame{
    width:100vw;
    height:100vh;

    border:0;
    border-radius:0;
}

</style>
</head>

<body>

<div id="app">

<div id="gameFrame">

<canvas id="game"></canvas>


<!-- =====================================================
     TEAM SCREEN
===================================================== -->

<div id="teamScreen">

<div class="teamPanel">

<div class="gameTitle">
    ISL PENALTY SHOOTOUT
</div>

<div class="gameSubtitle">
    SELECT YOUR TEAM AND OPPONENT
</div>


<div class="selectionTitle">
    YOUR TEAM
</div>

<div
    class="teamGrid"
    id="yourTeams">
</div>


<div class="selectionTitle">
    OPPONENT
</div>

<div
    class="teamGrid"

const lerp =
    (a,b,t) =>

const easeOut =
    t =>

const easeInOut =
    t =>
        t<.5
            ? 4*t*t*t
            : 1-Math.pow(-2*t+2,3)/2;

const rand =

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.max(
            1,
            Math.floor(rect.width*dpr)
        );

    canvas.height =
        Math.max(
            1,
            Math.floor(rect.height*dpr)
        );

    W = canvas.width;
    H = canvas.height;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(

    ()=>{
        setTimeout(

);

/* =========================================================
   SHOOT BALL
========================================================= */

function shootBall(
    x,
    z,
    power,
    owner
){

    if(ball.active)
        return;

    ball.active=true;

    ball.owner=owner;

    ball.x=0;

    ball.z=.12;

    ball.power=power;

    let accuracy;

    if(owner==="you"){

        /*
           Human input:
           power affects precision slightly.
        */

        accuracy =
            DIFFICULTY[
                game.difficulty
            ].accuracy;

        accuracy +=
            Math.max(
                0,
                power-90
            )*.002;

    }else{

        accuracy =
            DIFFICULTY[
                game.difficulty
            ].cpuAccuracy;
    }

    ball.targetX =
        clamp(
            x +
            rand(
                -accuracy,
                accuracy
            ),
            -3.82,
            3.82
        );

    ball.targetZ =
        clamp(
            z +
            rand(
                -accuracy*.45,
                accuracy*.45
            ),
            .04,
            2.42
        );


    /*
       Flight speed.
    */

    let speed =
        17.5 +
        power*.125;

    /*
       Hard shots are quicker.
    */

    if(power>=92)
        speed*=1.08;

    ball.duration =
        10.6/speed;

    ball.startTime =
        performance.now();

    ball.trail=[];

    game.phase =
        owner==="you"
            ? "playerFlight"
            : "cpuFlight";

    showShootControls(false);

    showDefendControls(false);


    if(owner==="you"){

        status(
            "SHOT!",
            game.opponentTeam.name +
            " goalkeeper reacts..."
        );

        startCPUKeeper();

    }else{

        status(
            "CPU SHOOTS!",
            "Time your dive..."
        );

    }
}


/* =========================================================
   CPU KEEPER
========================================================= */

function startCPUKeeper(){

    const cfg =
        DIFFICULTY[
            game.difficulty
        ];

    let prediction =
        rand(
            -cfg.accuracy,
            cfg.accuracy
        );

    if(
        game.difficulty==="hard"
    ){

        prediction*=.45;

    }

    keeper.startX=0;

    keeper.x=0;

    keeper.targetX =
        clamp(
            ball.targetX+
            prediction,
            -3.35,
            3.35
        );

    if(
        keeper.targetX<-.55
    ){

        keeper.direction=-1;

    }else if(
        keeper.targetX>.55
    ){

        keeper.direction=1;

    }else{

        keeper.direction=0;
    }

    keeper.startTime =
        performance.now()+
        cfg.reaction*1000;

    keeper.duration =
        .42;

    keeper.active=true;

    keeper.reactionReady=true;
}


/* =========================================================

========================================================= */

let defenseTimeout=null;

function beginDefense(){

    game.phase="defend";

    game.shotLocked=false;

    ball.active=false;

    keeper.x=0;

    keeper.startX=0;

    keeper.targetX=0;

    keeper.active=false;

    showShootControls(false);

    showDefendControls(true);

    status(
        game.opponentTeam.short+
        " PENALTY",
        "Choose where to dive"
    );

    clearTimeout(
        defenseTimeout
    );

    /*
       If player doesn't react,
       stay in the center.
    */

    defenseTimeout =
        setTimeout(
            ()=>{

                if(
                    game.active &&
                    game.phase==="defend"

                    chooseDive(0);

                }

            },
            2700

}

function chooseDive(
    direction

    if(
        !game.active ||
        game.paused ||
        game.phase!=="defend"
    )
        return;

    clearTimeout(
        defenseTimeout
    );

    keeper.direction=
        direction;

    keeper.startX=
        keeper.x;

    keeper.targetX =
        direction===-1
            ? -3.15
            : direction===1
                ? 3.15
                : 0;

    keeper.startTime =
        performance.now();

    keeper.duration =
        direction===0
            ? .25
            : .42;

    keeper.active=true;

    showDefendControls(false);

    status(
        direction<0
            ? "DIVING LEFT"
            : direction>0
                ? "DIVING RIGHT"
                : "CENTER",
        "Read the striker..."
    );

    /*
       Slight delay before CPU kicks.
    */

    setTimeout(
        ()=>{

            if(
                game.active &&
                !game.paused &&
                game.phase==="defend"
            ){

                cpuShoot();

            }

        },
        240
    );
}


/* =========================================================
   CPU SHOOT
========================================================= */

function cpuShoot(){

    if(
        !game.active ||
        game.paused ||
        game.phase!=="defend"
    )
        return;

    const cfg =
        DIFFICULTY[
            game.difficulty
        ];

    const r =
        Math.random();

    let x;

    /*
       Difficulty influences
       how intelligently CPU selects corners.
    */

    if(
        game.difficulty==="easy"
    ){

        const options=[
            -2.8,
            -1.9,
            0,
            1.9,
            2.8
        ];

        x =
            options[
                Math.floor(
                    Math.random()*
                    options.length
                )
            ]+
            rand(-.45,.45);

    }else{

        if(r<.34){

            x=
                rand(
                    -3.25,
                    -2.1
                );

        }else if(r<.68){

            x=
                rand(
                    2.1,
                    3.25
                );

        }else if(r<.84){

            x=
                rand(
                    -.65,
                    .65
                );

        }else{

            x=
                rand(
                    -2.7,
                    2.7
                );
        }

    }


    let z;

    if(
        Math.random()<.28
    ){

        z=
            rand(
                1.75,
                2.30
            );

    }else{

        z=
            rand(
                .28,
                1.55
            );
    }


    /*
       CPU accuracy.
    */

    x +=
        rand(
            -cfg.cpuAccuracy,
            cfg.cpuAccuracy
        );

    z +=
        rand(
            -cfg.cpuAccuracy*.4,
            cfg.cpuAccuracy*.4
        );


    const power =
        rand(67,96);

    shootBall(
        x,
        z,
        power,
        "cpu"
    );
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(now){

    if(
        !ball.active ||
        game.paused
    )
        return;

    const t =
        clamp(
            (
                now-
                ball.startTime
            )/
            (1000*
                ball.duration),
            0,
            1
        );

    ball.x =
        lerp(
            0,
            ball.targetX,
            easeOut(t)
        );

    const arc =
        Math.sin(
            Math.PI*t
        );

    ball.z =
        lerp(
            .12,
            ball.targetZ,
            t
        )+
        arc*.62;

    const p =
        ballScreen(t);

    ball.trail.push({
        x:p.x,
        y:p.y
    });

    if(
        ball.trail.length>15
    )
        ball.trail.shift();

    if(t>=1){

        ball.active=false;

        resolveShot();
    }
}


/* =========================================================
   KEEPER UPDATE
========================================================= */

function updateKeeper(now){

    if(
        !keeper.active ||
        game.paused
    )
        return;

    if(
        ball.owner==="you" &&
        now<keeper.startTime
    ){

        return;
    }

    const t =
        clamp(
            (
                now-
                keeper.startTime
            )/
            (1000*
                keeper.duration),
            0,
            1
        );

    keeper.x =
        lerp(
            keeper.startX,
            keeper.targetX,
            easeOut(t)
        );

    if(t>=1){

        keeper.active=false;
    }
}


/* =========================================================
   RESOLVE SHOT
========================================================= */

function resolveShot(){

    const x =
        ball.targetX;

    const z =
        ball.targetZ;


    /*
       Missed goal.
    */

    if(
        x<-3.66 ||
        x>3.66 ||
        z<0 ||
        z>2.44
    ){

        finishShot(
            false,
            z>2.44
                ? "OVER THE BAR!"
                : "WIDE!"
        );

        return;
    }


    const cfg =
        DIFFICULTY[
            game.difficulty
        ];


    const horizontal =
        Math.abs(
            x-keeper.x
        );


    let reach;


    if(
        keeper.direction===0
    ){

        reach=
            cfg.centerReach;

    }else{

        reach=
            cfg.diveReach;
    }


    /*
       Wrong direction:
       keeper cannot magically cross
       the entire goal.
    */

    if(
        keeper.direction===-1 &&
        x>.35
    ){

        reach=.14;
    }

    if(
        keeper.direction===1 &&
        x<-.35
    ){

        reach=.14;
    }


    /*
       Center keeper has
       reduced corner coverage.
    */

    if(
        keeper.direction===0 &&
        Math.abs(x)>1.05
    ){

        reach=.16;
    }


    /*
       Height changes save probability.
    */

    if(z>1.65){

        reach*=.70;

    }else if(z<.45){

        reach*=.84;
    }


    /*
       High power gives slightly
       more difficulty to save.
    */

    if(
        ball.power>=92
    ){

        reach*=.94;
    }


    const saved =
        horizontal<=reach;


    if(saved){

        finishShot(
            false,
            ball.owner==="you"
                ? "SAVED!"
                : "GREAT SAVE!"
        );

    }else{

        finishShot(
            true,
            ball.owner==="you"
                ? "GOAL!"
                : "CPU SCORES!"
        );
    }
}


/* =========================================================
   FINISH SHOT
========================================================= */

function finishShot(
    scored,
    text
){

    const owner =
        ball.owner;

    /*
       round index:
       current round is 1-based.
    */

    const index =
        game.round-1;


    if(owner==="you"){

        if(scored){

            game.yourScore++;

            markSlot(
                "you",
                "goal",
                index
            );

        }else{

            markSlot(
                "you",
                "miss",
                index
            );
        }

        game.yourTaken=true;

    }else{

        if(scored){

            game.opponentScore++;

            markSlot(
                "opp",
                "goal",
                index
            );

        }else{

            markSlot(
                "opp",
                "miss",
                index
            );
        }

        game.opponentTaken=true;
    }


    updateScoreboard();


    status(
        text,
        game.yourTeam.short+
        " "+
        game.yourScore+
        " - "+
        game.opponentScore+
        " "+
        game.opponentTeam.short
    );


    setTimeout(
        nextTurn,
        1150
    );
}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    if(!game.active)
        return;

    ball.active=false;

    keeper.active=false;


    /*
       Player has taken penalty,
       CPU has not.
    */

    if(
        game.yourTaken &&
        !game.opponentTaken
    ){

        beginDefense();

        return;
    }


    /*
       Both have completed.
    */

    if(
        game.yourTaken &&
        game.opponentTaken
    ){

        /*
           Early win condition.
        */

        const remaining =
            game.maxRounds-
            game.round;

        if(
            !game.suddenDeath &&
            Math.abs(
                game.yourScore-
                game.opponentScore
            )>
            remaining
        ){

            finishGame();

            return;
        }


        /*
           Completed normal five rounds.
        */

        if(
            game.round>=game.maxRounds &&
            game.yourScore!==game.opponentScore
        ){

            finishGame();

            return;
        }


        /*
           Tie after five.
        */

        if(
            game.round>=game.maxRounds &&
            game.yourScore===
            game.opponentScore
        ){

            game.suddenDeath=true;

            game.maxRounds++;

            addScoreSlot();

            status(
                "SUDDEN DEATH",
                "One penalty each — winner takes it"
            );
        }


        game.round++;

        game.yourTaken=false;

        game.opponentTaken=false;

        updateScoreboard();

        startYourPenalty();
    }
}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    game.active=false;

    game.phase="finished";

    showShootControls(false);

    showDefendControls(false);

    let title;

    if(
        game.yourScore>
        game.opponentScore
    ){

        title=
            game.yourTeam.name.toUpperCase()+
            " WIN!";

    }else{

        title=
            game.opponentTeam.name.toUpperCase()+
            " WIN!";
    }


    status(
        title,
        game.yourScore+
        " - "+
        game.opponentScore+
        " • RESET TO PLAY AGAIN"
    );
}


/* =========================================================
   PROJECTION
========================================================= */

function goalX(worldX){

    const c =
        camera();

    return (
        c.cx+
        (
            worldX/3.66
        )*
        (
            c.goalWidth/2
        )
    );
}

function goalY(worldZ){

    const c =
        camera();

    return (
        c.goalBottom-
        (
            worldZ/
            WORLD.goalHeight
        )*
        (
            c.goalBottom-
            c.goalTop
        )
    );
}


/* =========================================================
   BALL SCREEN
========================================================= */

function ballScreen(t){

    const c =
        camera();

    /*
       Ball begins near the penalty spot
       and travels toward the goal.
    */

    const horizontalScale =
        lerp(
            W*.20,
            c.goalWidth/2,
            t
        );

    return {

        x:
            c.cx+
            (
                ball.x/3.66
            )*
            horizontalScale,

        y:
            lerp(
                c.kickerY,
                c.goalBottom-
                ball.targetZ/
                WORLD.goalHeight*
                (
                    c.goalBottom-
                    c.goalTop
                ),
                t
            )-
            ball.z*
            (
                c.goalBottom-
                c.goalTop
            )/
            WORLD.goalHeight

    };
}


/* =========================================================
   STADIUM
========================================================= */

function drawStadium(){

    const c =
        camera();


    /*
       SKY
    */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            c.goalTop
        );

    sky.addColorStop(
        0,
        "#07131b"
    );

    sky.addColorStop(
        .55,
        "#263b44"
    );

    sky.addColorStop(
        1,
        "#111d22"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       STADIUM ROOF
    */

    ctx.fillStyle="#070c10";

    ctx.fillRect(
        0,
        0,
        W,
        H*.18
    );


    /*
       LIGHTS
    */

    const lightCount =
        W/H<1.15
            ? 5
            : 8;

    for(
        let i=0;
        i<lightCount;
        i++
    ){

        const x =
            W*
            (
                .08+
                i*
                (
                    .84/
                    Math.max(
                        1,
                        lightCount-1
                    )
                )
            );

        const y =
            H*.115+
            (i%2)*H*.025;

        ctx.fillStyle=
            "rgba(255,255,235,.95)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(
                3,
                W*.004
            ),
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle=
            "rgba(255,255,230,.045)";

        ctx.beginPath();

        ctx.moveTo(
            x-10,
            y+5
        );

        ctx.lineTo(
            x+10,
            y+5
        );

        ctx.lineTo(
            x+W*.11,
            c.goalTop
        );

        ctx.lineTo(
            x-W*.11,
            c.goalTop
        );

        ctx.closePath();

        ctx.fill();
    }


    /*
       UPPER STANDS
    */

    ctx.fillStyle="#0b1115";

    ctx.fillRect(
        0,
        H*.18,
        W,
        H*.17
    );


    /*
       CROWD
    */

    const rows =
        W/H<1.15
            ? 6
            : 8;

    const columns =
        Math.ceil(
            W/16
        );

    for(
        let row=0;
        row<rows;
        row++
    ){

        const y =
            H*.205+
            row*
            (
                H*.018
            );

        for(
            let i=0;
            i<columns;
            i++
        ){

            /*
               Deterministic-looking crowd
               instead of flickering Math.random.
            */

            const seed =
                (
                    i*17+
                    row*31
                )%11;

            const shade =
                42+
                seed*3;

            ctx.fillStyle=
                `rgb(
                    ${shade},
                    ${shade+5},
                    ${shade+8}
                )`;

            const x =
                i*16+
                (
                    row%2
                    ? 8
                    : 0
                );

            ctx.fillRect(
                x,
                y,
                6,
                4
            );
        }
    }


    /*
       AD BOARDS
    */

    const boardY =
        H*.35;

    ctx.fillStyle="#111b20";

    ctx.fillRect(
        0,
        boardY,
        W,
        H*.055
    );

    const boardCount =
        Math.ceil(
            W/110
        );

    for(
        let i=0;
        i<boardCount;
        i++
    ){

        ctx.fillStyle =
            i%2===0
                ? "#26353b"
                : "#18262b";

        ctx.fillRect(
            i*110,
            boardY+5,
            104,
            H*.037
        );
    }


    /*
       STADIUM SHADOW
    */

    const shade =
        ctx.createLinearGradient(
            0,
            boardY,
            0,
            c.goalTop
        );

    shade.addColorStop(
        0,
        "rgba(0,0,0,.08)"
    );

    shade.addColorStop(
        1,
        "rgba(0,0,0,.65)"
    );

    ctx.fillStyle=shade;

    ctx.fillRect(
        0,
        boardY,
        W,
        c.goalTop-boardY
    );
}


/* =========================================================
   PITCH
========================================================= */

function drawPitch(){

    const c =
        camera();

    const top =
        c.goalTop-.015*H;


    const pitch =
        ctx.createLinearGradient(
            0,
            top,
            0,
            H
        );

    pitch.addColorStop(
        0,
        "#3b984d"
    );

    pitch.addColorStop(
        .45,
        "#176d33"
    );

    pitch.addColorStop(
        1,
        "#083c1f"
    );

    ctx.fillStyle=pitch;

    ctx.fillRect(
        0,
        top,
        W,
        H-top
    );


    /*
       Grass stripes.
    */

    const stripeCount=14;

    for(
        let i=0;
        i<stripeCount;
        i++
    ){

        ctx.fillStyle =
            i%2===0
                ? "rgba(255,255,255,.025)"
                : "rgba(0,0,0,.045)";

        ctx.fillRect(
            0,
            top+
            i*
            (
                (H-top)/
                stripeCount
            ),
            W,
            (
                H-top
            )/
            stripeCount
        );
    }


    /*
       PENALTY BOX
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.62)";

    ctx.lineWidth=
        Math.max(
            1.5,
            W*.0017
        );

    const left=
        c.cx-W*.205;

    const right=
        c.cx+W*.205;

    const boxBottom=
        H;

    ctx.beginPath();

    ctx.moveTo(
        left,
        c.goalBottom
    );

    ctx.lineTo(
        right,
        c.goalBottom
    );

    ctx.lineTo(
        c.cx+
        W*.42,
        boxBottom
    );

    ctx.moveTo(
        left,
        c.goalBottom
    );

    ctx.lineTo(
        c.cx-
        W*.42,
        boxBottom
    );

    ctx.stroke();


    /*
       SIX YARD BOX
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.38)";

    ctx.beginPath();

    ctx.moveTo(
        c.cx-W*.125,
        c.goalBottom
    );

    ctx.lineTo(
        c.cx+W*.125,
        c.goalBottom
    );

    ctx.lineTo(
        c.cx+W*.26,
        H*.65
    );

    ctx.lineTo(
        c.cx-W*.26,
        H*.65
    );

    ctx.closePath();

    ctx.stroke();


    /*
       PENALTY SPOT
    */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        c.cx,
        c.kickerY,
        Math.max(
            2.5,
            W*.003
        ),
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   GOAL
========================================================= */

function drawGoal(){

    const c =
        camera();

    const left=
        c.cx-
        c.goalWidth/2;

    const right=
        c.cx+
        c.goalWidth/2;

    const top=
        c.goalTop;

    const bottom=
        c.goalBottom;


    /*
       NET BACKGROUND
    */

    const netGradient =
        ctx.createLinearGradient(
            0,
            top,
            0,
            bottom
        );

    netGradient.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    netGradient.addColorStop(
        1,
        "rgba(255,255,255,.015)"
    );

    ctx.fillStyle=netGradient;

    ctx.fillRect(
        left,
        top,
        right-left,
        bottom-top
    );


    /*
       NET GRID
    */

    ctx.save();

    ctx.strokeStyle=
        "rgba(255,255,255,.23)";

    ctx.lineWidth=
        Math.max(
            .6,
            W*.0007
        );

    const spacingX=
        Math.max(
            10,
            W*.013
        );

    const spacingY=
        Math.max(
            8,
            H*.018
        );

    for(
        let x=left;
        x<=right;
        x+=spacingX
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }

    for(
        let y=top;
        y<=bottom;
        y+=spacingY
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }

    ctx.restore();


    /*
       POSTS
    */

    ctx.strokeStyle="#f7f8f8";

    ctx.lineWidth=
        Math.max(
            4,
            W*.006
        );

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        left,
        bottom
    );

    ctx.lineTo(
        left,
        top
    );

    ctx.lineTo(
        right,
        top
    );

    ctx.lineTo(
        right,
        bottom
    );

    ctx.stroke();


    /*
       GOAL LINE
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.8)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        left,
        bottom
    );

    ctx.lineTo(
        right,
        bottom
    );

    ctx.stroke();
}

    );

    );

    );

       Head.

    );

    );

}


/* =========================================================
   KEEPER
========================================================= */

function drawKeeper(){

    const team =
        game.yourTeam &&
        game.opponentTeam

            ? (
                game.phase==="defend" ||
                ball.owner==="cpu"
                    ? game.yourTeam
                    : game.opponentTeam
              )

            : {
                primary:"#f4c400",
                secondary:"#123d91"
              };

    const c =
        camera();

    const x =
        goalX(
            keeper.x
        );

    const y =
        c.goalBottom+
        H*.005;

    const scale =
        clamp(
            W/1280,
            .55,
            1.3
        );

    const movement =
        keeper.targetX-
        keeper.startX;

    const lean =
        clamp(
            movement/3,
            -1,
            1
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );


    /*
       Dive rotation.
    */

    if(keeper.active){

        ctx.rotate(
            lean*.22
        );
    }


    /*
       Shadow.
    */

    ctx.fillStyle=
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        64*scale,
        (
            38+
            Math.abs(lean)*28
        )*scale,
        8*scale,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -18*scale,
        20*scale,
        13*scale,
        43*scale
    );

    ctx.fillRect(
        5*scale,
        20*scale,
        13*scale,
        43*scale
    );


    /*
       Body.
    */

    ctx.fillStyle=
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -26*scale,
        -43*scale,
        52*scale,
        70*scale,
        8*scale
    );

    ctx.fill();


    /*
       Stripe.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -4*scale,
        -43*scale,
        8*scale,
        70*scale
    );


    /*
       Arms.
    */

    const stretch =
        (
            31+
            Math.abs(lean)*45
        )*scale;

    ctx.strokeStyle=
        team.primary;

    ctx.lineWidth=
        14*scale;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -21*scale,
        -27*scale
    );

    ctx.lineTo(
        (
            lean<0
                ? -stretch
                : -31*scale
        ),
        -17*scale
    );

    ctx.moveTo(
        21*scale,
        -27*scale
    );

    ctx.lineTo(
        (
            lean>0
                ? stretch
                : 31*scale
        ),
        -17*scale
    );

    ctx.stroke();


    /*
       Gloves.
    */

    ctx.fillStyle="#f4f6f6";

    ctx.beginPath();

    ctx.arc(
        lean<0
            ? -stretch
            : -31*scale,
        -17*scale,
        9*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        lean>0
            ? stretch
            : 31*scale,
        -17*scale,
        9*scale,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Head.
    */

    ctx.fillStyle="#a96f56";

    ctx.beginPath();

    ctx.arc(
        0,
        -61*scale,
        17*scale,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair.
    */

    ctx.fillStyle="#151719";

    ctx.beginPath();

    ctx.arc(
        0,
        -67*scale,
        17*scale,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   BALL
========================================================= */

function drawBall(){

    if(!ball.active)
        return;

    /*
       Trail.
    */

    ball.trail.forEach(
        (p,i)=>{

            const alpha =
                (
                    i/
                    ball.trail.length
                )*.22;

            ctx.fillStyle=
                `rgba(
                    255,
                    255,
                    255,
                    ${alpha}
                )`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                Math.max(
                    2,
                    W*.004
                ),
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );


    const t =
        clamp(
            (
                performance.now()-
                ball.startTime
            )/
            (
                1000*
                ball.duration
            ),
            0,
            1
        );


    const p =
        ballScreen(t);


    const radius =
        lerp(
            W*.012,
            W*.005,
            t
        );


    /*
       Shadow.
    */

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+
        radius*.9,
        radius*1.25,
        radius*.34,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball.
    */

    const gradient =
        ctx.createRadialGradient(
            p.x-radius*.3,
            p.y-radius*.35,
            1,
            p.x,
            p.y,
            radius
        );

    gradient.addColorStop(
        0,
        "#fff"
    );

    gradient.addColorStop(
        .7,
        "#e4e7e8"
    );

    gradient.addColorStop(
        1,
        "#818b90"
    );

    ctx.fillStyle=
        gradient;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball pattern.
    */

    ctx.strokeStyle="#252525";

    ctx.lineWidth=
        Math.max(
            .5,
            radius*.07
        );

    ctx.beginPath();

    ctx.moveTo(
        p.x-radius*.42,
        p.y
    );

    ctx.lineTo(
        p.x+radius*.42,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-radius*.42
    );

    ctx.lineTo(
        p.x,
        p.y+radius*.42
    );

    ctx.stroke();
}


/* =========================================================
   TARGET
========================================================= */

function drawTarget(){

    if(
        game.phase!=="shoot" ||
        game.paused
    )
        return;

    const x =
        goalX(
            selectedZone.x
        );

    const y =
        goalY(
            selectedZone.z
        );

    const color =
        game.yourTeam
            ? game.yourTeam.primary
            : "#ffd43b";

    const size =
        clamp(
            W*.016,
            12,
            22
        );

    ctx.save();

    ctx.strokeStyle=color;

    ctx.lineWidth=
        clamp(
            W*.0025,
            2,
            4
        );

    ctx.shadowColor=color;

    ctx.shadowBlur=
        size*.7;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.beginPath();

    ctx.moveTo(
        x-size*1.35,
        y
    );

    ctx.lineTo(
        x+size*1.35,
        y
    );

    ctx.moveTo(
        x,
        y-size*1.35
    );

    ctx.lineTo(
        x,
        y+size*1.35
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   VIGNETTE
========================================================= */

function drawVignette(){

    const gradient =
        ctx.createRadialGradient(
            W*.5,
            H*.52,
            W*.2,
            W*.5,
            H*.5,
            W*.8
        );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.42)"
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   FIELD LIGHT
========================================================= */

function drawFieldLight(){

    const c =
        camera();

    const gradient =
        ctx.createRadialGradient(
            c.cx,
            c.goalTop,
            20,
            c.cx,
            c.goalTop,
            W*.55
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,235,.09)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,235,0)"
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawStadium();

    drawFieldLight();

    drawPitch();

    drawGoal();

    drawPlayer();

    drawKeeper();

    drawTarget();

    drawBall();

    drawVignette();
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    if(
        game.active &&
        !game.paused
    ){

        updateBall(now);

        updateKeeper(now);
    }

    render();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();

        }else{

            await document
                .exitFullscreen();
        }

    }catch(err){

        console.log(
            "Fullscreen unavailable",
            err
        );
    }
}

$("fullscreenBtn")
    .addEventListener(
        "click",
        toggleFullscreen
    );


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        !game.active ||
        game.phase==="finished"
    )
        return;

    game.paused=true;

    $("pauseOverlay")
        .style.display="flex";
}

function resumeGame(){

    game.paused=false;

    $("pauseOverlay")
        .style.display="none";
}

$("resumeBtn")
    .addEventListener(
        "click",
        resumeGame
);


/* =========================================================
   DOUBLE TAP / ESC PAUSE
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if(e.key==="Escape"){

            if(
                $("pauseOverlay")
                    .style.display==="flex"
            ){

                resumeGame();

            }else{

                pauseGame();
            }
        }

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden &&
            game.active &&
            game.phase!=="finished"
        ){

            pauseGame();
        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

setupScoreSlots();

updateScoreboard();

status(
    "SELECT TEAMS",
    "Choose your team and opponent"
);

$("powerValue")
    .textContent =
        $("power").value;

</script>
