<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#07100c">

<title>ISL Penalty Shootout</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020604;
    color:#fff;
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

button,
select,
input{
    font:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
    touch-action:manipulation;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#gameFrame{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#102d18;
}

/* =========================
   CANVAS
========================= */

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

/* =========================
   TEAM SCREEN
========================= */

#teamScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            rgba(2,7,10,.88),
            rgba(1,4,6,.98)
        );

    backdrop-filter:blur(8px);
}

.teamPanel{
    width:min(950px,100%);
    max-height:96vh;
    overflow:auto;

    padding:24px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(11,20,27,.98),
            rgba(3,9,13,.98)
        );

    box-shadow:
        0 30px 90px #000,
        inset 0 1px rgba(255,255,255,.04);
}

.gameTitle{
    text-align:center;
    font-size:clamp(25px,5vw,48px);
    line-height:1;
    font-weight:1000;
    letter-spacing:2px;
}

.gameSubtitle{
    text-align:center;
    color:#8f9ca5;
    margin:9px 0 20px;
    font-size:11px;
    letter-spacing:2px;
}

.selectionTitle{
    margin:17px 0 9px;
    color:#8e9ca5;
    font-size:10px;
    font-weight:1000;
    letter-spacing:1.8px;
}

.teamGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.teamCard{
    min-height:83px;
    padding:10px 6px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            180deg,
            #15232c,
            #091117
        );

    transition:
        transform .15s,
        border .15s,
        box-shadow .15s;
}

.teamCard:active{
    transform:scale(.96);
}

.teamCard.selected{
    border-color:#fff;
    box-shadow:
        0 0 0 2px var(--teamColor,#ffd21c),
        0 8px 30px rgba(255,210,50,.15);
}

.teamBadge{
    width:34px;
    height:34px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:9px;
    font-weight:1000;

    border:2px solid;
}

.teamName{
    margin-top:7px;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#startMatch{
    display:block;
    width:min(300px,100%);
    height:52px;
    margin:22px auto 0;

    border-radius:10px;

    background:
        linear-gradient(
            180deg,
            #ffe95a,
            #d3a817
        );

    color:#171200;

    font-size:12px;
    font-weight:1000;
    letter-spacing:1px;

    box-shadow:
        0 8px 25px rgba(255,205,40,.15);
}

#startMatch:disabled{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================
   TOP HUD
========================= */

#topHUD{
    position:absolute;
    z-index:100;

    left:12px;
    right:12px;
    top:calc(10px + env(safe-area-inset-top));

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    pointer-events:none;
}

.scoreBox{
    width:330px;
    max-width:55vw;

    background:rgba(3,9,14,.91);

    border:1px solid rgba(255,255,255,.16);
    border-radius:8px;

    overflow:hidden;

    box-shadow:0 10px 35px #0009;

    backdrop-filter:blur(10px);
}

.scoreTeam{
    display:grid;
    grid-template-columns:65px 1fr 46px;

    height:43px;

    border-bottom:1px solid rgba(255,255,255,.10);
}

.scoreTeam:last-child{
    border-bottom:0;
}

.scoreName{
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:1000;
}

.scoreSlots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.slot{
    width:21px;
    height:14px;

    border:1px solid rgba(255,255,255,.45);

    background:#58636a;
}

.slot.goal{
    background:#1ed776;
    border-color:#8effbc;
}

.slot.miss{
    background:#e84755;
    border-color:#ff9ea7;
}

.scoreNumber{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#f5d51a;
    color:#101010;

    font-size:21px;
    font-weight:1000;
}

#centerInfo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    padding:7px 16px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:30px;

    background:rgba(3,9,14,.85);

    text-align:center;

    backdrop-filter:blur(10px);
}

#centerInfo small{
    display:block;
    color:#87959e;
    font-size:7px;
    letter-spacing:2px;
}

#centerInfo strong{
    font-size:12px;
}

#gameButtons{
    display:flex;
    gap:5px;
    pointer-events:auto;
}

.smallBtn{
    height:37px;
    padding:0 12px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:7px;

    color:#fff;
    background:rgba(4,12,18,.92);

    font-size:8px;
    font-weight:1000;
}

#resetBtn{
    background:#b92f40;
}

/* =========================
   STATUS
========================= */

#statusBox{
    position:absolute;
    z-index:90;

    left:50%;
    top:82px;

    transform:translateX(-50%);

    min-width:270px;
    padding:8px 17px;

    border:1px solid rgba(255,255,255,.13);
    border-radius:11px;

    background:rgba(2,8,12,.72);

    text-align:center;

    backdrop-filter:blur(8px);

    pointer-events:none;
}

#statusMain{
    font-size:18px;
    font-weight:1000;
    letter-spacing:1px;
}

#statusSub{
    margin-top:3px;
    color:#a5b0b6;
    font-size:9px;
}

/* =========================
   DIFFICULTY
========================= */

#difficultyBox{
    position:absolute;
    z-index:100;

    right:12px;
    top:60px;

    display:none;
    align-items:center;
    gap:6px;

    padding:6px 9px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:7px;

    background:rgba(3,9,14,.88);
}

#difficultyBox span{
    color:#8c999f;
    font-size:7px;
    font-weight:900;
}

#difficulty{
    border:0;
    outline:0;
    background:transparent;
    color:white;

    font-size:8px;
    font-weight:1000;
}

/* =========================
   SHOOT CONTROLS
========================= */

#shootControls{
    position:absolute;
    z-index:120;

    left:50%;
    bottom:calc(10px + env(safe-area-inset-bottom));

    transform:translateX(-50%);

    display:none;
    flex-direction:column;
    align-items:center;

    gap:7px;
}

.zoneGrid{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:5px;
}

.zone{
    height:35px;

    border:1px solid rgba(255,255,255,.20);
    border-radius:7px;

    color:white;

    background:rgba(3,10,15,.93);

    font-size:8px;
    font-weight:1000;
}

.zone.selected{
    background:var(--accent,#ffd21c);
    color:#101010;

    border-color:white;

    box-shadow:
        0 0 14px rgba(255,220,50,.22);
}

.powerWrap{
    width:220px;
    padding:5px 9px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;

    background:rgba(3,9,14,.91);
}

#power{
    width:100%;
    accent-color:var(--accent,#ffd21c);
}

.powerLabel{
    display:flex;
    justify-content:space-between;

    margin-bottom:1px;

    color:#9ba7ad;
    font-size:7px;
}

#powerValue{
    color:#fff;
}

#shootBtn{
    width:155px;
    height:42px;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #ffe95d,
            #d1a514
        );

    color:#151200;

    font-size:10px;
    font-weight:1000;
    letter-spacing:1px;
}

/* =========================
   DEFEND CONTROLS
========================= */

#defendControls{
    position:absolute;
    z-index:120;

    left:50%;
    bottom:calc(12px + env(safe-area-inset-bottom));

    transform:translateX(-50%);

    display:none;

    gap:7px;
}

.diveBtn{
    min-width:100px;
    height:46px;

    border:1px solid rgba(255,255,255,.22);
    border-radius:8px;

    color:white;

    background:rgba(3,10,15,.94);

    font-size:9px;
    font-weight:1000;
}

.diveBtn.center{
    background:
        linear-gradient(
            180deg,
            #2cdb78,
            #119b50
        );

    color:#03170b;
}

/* =========================
   MOBILE PORTRAIT
========================= */

@media(max-width:700px){

    #teamScreen{
        padding:
            max(8px,env(safe-area-inset-top))
            8px
            max(8px,env(safe-area-inset-bottom))
            8px;
    }

    .teamPanel{
        padding:14px;
        max-height:98vh;
        border-radius:13px;
    }

    .gameTitle{
        font-size:25px;
    }

    .gameSubtitle{
        font-size:7px;
        margin:6px 0 12px;
    }

    .selectionTitle{
        margin:10px 0 6px;
        font-size:8px;
    }

    .teamGrid{
        grid-template-columns:repeat(3,1fr);
        gap:5px;
    }

    .teamCard{
        min-height:62px;
        padding:6px 3px;
        border-radius:7px;
    }

    .teamBadge{
        width:25px;
        height:25px;
        font-size:7px;
    }

    .teamName{
        margin-top:4px;
        font-size:6px;
    }

    #startMatch{
        height:43px;
        margin-top:12px;
        font-size:9px;
    }

    #topHUD{
        top:calc(5px + env(safe-area-inset-top));
        left:5px;
        right:5px;
    }

    .scoreBox{
        width:220px;
        max-width:65vw;
    }

    .scoreTeam{
        height:30px;
        grid-template-columns:43px 1fr 30px;
    }

    .scoreName{
        font-size:8px;
    }

    .slot{
        width:13px;
        height:9px;
    }

    .scoreSlots{
        gap:2px;
    }

    .scoreNumber{
        font-size:14px;
    }

    #centerInfo{
        display:none;
    }

    #gameButtons{
        gap:3px;
    }

    .smallBtn{
        height:28px;
        padding:0 7px;
        font-size:6px;
    }

    #statusBox{
        top:43px;
        min-width:175px;
        max-width:70vw;
        padding:5px 8px;
    }

    #statusMain{
        font-size:11px;
    }

    #statusSub{
        font-size:6px;
    }

    #difficultyBox{
        top:36px;
        right:5px;
        padding:4px 6px;
    }

    #difficultyBox span{
        font-size:5px;
    }

    #difficulty{
        font-size:6px;
    }

    #shootControls{
        bottom:calc(5px + env(safe-area-inset-bottom));
        gap:4px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,58px);
        gap:3px;
    }

    .zone{
        height:28px;
        font-size:6px;
    }

    .powerWrap{
        width:185px;
        padding:3px 7px;
    }

    .powerLabel{
        font-size:6px;
    }

    #shootBtn{
        width:130px;
        height:35px;
        font-size:8px;
    }

    #defendControls{
        bottom:calc(6px + env(safe-area-inset-bottom));
        gap:3px;
    }

    .diveBtn{
        min-width:75px;
        height:35px;
        font-size:6px;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

    .teamPanel{
        padding:10px;
    }

    .teamGrid{
        gap:3px;
    }

    .teamCard{
        min-height:55px;
    }

    .teamBadge{
        width:22px;
        height:22px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,51px);
    }

    .zone{
        height:25px;
        font-size:5px;
    }

    .powerWrap{
        width:165px;
    }

    #shootBtn{
        height:32px;
    }
}

/* =========================
   LANDSCAPE MOBILE
========================= */

@media(
    max-width:900px
) and (
    orientation:landscape
){

    #shootControls{
        left:auto;
        right:12px;
        transform:none;
        bottom:8px;
    }

    #defendControls{
        left:auto;
        right:12px;
        transform:none;
        bottom:10px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,55px);
    }

    .zone{
        height:28px;
    }

    .powerWrap{
        width:175px;
    }

    #shootBtn{
        width:125px;
        height:35px;
    }

    #statusBox{
        top:55px;
    }
}

/* =========================
   FULLSCREEN BUTTON
========================= */

#fullscreenBtn{
    position:absolute;
    z-index:130;

    right:10px;
    bottom:10px;

    width:38px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.18);
    border-radius:7px;

    background:rgba(3,9,14,.75);
    color:white;

    font-size:14px;
}

@media(max-width:700px){
    #fullscreenBtn{
        display:none;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="gameFrame">

<!-- =========================

<div id="teamScreen">

YOU
</div>

<div class="scoreSlots" id="yourSlots"></div>

0
</div>

</div>

<div class="scoreTeam">

<div class="scoreName" id="oppName">
CPU
</div>

<div class="scoreSlots" id="oppSlots"></div>

0

</div>

<strong>
ROUND <span id="round">1</span>

</div>

<!-- =========================

========================= -->

<div id="statusBox">

CENTER

MID →
</button>

↙ LOW
</button>

<button class="zone"
        data-x="0"
        data-z=".35">
↓ LOW
</button>

<button class="zone"
        data-x="2.8"
        data-z=".35">
↘ LOW
</button>

</div>

<div class="powerWrap">

<div class="powerLabel">

<span>
SHOT POWER
</span>

<span id="powerValue">
72%
</span>

</div>

<input

    type="range"
    min="35"
    max="100"
    value="72">

</div>

<button id="shootBtn">
SHOOT
</button>

</div>

<!-- =========================
     DEFEND
========================= -->

<div id="defendControls">

<button class="diveBtn"
        data-dir="-1">
← LEFT
</button>

<button class="diveBtn center"
        data-dir="0">
CENTER
</button>

<button class="diveBtn"
        data-dir="1">
RIGHT →
</button>

</div>

<button id="fullscreenBtn">
⛶
</button>

</div>
</div>

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const $ =
    id => document.getElementById(id);

const clamp =
    (v,min,max)=>
        Math.max(min,Math.min(max,v));

const lerp =
    (a,b,t)=>
        a+(b-a)*t;

const rand =
    (a,b)=>
        a+Math.random()*(b-a);

const easeOut =
    t =>
        1-Math.pow(1-t,3);


/* =====================================================
   RESPONSIVE CANVAS
===================================================== */

let W=1280;
let H=720;

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        Math.max(
            320,
            Math.floor(rect.width*dpr)
        );

    H =
        Math.max(
            240,
            Math.floor(rect.height*dpr)
        );

    canvas.width=W;
    canvas.height=H;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            resizeCanvas,
            100
        );
    }
);

resizeCanvas();

   TEAMS

/* =====================================================
   SHOOT BALL
===================================================== */

function shootBall(
    x,
    z,
    power,
    owner
){

    const cfg =
        DIFFICULTY[
            game.difficulty
        ];

    ball.active=true;

    ball.owner=owner;

    ball.startX=0;

    ball.startZ=
        WORLD.shooterZ;

    ball.currentX=0;

    ball.currentZ=
        WORLD.shooterZ;

    ball.targetX=x;

    ball.targetZ=z;

    /*
       Power affects precision.

       Too much power gives a little
       more variation.
    */

    let accuracyError;

    if(owner==="you"){

        accuracyError =
            cfg.error *
            (
                .18+
                power/100
            );

    }else{

        accuracyError=
            (1-cfg.cpuAccuracy)*.75;
    }

    ball.targetX =
        clamp(
            x+
            rand(
                -accuracyError,
                accuracyError
            ),
            -3.62,
            3.62
        );

    ball.targetZ =
        clamp(
            z+
            rand(
                -accuracyError*.35,
                accuracyError*.35
            ),
            .08,
            2.35
        );

    /*
       Faster powerful shots.
    */

    const speed =
        17+
        power*.13;

    ball.duration =
        10.5/speed;

    ball.startTime=
        performance.now();

    ball.trail=[];

    player.kickAnimation=1;

    game.phase =
        owner==="you"
        ? "playerFlight"
        : "cpuFlight";

    showShootControls(false);
    showDefendControls(false);

    if(owner==="you"){

        status(
            "SHOT!",
            "Goalkeeper is reacting..."
        );

        startCPUKeeper();

    }else{

        status(
            "CPU SHOOTS!",
            "Your goalkeeper is diving..."
        );
    }
}


/* =====================================================
   CPU KEEPER
===================================================== */

function startCPUKeeper(){

    const cfg=
        DIFFICULTY[
            game.difficulty
        ];

    /*
       Prediction is imperfect.

       Keeper does not instantly know
       the exact target.
    */

    let prediction=
        rand(
            -cfg.error,
            cfg.error
        );

    keeper.startX=0;
    keeper.x=0;

    keeper.targetX=
        clamp(
            ball.targetX+
            prediction,
            -3.35,
            3.35
        );

    keeper.direction=
        keeper.targetX<-.65
        ? -1
        :
        keeper.targetX>.65
        ? 1
        : 0;

    keeper.startTime=
        performance.now()+
        cfg.reaction;

    keeper.duration=
        .40;

    keeper.active=true;
}

/* =====================================================
   CPU SHOOT
===================================================== */

function cpuShoot(){

    if(
        !game.active ||
        game.phase!=="defend"
    )
        return;

    const cfg=
        DIFFICULTY[
            game.difficulty
        ];

    let x;
    let z;

    /*
       CPU target selection.

       Higher difficulty prefers
       harder corners.
    */

    const r=
        Math.random();

    if(
        game.difficulty==="easy"
    ){

        if(r<.35){

            x=rand(-.65,.65);

        }else if(r<.67){

            x=rand(-2.7,-1.8);

        }else{

            x=rand(1.8,2.7);
        }

    }else{

        if(r<.38){

            x=rand(-3.25,-2.25);

        }else if(r<.76){

            x=rand(2.25,3.25);

        }else{

            x=rand(-.65,.65);
        }
    }

    /*
       Harder shots use more height.
    */

    if(
        Math.random()<
        (
            game.difficulty==="hard"
            ? .42
            : .28
        )
    ){

        z=rand(1.65,2.25);

    }else{

        z=rand(.28,1.45);
    }

    const power=
        game.difficulty==="easy"
        ? rand(60,82)
        : rand(72,96);

    shootBall(
        x,
        z,
        power,
        "cpu"
    );
}


/* =====================================================
   BALL UPDATE
===================================================== */

function updateBall(now){

    if(!ball.active)
        return;

    const t=
        clamp(
            (
                now-
                ball.startTime
            )/
            1000/
            ball.duration,
            0,
            1
        );

    const eased=
        easeOut(t);

    ball.currentX=
        lerp(
            ball.startX,
            ball.targetX,
            eased
        );

    ball.currentZ=
        lerp(
            ball.startZ,
            ball.targetZ,
            t
        );

    /*
       Trail uses screen coordinates.
    */

    const p=
        ballScreen();

    ball.trail.push({
        x:p.x,
        y:p.y
    });

    if(
        ball.trail.length>12
    ){

        ball.trail.shift();
    }

    if(t>=1){

        ball.active=false;

        resolveShot();
    }
}


/* =====================================================
   KEEPER UPDATE
===================================================== */

function updateKeeper(now){

    if(!keeper.active)
        return;

    /*
       CPU keeper waits for reaction time.
    */

    if(
        ball.owner==="you" &&
        now<keeper.startTime
    ){

        return;
    }

    const t=
        clamp(
            (
                now-
                keeper.startTime
            )/
            1000/
            keeper.duration,
            0,
            1
        );

    keeper.x=
        lerp(
            keeper.startX,
            keeper.targetX,
            easeOut(t)
        );

    if(t>=1){

        keeper.active=false;
    }
}


/* =====================================================
   SHOT RESOLUTION
===================================================== */

function resolveShot(){

    const x=
        ball.targetX;

    const z=
        ball.targetZ;

    /*
       Goal boundaries.
    */

    if(
        x<
        WORLD.goalLeft ||
        x>
        WORLD.goalRight ||
        z<0 ||
        z>
        WORLD.goalHeight
    ){

        finishShot(
            false,
            z>
            WORLD.goalHeight
            ? "OVER THE BAR!"
            : "WIDE!"
        );

        return;
    }

    const cfg=
        DIFFICULTY[
            game.difficulty
        ];

    /*
       Distance between ball target
       and goalkeeper.
    */

    const horizontalDistance=
        Math.abs(
            x-
            keeper.x
        );

    /*
       Keeper has a different reach
       depending on dive direction.
    */

    let reach;

    if(
        keeper.direction===0
    ){

        reach=
            cfg.reach;

    }else{

        reach=
            cfg.diveReach;
    }

    /*
       A dive to the wrong side
       should almost never save it.
    */

    if(
        keeper.direction===-1 &&
        x>-.45
    ){

        reach=.12;
    }

    if(
        keeper.direction===1 &&
        x<.45
    ){

        reach=.12;
    }

    /*
       High shots are harder.
    */

    if(z>1.55){

        reach*=.72;
    }

    /*
       Very wide corners are harder.
    */

    if(
        Math.abs(x)>2.65
    ){

        reach*=.88;
    }

    /*
       Slight randomness makes saves
       feel less robotic.
    */

    const saveThreshold=
        reach+
        rand(
            -.10,
            .10
        );

    const saved=
        horizontalDistance<=
        saveThreshold;

    if(saved){

        finishShot(
            false,
            ball.owner==="you"
            ? "SAVED!"
            : "GREAT SAVE!"
        );

    }else{

        finishShot(
            true,
            ball.owner==="you"
            ? "GOAL!"
            : "CPU SCORES!"
        );
    }
}


/* =====================================================
   FINISH SHOT
===================================================== */

function finishShot(
    scored,
    text
){

    const owner=
        ball.owner;

    if(owner==="you"){

        if(scored){

            game.yourScore++;

            markSlot(
                "you",
                "goal"
            );

        }else{

            markSlot(
                "you",
                "miss"
            );
        }

        game.yourTaken=true;

    }else{

        if(scored){

            game.opponentScore++;

            markSlot(
                "opponent",
                "goal"
            );

        }else{

            markSlot(
                "opponent",
                "miss"
            );
        }

        game.opponentTaken=true;
    }

    updateScoreboard();

    status(
        text,
        `${game.yourTeam.short} ${game.yourScore} - ${game.opponentScore} ${game.opponentTeam.short}`
    );

    setTimeout(
        nextTurn,
        1150
    );
}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn(){

    ball.active=false;
    keeper.active=false;

    /*
       Early win check.

       Example:
       after 3 rounds, one team has 3
       and the other has 0.
    */

    const roundsCompleted=
        game.round;

    const yourRemaining=
        game.maxRounds-
        roundsCompleted;

    const oppRemaining=
        game.maxRounds-
        roundsCompleted;

    if(
        game.yourScore>
        game.opponentScore+
        oppRemaining
    ){

        finishGame();
        return;
    }

    if(
        game.opponentScore>
        game.yourScore+
        yourRemaining
    ){

        finishGame();
        return;
    }

    /*
       Your penalty done.
       CPU penalty next.
    */

    if(
        game.yourTaken &&
        !game.opponentTaken
    ){

        beginDefense();

        return;
    }

    /*
       Both penalties complete.
    */

    if(
        game.yourTaken &&
        game.opponentTaken
    ){

        /*
           Normal five rounds.
        */

        if(
            game.round>=5
        ){

            if(
                game.yourScore===
                game.opponentScore
            ){

                /*
                   Sudden death.
                */

                game.suddenDeath=true;

                game.maxRounds++;

            }else{

                finishGame();

                return;
            }
        }else{

            game.round++;
        }

        /*
           Sudden death round.
        */

        if(
            game.suddenDeath &&
            game.round>=game.maxRounds
        ){

            game.round++;
            game.maxRounds++;
        }

        game.yourTaken=false;
        game.opponentTaken=false;

        setupScoreSlots();

        updateScoreboard();

        startYourPenalty();

        if(game.suddenDeath){

            status(
                "SUDDEN DEATH",
                "One penalty each — winner takes it"
            );
        }
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function finishGame(){

    game.active=false;

    showShootControls(false);
    showDefendControls(false);

    let title;

    if(
        game.yourScore>
        game.opponentScore
    ){

        title=
            `${game.yourTeam.name.toUpperCase()} WIN!`;

    }else if(
        game.opponentScore>
        game.yourScore
    ){

        title=
            `${game.opponentTeam.name.toUpperCase()} WIN!`;

    }else{

        title="DRAW!";
    }

    status(
        title,
        `${game.yourScore} - ${game.opponentScore} • Press RESET`
    );
}


/* =====================================================
   CAMERA
===================================================== */

function camera(){

    /*
       Dynamic perspective.

       The pitch is deeper on mobile portrait
       so the shooter and keeper remain separated.
    */

    const portrait=
        H>W;

    return {

        horizon:
            portrait
            ? H*.36
            : H*.42,

        goalY:
            portrait
            ? H*.40
            : H*.40,

        penaltyY:
            portrait
            ? H*.78
            : H*.83
    };
}


/* =====================================================
   WORLD -> SCREEN
===================================================== */

function worldToScreen(
    x,
    z
){

    const cam=
        camera();

    /*
       z=0 is goal.
       z=11 is shooter.

       Perspective scale becomes smaller
       toward the goal.
    */

    const normalized=
        clamp(
            z/11,
            0,
            1
        );

    const scale=
        lerp(
            W*.095,
            W*.17,
            normalized
        );

    const y=
        lerp(
            cam.goalY,
            cam.penaltyY,
            normalized
        );

    return {

        x:
            W/2+
            x*scale,

        y
    };
}


/* =====================================================
   GOAL COORDINATES
===================================================== */

function goalPoint(
    x,
    z
){

    const cam=
        camera();

    const scale=
        W*.095;

    return {

        x:
            W/2+
            x*scale,

        y:
            cam.goalY-
            z*
            (W*.018)
    };
}


/* =====================================================
   BALL SCREEN
===================================================== */

function ballScreen(){

    const p=
        worldToScreen(
            ball.currentX,
            ball.currentZ
        );

    const t=
        clamp(
            (
                ball.startZ-
                ball.currentZ
            )/
            ball.startZ,
            0,
            1
        );

    /*
       Ball rises above the pitch.
    */

    p.y-=
        Math.sin(
            Math.PI*t
        )*
        Math.min(
            W*.075,
            55
        );

    return p;
}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    const cam=
        camera();

    /*
       Sky / stadium upper section.
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            cam.goalY
        );

    sky.addColorStop(
        0,
        "#07121a"
    );

    sky.addColorStop(
        .5,
        "#26343a"
    );

    sky.addColorStop(
        1,
        "#18241f"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        cam.goalY+40
    );

    /*
       Stadium roof.
    */

    ctx.fillStyle="#05090c";

    ctx.fillRect(
        0,
        0,
        W,
        H*.10
    );

    /*
       Stadium lights.
    */

    for(
        let i=0;
        i<9;
        i++
    ){

        const x=
            W*.06+
            i*(W*.11);

        const glow=
            ctx.createRadialGradient(
                x,
                H*.12,
                2,
                x,
                H*.12,
                W*.06
            );

        glow.addColorStop(
            0,
            "rgba(255,255,230,.8)"
        );

        glow.addColorStop(
            1,
            "rgba(255,255,230,0)"
        );

        ctx.fillStyle=glow;

        ctx.fillRect(
            x-W*.06,
            H*.06,
            W*.12,
            W*.12
        );
    }

    /*
       Crowd tiers.
    */

    const crowdTop=
        H*.13;

    const crowdBottom=
        cam.goalY;

    const rows=8;

    for(
        let r=0;
        r<rows;
        r++
    ){

        const y=
            crowdTop+
            (
                r/
                rows
            )*
            (
                crowdBottom-
                crowdTop
            );

        const h=
            (
                crowdBottom-
                crowdTop
            )/
            rows;

        ctx.fillStyle=
            r%2===0
            ? "#1a2729"
            : "#243134";

        ctx.fillRect(
            0,
            y,
            W,
            h
        );

        /*
           Crowd dots.
        */

        for(
            let x=0;
            x<W;
            x+=10
        ){

            const seed=
                Math.sin(
                    x*12.17+
                    r*41.7
                );

            const bright=
                seed>.2;

            ctx.fillStyle=
                bright
                ? "rgba(220,225,205,.32)"
                : "rgba(10,15,17,.7)";

            ctx.beginPath();

            ctx.arc(
                x+
                (r%2)*5,
                y+
                h*.55,
                1.5,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    /*
       Advertising boards.
    */

    ctx.fillStyle="#10191b";

    ctx.fillRect(
        0,
        cam.goalY-7,
        W,
        22
    );

    for(
        let i=0;
        i<10;
        i++
    ){

        ctx.fillStyle=
            i%2===0
            ? "rgba(255,255,255,.07)"
            : "rgba(255,210,40,.08)";

        ctx.fillRect(
            i*W/10,
            cam.goalY-5,
            W/10-2,
            18
        );
    }
}


/* =====================================================
   PITCH
===================================================== */

function drawPitch(){

    const cam=
        camera();

    const top=
        cam.goalY;

    const pitch=
        ctx.createLinearGradient(
            0,
            top,
            0,
            H
        );

    pitch.addColorStop(
        0,
        "#276e38"
    );

    pitch.addColorStop(
        1,
        "#0b3c20"
    );

    ctx.fillStyle=pitch;

    ctx.fillRect(
        0,
        top,
        W,
        H-top
    );

    /*
       Grass perspective stripes.
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        const y=
            top+
            i*
            (
                (H-top)/
                12
            );

        ctx.fillStyle=
            i%2===0
            ? "rgba(255,255,255,.035)"
            : "rgba(0,0,0,.035)";

        ctx.fillRect(
            0,
            y,
            W,
            (H-top)/12
        );
    }

    /*
       Penalty area.
    */

    const center=W/2;

    ctx.strokeStyle=
        "rgba(255,255,255,.65)";

    ctx.lineWidth=
        Math.max(
            1,
            W*.0018
        );

    ctx.beginPath();

    ctx.moveTo(
        W*.31,
        top
    );

    ctx.lineTo(
        W*.69,
        top
    );

    ctx.lineTo(
        W*.88,
        H
    );

    ctx.moveTo(
        W*.31,
        top
    );

    ctx.lineTo(
        W*.12,
        H
    );

    ctx.stroke();

    /*
       Penalty spot.
    */

    const spot=
        worldToScreen(
            0,
            WORLD.shooterZ
        );

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        spot.x,
        spot.y,
        Math.max(
            2,
            W*.003
        ),
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Center line / perspective
       guidance.
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.08)";

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        top
    );

    ctx.lineTo(
        W/2,
        H
    );

    ctx.stroke();
}


/* =====================================================
   GOAL
===================================================== */

function drawGoal(){

    const left=
        goalPoint(
            WORLD.goalLeft,
            0
        ).x;

    const right=
        goalPoint(
            WORLD.goalRight,
            0
        ).x;

    const top=
        goalPoint(
            0,
            WORLD.goalHeight
        ).y;

    const bottom=
        goalPoint(
            0,
            0
        ).y;

    /*
       Net shadow.
    */

    ctx.fillStyle=
        "rgba(0,0,0,.18)";

    ctx.fillRect(
        left,
        top,
        right-left,
        bottom-top
    );

    /*
       Vertical net.
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=1;

    for(
        let x=left;
        x<=right;
        x+=Math.max(9,W*.014)
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }

    /*
       Horizontal net.
    */

    for(
        let y=top;
        y<=bottom;
        y+=Math.max(8,W*.018)
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }

    /*
       Posts.
    */

    ctx.strokeStyle="#f1f3f3";

    ctx.lineWidth=
        Math.max(
            4,
            W*.005
        );

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        left,
        bottom
    );

    ctx.lineTo(
        left,
        top
    );

    ctx.lineTo(
        right,
        top
    );

    ctx.lineTo(
        right,
        bottom
    );

    ctx.stroke();
}


/* =====================================================
   DRAW KEEPER
===================================================== */

function drawKeeper(){

    if(!game.opponentTeam)
        return;

    const p=
        worldToScreen(
            keeper.x,
            WORLD.keeperZ
        );

    /*
       Keeper size is based on screen.
    */

    const s=
        clamp(
            W*.035,
            25,
            48
        );

    const team=
        game.opponentTeam;

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    /*
       Dive lean.
    */

    const movement=
        keeper.targetX-
        keeper.startX;

    const lean=
        clamp(
            movement/3,
            -1,
            1
        );

    if(keeper.active){

        ctx.rotate(
            lean*.25
        );
    }

    /*
       Ground shadow.
    */

    ctx.fillStyle="#0007";

    ctx.beginPath();

    ctx.ellipse(
        0,
        s*1.15,
        s*.85+
        Math.abs(lean)*s*.6,
        s*.13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Legs.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -s*.30,
        s*.20,
        s*.22,
        s*.75
    );

    ctx.fillRect(
        s*.08,
        s*.20,
        s*.22,
        s*.75
    );

    /*
       Body.
    */

    ctx.fillStyle=
        team.keeper ||
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -s*.50,
        -s*.82,
        s,
        s*1.12,
        s*.14
    );

    ctx.fill();

    /*
       Jersey stripe.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -s*.07,
        -s*.82,
        s*.14,
        s*1.12
    );

    /*
       Arms.
    */

    const arm=
        s*.65+
        Math.abs(lean)*s*.75;

    ctx.strokeStyle=
        team.keeper ||
        team.primary;

    ctx.lineWidth=
        s*.22;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -s*.42,
        -s*.55
    );

    ctx.lineTo(
        lean<0
        ? -arm
        : -s*.62,
        -s*.28
    );

    ctx.moveTo(
        s*.42,
        -s*.55
    );

    ctx.lineTo(
        lean>0
        ? arm
        : s*.62,
        -s*.28
    );

    ctx.stroke();

    /*
       Gloves.
    */

    ctx.fillStyle="#f0f2f2";

    ctx.beginPath();

    ctx.arc(
        lean<0
        ? -arm
        : -s*.62,
        -s*.28,
        s*.14,
        0,
        Math.PI*2
    );

    ctx.arc(
        lean>0
        ? arm
        : s*.62,
        -s*.28,
        s*.14,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Head.
    */

    ctx.fillStyle="#a96850";

    ctx.beginPath();

    ctx.arc(
        0,
        -s*1.12,
        s*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Hair.
    */

    ctx.fillStyle="#17191b";

    ctx.beginPath();

    ctx.arc(
        0,
        -s*1.21,
        s*.31,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
       Small team badge.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.font=
        `bold ${Math.max(7,s*.19)}px Arial`;

    ctx.textAlign="center";

    ctx.fillText(
        team.badge,
        0,
        -s*.20
    );

    ctx.restore();
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    if(!game.yourTeam)
        return;

    /*
       Player is positioned far behind
       the keeper.

       This creates a much more natural
       penalty camera.
    */

    const p=
        worldToScreen(
            player.x,
            WORLD.shooterZ
        );

    const s=
        clamp(
            W*.050,
            35,
            66
        );

    const team=
        game.yourTeam;

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    /*
       Kick animation.
    */

    const kick=
        player.kickAnimation;

    const legSwing=
        Math.sin(
            kick*Math.PI
        )*
        s*.35;

    /*
       Shadow.
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        0,
        s*.95,
        s*.75,
        s*.13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Legs.
    */

    ctx.strokeStyle=
        "#101317";

    ctx.lineWidth=
        s*.20;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -s*.14,
        s*.38
    );

    ctx.lineTo(
        -s*.20-legSwing,
        s*.92
    );

    ctx.moveTo(
        s*.14,
        s*.38
    );

    ctx.lineTo(
        s*.20+legSwing,
        s*.92
    );

    ctx.stroke();

    /*
       Boots.
    */

    ctx.fillStyle="#101216";

    ctx.beginPath();

    ctx.ellipse(
        -s*.25-legSwing,
        s*.96,
        s*.20,
        s*.09,
        -.15,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        s*.25+legSwing,
        s*.96,
        s*.20,
        s*.09,
        .15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Body.
    */

    ctx.fillStyle=
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -s*.42,
        -s*.72,
        s*.84,
        s*1.12,
        s*.10
    );

    ctx.fill();

    /*
       Jersey secondary pattern.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -s*.10,
        -s*.72,
        s*.20,
        s*1.12
    );

    /*
       Arms.
    */

    ctx.strokeStyle=
        team.primary;

    ctx.lineWidth=
        s*.19;

    ctx.beginPath();

    ctx.moveTo(
        -s*.35,
        -s*.48
    );

    ctx.lineTo(
        -s*.65,
        -s*.05
    );

    ctx.moveTo(
        s*.35,
        -s*.48
    );

    ctx.lineTo(
        s*.65,
        -s*.05
    );

    ctx.stroke();

    /*
       Head.
    */

    ctx.fillStyle="#a96850";

    ctx.beginPath();

    ctx.arc(
        0,
        -s*.98,
        s*.29,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Hair.
    */

    ctx.fillStyle="#17191b";

    ctx.beginPath();

    ctx.arc(
        0,
        -s*1.06,
        s*.29,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
       Jersey badge.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.font=
        `bold ${Math.max(7,s*.18)}px Arial`;

    ctx.textAlign="center";

    ctx.fillText(
        team.badge,
        0,
        -s*.18
    );

    /*
       Player name.
    */

    ctx.fillStyle="rgba(255,255,255,.7)";

    ctx.font=
        `bold ${Math.max(6,s*.13)}px Arial`;

    ctx.fillText(
        "YOU",
        0,
        s*1.22
    );

    ctx.restore();
}


/* =====================================================
   BALL
===================================================== */

function drawBall(){

    if(!ball.active)
        return;

    /*
       Trail.
    */

    ball.trail.forEach(
        (p,i)=>{

            const alpha=
                (
                    i/
                    ball.trail.length
                )*.20;

            ctx.fillStyle=
                `rgba(255,255,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );

    const p=
        ballScreen();

    const t=
        clamp(
            (
                ball.startZ-
                ball.currentZ
            )/
            ball.startZ,
            0,
            1
        );

    const r=
        lerp(
            Math.max(8,W*.012),
            Math.max(4,W*.006),
            t
        );

    /*
       Ball shadow.
    */

    ctx.fillStyle="#0007";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+r*1.4,
        r*1.3,
        r*.35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Ball.
    */

    const g=
        ctx.createRadialGradient(
            p.x-r*.35,
            p.y-r*.35,
            1,
            p.x,
            p.y,
            r
        );

    g.addColorStop(
        0,
        "#fff"
    );

    g.addColorStop(
        .75,
        "#e4e8e9"
    );

    g.addColorStop(
        1,
        "#899297"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Simple ball panels.
    */

    ctx.strokeStyle="#252a2d";

    ctx.lineWidth=
        Math.max(
            .5,
            r*.08
        );

    ctx.beginPath();

    ctx.moveTo(
        p.x-r*.45,
        p.y
    );

    ctx.lineTo(
        p.x+r*.45,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-r*.45
    );

    ctx.lineTo(
        p.x,
        p.y+r*.45
    );

    ctx.stroke();
}


/* =====================================================
   AIM TARGET
===================================================== */

function drawTarget(){

    if(
        game.phase!=="shoot" ||
        !game.yourTeam
    )
        return;

    const p=
        goalPoint(
            selectedZone.x,
            selectedZone.z
        );

    const r=
        Math.max(
            12,
            W*.018
        );

    ctx.save();

    ctx.strokeStyle=
        game.yourTeam.primary;

    ctx.lineWidth=3;

    ctx.shadowColor=
        game.yourTeam.primary;

    ctx.shadowBlur=14;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.beginPath();

    ctx.moveTo(
        p.x-r*1.35,
        p.y
    );

    ctx.lineTo(
        p.x+r*1.35,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-r*1.35
    );

    ctx.lineTo(
        p.x,
        p.y+r*1.35
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   CAMERA OVERLAY
===================================================== */

function drawCameraOverlay(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,.12)"
    );

    gradient.addColorStop(
        .5,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.25)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       Cinematic side vignette.
    */

    const v=
        ctx.createRadialGradient(
            W/2,
            H*.55,
            W*.25,
            W/2,
            H*.55,
            W*.8
        );

    v.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    v.addColorStop(
        1,
        "rgba(0,0,0,.25)"
    );

    ctx.fillStyle=v;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================================
   RENDER
===================================================== */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawPitch();

    drawGoal();

    /*
       Keeper is close to goal.
    */

    drawKeeper();

    /*
       Player is far behind.
    */

    drawPlayer();

    drawTarget();

    drawBall();

    drawCameraOverlay();
}


/* =====================================================
   ANIMATION
===================================================== */

function loop(now){

    updateBall(now);

    updateKeeper(now);

    /*
       Slowly finish kick animation.
    */

    if(
        player.kickAnimation>0
    ){

        player.kickAnimation+=
            .025;

        if(
            player.kickAnimation>=1
        ){

            player.kickAnimation=0;
        }
    }

    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =====================================================
   DIFFICULTY
===================================================== */

$("difficulty").onchange=()=>{

    updateDifficulty();

    if(game.active){

        status(
            "DIFFICULTY UPDATED",
            "Goalkeeper AI changed for the next penalty"
        );
    }
};


/* =====================================================
   FULLSCREEN
===================================================== */

$("fullscreenBtn").onclick=
async()=>{

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();

        }else{

            await document
                .exitFullscreen();
        }

    }catch(e){

        console.log(
            "Fullscreen unavailable",
            e
        );
    }
};


/* =====================================================
   MOBILE TOUCH / SCREEN WAKE
===================================================== */

document.addEventListener(
    "touchmove",
    e=>{
        if(
            e.target.closest(
                "#gameFrame"
            )
        ){

            /*
               Prevent browser page
               movement.
            */

            e.preventDefault();
        }
    },
    {
        passive:false
    }
);


/* =====================================================
   INITIAL
===================================================== */

status(
    "SELECT TEAMS",
    "Choose your team and opponent"
);

updateScoreboard();

</script>
