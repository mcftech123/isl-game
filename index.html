<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ISL Penalty Shootout</title>

<style>
:root{
    --accent:#f6c400;
    --accent2:#123d91;
    --bg:#03080c;
    --panel:rgba(4,10,16,.94);
    --line:rgba(255,255,255,.16);
    --muted:#9ca9b2;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020509;
    color:#fff;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

button,
select,
input{
    font:inherit;
}

button{
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
}

#app{
    width:100vw;
    height:100dvh;
    position:relative;
}

#gameFrame{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#123c21;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}


/* =========================================================
   TEAM SCREEN
========================================================= */

#teamScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            rgba(1,5,9,.82),
            rgba(1,5,9,.97)
        );
    backdrop-filter:blur(12px);
}

.teamPanel{
    width:min(920px,100%);
    max-height:94dvh;
    overflow:auto;
    padding:28px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    background:
        linear-gradient(
            180deg,
            rgba(11,21,29,.98),
            rgba(3,9,14,.98)
        );
    box-shadow:
        0 30px 100px rgba(0,0,0,.75);
}

.gameTitle{
    text-align:center;
    font-size:clamp(26px,4vw,48px);
    font-weight:1000;
    letter-spacing:2px;
}

.gameSubtitle{
    text-align:center;
    color:#8e9ca5;
    font-size:11px;
    letter-spacing:2px;
    margin:7px 0 22px;
}

.selectionTitle{
    color:#9ba8b1;
    font-size:10px;
    font-weight:1000;
    letter-spacing:1.5px;
    margin:18px 0 9px;
}

.teamGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.teamCard{
    min-height:82px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    color:#fff;
    background:
        linear-gradient(
            180deg,
            #14232d,
            #081118
        );
    padding:10px 6px;
    transition:.15s;
}

.teamCard:active{
    transform:scale(.97);
}

.teamCard.selected{
    border-color:var(--accent);
    box-shadow:
        0 0 0 2px var(--accent),
        0 0 30px rgba(255,205,40,.18);
}

.teamBadge{
    width:34px;
    height:34px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:9px;
    font-weight:1000;
    border:2px solid rgba(255,255,255,.5);
}

.teamName{
    margin-top:7px;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#startMatch{
    display:block;
    width:min(300px,100%);
    height:50px;
    margin:24px auto 0;
    border:0;
    border-radius:10px;
    color:#171200;
    font-size:12px;
    font-weight:1000;
    letter-spacing:1px;
    background:
        linear-gradient(
            180deg,
            #ffe75c,
            #d9aa16
        );
}

#startMatch:disabled{
    opacity:.3;
}


/* =========================================================
   TOP HUD
========================================================= */

#topHUD{
    position:absolute;
    z-index:100;
    top:max(10px,env(safe-area-inset-top));
    left:max(10px,env(safe-area-inset-left));
    right:max(10px,env(safe-area-inset-right));
    display:grid;
    grid-template-columns:minmax(240px,390px) 1fr auto;
    align-items:start;
    gap:12px;
    pointer-events:none;
}

.scoreBox{
    width:100%;
    border:1px solid rgba(255,255,255,.16);
    border-radius:9px;
    overflow:hidden;
    background:rgba(4,10,16,.94);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
}

.scoreTeam{
    height:48px;
    display:grid;
    grid-template-columns:64px 1fr 48px;
    align-items:stretch;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.scoreTeam:last-child{
    border-bottom:0;
}

.scoreName{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:1000;
}

.scoreSlots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
}

.slot{
    width:22px;
    height:15px;
    border:1px solid #8b969c;
    background:#5b656b;
    border-radius:1px;
}

.slot.goal{
    background:#1bd678;
    border-color:#8dffc0;
}

.slot.miss{
    background:#e84959;
    border-color:#ff9da7;
}

.scoreNumber{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent);
    color:#111;
    font-size:21px;
    font-weight:1000;
}

#centerInfo{
    justify-self:center;
    min-width:175px;
    text-align:center;
    padding:8px 18px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:30px;
    background:rgba(3,9,14,.9);
    box-shadow:0 10px 30px #0007;
}

#centerInfo small{
    display:block;
    color:#87959e;
    font-size:7px;
    letter-spacing:2px;
}

#centerInfo strong{
    font-size:12px;
}

#gameButtons{
    display:flex;
    gap:6px;
    pointer-events:auto;
}

.smallBtn{
    height:38px;
    padding:0 13px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    background:rgba(5,13,20,.95);
    color:#fff;
    font-size:9px;
    font-weight:1000;
}

#resetBtn{
    background:#bd3444;
}


/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;
    z-index:90;
    top:88px;
    left:50%;
    transform:translateX(-50%);
    width:min(360px,calc(100% - 30px));
    padding:10px 16px;
    text-align:center;
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;
    background:rgba(3,9,14,.88);
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px #0006;
}

#statusMain{
    font-size:18px;
    font-weight:1000;
    letter-spacing:.5px;
}

#statusSub{
    margin-top:3px;
    color:#a9b5bc;
    font-size:9px;
}


/* =========================================================
   DIFFICULTY
========================================================= */

#difficultyBox{
    position:absolute;
    z-index:110;
    right:max(10px,env(safe-area-inset-right));
    top:64px;
    display:none;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:8px;
    background:rgba(4,11,17,.93);
}

#difficultyBox span{
    color:#8c9aa4;
    font-size:7px;
    font-weight:1000;
}

#difficulty{
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:8px;
    font-weight:1000;
}


/* =========================================================
   SHOOT CONTROLS
========================================================= */

#shootControls{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:none;
    width:min(310px,calc(100% - 30px));
    flex-direction:column;
    align-items:center;
    gap:7px;
}

.zoneGrid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.zone{
    height:38px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:7px;
    background:rgba(4,12,18,.95);
    color:#fff;
    font-size:8px;
    font-weight:1000;
}

.zone:active{
    transform:scale(.96);
}

.zone.selected{
    color:#111;
    background:var(--accent);
    border-color:#fff4a0;
    box-shadow:0 0 14px rgba(255,210,30,.25);
}

.powerWrap{
    width:100%;
    padding:6px 10px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(4,10,15,.94);
}

.powerHeader{
    display:flex;
    justify-content:space-between;
    color:#9daab2;
    font-size:7px;
    margin-bottom:2px;
}

#power{
    width:100%;
    accent-color:var(--accent);
}

#shootBtn{
    width:180px;
    height:44px;
    border:0;
    border-radius:9px;
    background:linear-gradient(180deg,#ffe867,#d9a917);
    color:#171200;
    font-size:11px;
    font-weight:1000;
    letter-spacing:1px;
    box-shadow:0 7px 20px rgba(0,0,0,.35);
}

#shootBtn:active{
    transform:scale(.97);
}


/* =========================================================
   DEFEND
========================================================= */

#defendControls{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(360px,calc(100% - 30px));
    display:none;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.diveBtn{
    height:46px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:8px;
    background:rgba(4,12,18,.96);
    color:#fff;
    font-size:9px;
    font-weight:1000;
}

.diveBtn:active{
    transform:scale(.96);
}

.diveBtn.center{
    background:linear-gradient(180deg,#32dc7a,#109d54);
    color:#03170a;
}


/* =========================================================
   DESKTOP FIELD
========================================================= */

@media(min-width:701px){

    #gameFrame{
        aspect-ratio:16/9;
        height:auto;
        max-height:100dvh;
    }

    #app{
        width:min(100vw,177.78dvh);
        height:min(100dvh,56.25vw);
    }
}


/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media(max-width:700px){

    #app,
    #gameFrame{
        width:100vw;
        height:100dvh;
    }

    #topHUD{
        top:max(6px,env(safe-area-inset-top));
        left:6px;
        right:6px;
        grid-template-columns:1fr auto;
        gap:5px;
    }

    .scoreBox{
        grid-column:1 / -1;
        width:100%;
    }

    .scoreTeam{
        height:34px;
        grid-template-columns:48px 1fr 38px;
    }

    .scoreName{
        font-size:9px;
    }

    .scoreSlots{
        gap:3px;
    }

    .slot{
        width:18px;
        height:11px;
    }

    .scoreNumber{
        font-size:16px;
    }

    #centerInfo{
        grid-column:1;
        grid-row:2;
        justify-self:start;
        min-width:120px;
        padding:6px 10px;
    }

    #centerInfo small{
        font-size:5px;
    }

    #centerInfo strong{
        font-size:9px;
    }

    #gameButtons{
        grid-column:2;
        grid-row:2;
        justify-self:end;
    }

    .smallBtn{
        height:30px;
        padding:0 9px;
        font-size:7px;
    }

    #statusBox{
        top:104px;
        width:min(310px,calc(100% - 30px));
        padding:7px 10px;
    }

    #statusMain{
        font-size:13px;
    }

    #statusSub{
        font-size:7px;
    }

    #difficultyBox{
        top:auto;
        bottom:max(9px,env(safe-area-inset-bottom));
        left:7px;
        right:auto;
        padding:6px 8px;
    }

    #difficultyBox span{
        font-size:6px;
    }

    #difficulty{
        font-size:7px;
    }

    #shootControls{
        bottom:max(8px,env(safe-area-inset-bottom));
        width:min(330px,calc(100% - 26px));
        gap:5px;
    }

    .zoneGrid{
        gap:4px;
    }

    .zone{
        height:38px;
        font-size:7px;
    }

    .powerWrap{
        padding:5px 9px;
    }

    #shootBtn{
        width:170px;
        height:40px;
    }

    #defendControls{
        bottom:max(10px,env(safe-area-inset-bottom));
        width:min(350px,calc(100% - 22px));
    }

    .diveBtn{
        height:42px;
        font-size:8px;
    }

    #teamScreen{
        padding:8px;
    }

    .teamPanel{
        max-height:96dvh;
        padding:16px 12px;
        border-radius:14px;
    }

    .gameTitle{
        font-size:24px;
    }

    .gameSubtitle{
        font-size:8px;
        margin-bottom:12px;
    }

    .teamGrid{
        grid-template-columns:repeat(3,1fr);
        gap:5px;
    }

    .teamCard{
        min-height:62px;
        padding:6px 3px;
    }

    .teamBadge{
        width:26px;
        height:26px;
        font-size:7px;
    }

    .teamName{
        font-size:7px;
        margin-top:4px;
    }

    #startMatch{
        height:44px;
        margin-top:16px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .scoreTeam{
        height:31px;
        grid-template-columns:43px 1fr 34px;
    }

    .slot{
        width:14px;
        height:9px;
    }

    #statusBox{
        top:96px;
    }

    #shootControls{
        width:calc(100% - 18px);
    }

    .zone{
        height:34px;
        font-size:6px;
    }

    #shootBtn{
        height:38px;
    }

    .powerWrap{
        padding:3px 7px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media(max-width:900px) and (orientation:landscape){

    #topHUD{
        top:4px;
    }

    .scoreBox{
        max-width:300px;
    }

    .scoreTeam{
        height:28px;
    }

    #centerInfo{
        padding:5px 10px;
    }

    #statusBox{
        top:55px;
    }

    #shootControls{
        width:260px;
        bottom:5px;
        display:none;
    }

    .zone{
        height:27px;
    }

    #shootBtn{
        height:31px;
    }

    .powerWrap{
        padding:2px 7px;
    }

    #defendControls{
        bottom:7px;
    }

    .diveBtn{
        height:32px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="gameFrame">

<canvas id="game"></canvas>


<!-- =====================================================
     TEAM SELECTION
===================================================== -->

<div id="teamScreen">

<div class="teamPanel">

<div class="gameTitle">
    ISL PENALTY SHOOTOUT
</div>

<div class="gameSubtitle">
    SELECT YOUR TEAM AND OPPONENT
</div>

<div class="selectionTitle">
    YOUR TEAM
</div>

<div class="teamGrid" id="yourTeams"></div>

<div class="selectionTitle">
    OPPONENT
</div>

<div class="teamGrid" id="opponentTeams"></div>

<button id="startMatch" disabled>
    START MATCH
</button>

</div>
</div>


<!-- =====================================================
     HUD
===================================================== -->

<div id="topHUD">

<div class="scoreBox">

<div class="scoreTeam">

<div class="scoreName" id="yourName">
    YOU
</div>

<div class="scoreSlots" id="yourSlots"></div>

<div class="scoreNumber" id="yourScore">
    0
</div>

</div>

<div class="scoreTeam">

<div class="scoreName" id="oppName">
    CPU
</div>

<div class="scoreSlots" id="oppSlots"></div>

<div class="scoreNumber" id="oppScore">
    0
</div>

</div>

</div>


<div id="centerInfo">

<small>
ISL PENALTY SHOOTOUT
</small>

<strong>
ROUND <span id="round">1</span> /
<span id="maxRound">5</span>
</strong>

</div>


<div id="gameButtons">

<button class="smallBtn" id="changeTeams">
    TEAMS
</button>

<button class="smallBtn" id="resetBtn">
    RESET
</button>

</div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="statusBox">

<div id="statusMain">
    SELECT TEAMS
</div>

<div id="statusSub">
    Choose your team and opponent
</div>

</div>


<!-- =====================================================
     DIFFICULTY
===================================================== -->

<div id="difficultyBox">

<span>
DIFFICULTY
</span>

<select id="difficulty">

<option value="easy">
EASY
</option>

<option value="medium" selected>
MEDIUM
</option>

<option value="hard">
HARD
</option>

</select>

</div>


<!-- =====================================================
     SHOOT CONTROLS
===================================================== -->

<div id="shootControls">

<div class="zoneGrid">

<button class="zone"
        data-x="-2.8"
        data-z="2.05">
    ↖ HIGH
</button>

<button class="zone"
        data-x="0"
        data-z="2.05">
    ↑ HIGH
</button>

<button class="zone"
        data-x="2.8"
        data-z="2.05">
    ↗ HIGH
</button>

<button class="zone"
        data-x="-2.8"
        data-z="1.15">
    ← MID
</button>

<button class="zone selected"
        data-x="0"
        data-z="1.15">
    CENTER
</button>

<button class="zone"
        data-x="2.8"
        data-z="1.15">
    MID →
</button>

<button class="zone"
        data-x="-2.8"
        data-z=".35">
    ↙ LOW
</button>

<button class="zone"
        data-x="0"
        data-z=".35">
    ↓ LOW
</button>

<button class="zone"
        data-x="2.8"
        data-z=".35">
    ↘ LOW
</button>

</div>


<div class="powerWrap">

<div class="powerHeader">

<span>
SHOT POWER
</span>

<span id="powerValue">
72%
</span>

</div>

<input
    id="power"
    type="range"
    min="35"
    max="100"
    value="72">

</div>


<button id="shootBtn">
    SHOOT
</button>

</div>


<!-- =====================================================
     DEFEND CONTROLS
===================================================== -->

<div id="defendControls">

<button class="diveBtn" data-dir="-1">
    ← LEFT
</button>

<button class="diveBtn center" data-dir="0">
    CENTER
</button>

<button class="diveBtn" data-dir="1">
    RIGHT →
</button>

</div>

</div>
</div>


<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const $ =
    id => document.getElementById(id);

const clamp =
    (v,a,b)=>Math.max(a,Math.min(b,v));

const lerp =
    (a,b,t)=>a+(b-a)*t;

const rand =
    (a,b)=>a+Math.random()*(b-a);

const ease =
    t=>1-Math.pow(1-t,3);


/* =========================================================
   TEAMS
========================================================= */

const TEAMS={

    kbfc:{
        name:"Kerala Blasters",
        short:"KBFC",
        primary:"#f4c400",
        secondary:"#123d91",
        badge:"KB"
    },

    mbsg:{
        name:"Mohun Bagan",
        short:"MBSG",
        primary:"#008f52",
        secondary:"#7b173d",
        badge:"MB"
    },

    mumbai:{
        name:"Mumbai City",
        short:"MCFC",
        primary:"#72c8e8",
        secondary:"#143e76",
        badge:"MC"
    },

    bengaluru:{
        name:"Bengaluru FC",
        short:"BFC",
        primary:"#0874c9",
        secondary:"#e9edf2",
        badge:"BFC"
    },

    eastbengal:{
        name:"East Bengal",
        short:"EBFC",
        primary:"#e33732",
        secondary:"#f5c400",
        badge:"EB"
    },

    goa:{
        name:"FC Goa",
        short:"FCG",
        primary:"#ed7418",
        secondary:"#243b87",
        badge:"GOA"
    },

    chennaiyin:{
        name:"Chennaiyin FC",
        short:"CFC",
        primary:"#087bbb",
        secondary:"#102f61",
        badge:"CFC"
    },

    hyderabad:{
        name:"Hyderabad FC",
        short:"HFC",
        primary:"#f3a800",
        secondary:"#171717",
        badge:"HYD"
    },

    odisha:{
        name:"Odisha FC",
        short:"OFC",
        primary:"#241a78",
        secondary:"#e43e46",
        badge:"OD"
    },

    jamshedpur:{
        name:"Jamshedpur FC",
        short:"JFC",
        primary:"#d71920",
        secondary:"#102b55",
        badge:"JFC"
    },

    northeast:{
        name:"NorthEast United",
        short:"NEUFC",
        primary:"#e8b51b",
        secondary:"#15285d",
        badge:"NE"
    },

    punjab:{
        name:"Punjab FC",
        short:"PFC",
        primary:"#ed2939",
        secondary:"#f2b300",
        badge:"PFC"
    }
};

let selectedYour=null;
let selectedOpponent=null;


/* =========================================================
   TEAM UI
========================================================= */

function createTeamCards(){

    $("yourTeams").innerHTML="";
    $("opponentTeams").innerHTML="";

    Object.entries(TEAMS).forEach(([id,team])=>{

        $("yourTeams").appendChild(

function resizeCanvas(){

    const dpr =
        Math.min(window.devicePixelRatio||1,2);

    canvas.width =
        Math.max(1,Math.round(rect.width*dpr));

    canvas.height =
        Math.max(1,Math.round(rect.height*dpr));

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

function shootBall(x,z,power,owner){

    const cfg =
        DIFFICULTY[game.difficulty];

    ball.active=true;

    ball.owner=owner;

    ball.x=0;

    ball.z=.1;

    let accuracy;

    if(owner==="you"){

        /*
           Better power/accuracy relationship.
        */

        accuracy =
            .20 -
            (power/100)*.08;

    }else{

        accuracy=.14;
    }

    ball.targetX =
        clamp(
            x+rand(-accuracy,accuracy),
            -3.55,
            3.55
        );

    ball.targetZ =
        clamp(
            z+rand(-accuracy*.45,accuracy*.45),
            .10,
            2.30
        );

    /*
       More power = faster ball.
    */

    const speed =
        16 + power*.11;

    ball.duration =
        clamp(
            11/speed,
            .48,
            .72
        );

    ball.startTime =
        performance.now();

    ball.trail=[];

    player.kickAnim=1;

    game.phase =
        owner==="you"
        ? "playerFlight"
        : "cpuFlight";

    showShoot(false);

    showDefend(false);

    if(owner==="you"){

        status(
            "SHOT!",
            "Goalkeeper is reacting..."
        );

        startCPUKeeper();

    }else{

        status(
            "CPU SHOOTS!",
            "Choose your dive"
        );
    }
}

function startCPUKeeper(){

    const cfg =
        DIFFICULTY[game.difficulty];

    /*
       Reaction delay prevents instant saving.
    */

    keeper.startX=0;

    keeper.x=0;

    const prediction =
        rand(
            -cfg.prediction,
            cfg.prediction
        );

    /*
       Keeper predicts the target,
       but prediction is imperfect.
    */

    keeper.targetX =
        clamp(
            ball.targetX+prediction,
            -3.15,
            3.15
        );

    keeper.direction =
        keeper.targetX<-.65
        ? -1
        : keeper.targetX>.65
        ? 1
        : 0;

    keeper.startTime =
        performance.now()+
        cfg.reaction*1000;

    keeper.duration =
        .34;

    keeper.active=true;
}

========================================================= */

function cpuShoot(){

    if(
        !game.active ||
        game.phase!=="defend"
    )
        return;

    const r=Math.random();

    let x;

    if(r<.32){

        x=rand(-3.25,-2.1);

    }else if(r<.64){

        x=rand(2.1,3.25);

    }else if(r<.82){

        x=rand(-.65,.65);

    }else{

        x=rand(-2.6,2.6);
    }

    let z;

    if(Math.random()<.38){

        z=rand(1.7,2.3);

    }else{

        z=rand(.25,1.45);
    }

    const power =
        rand(62,94);

    shootBall(
        x,
        z,
        power,
        "cpu"
    );
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(now){

    if(!ball.active)
        return;

    const t =
        clamp(
            (now-ball.startTime)/
            (1000*ball.duration),
            0,
            1
        );

    ball.x =
        lerp(
            0,
            ball.targetX,
            ease(t)
        );

    ball.z =
        lerp(
            .1,
            ball.targetZ,
            t
        )+
        Math.sin(Math.PI*t)*.45;

    const p =
        ballScreen(t);

    ball.trail.push({
        x:p.x,
        y:p.y
    });

    if(ball.trail.length>10)
        ball.trail.shift();

    if(t>=1){

        ball.active=false;

        resolveShot();
    }
}


/* =========================================================
   KEEPER UPDATE
========================================================= */

function updateKeeper(now){

    if(!keeper.active)
        return;

    if(
        ball.owner==="you" &&
        now<keeper.startTime
    )
        return;

    const t =
        clamp(
            (now-keeper.startTime)/
            (1000*keeper.duration),
            0,
            1
        );

    keeper.x =
        lerp(
            keeper.startX,
            keeper.targetX,
            ease(t)
        );

    if(t>=1)
        keeper.active=false;
}


/* =========================================================
   RESOLVE
========================================================= */

function resolveShot(){

    const x=ball.targetX;

    const z=ball.targetZ;

    /*
       Keeper distance is based on
       actual final position.
    */

    const cfg =
        DIFFICULTY[game.difficulty];

    const distance =
        Math.abs(
            x-keeper.x
        );

    let reach;

    if(
        keeper.direction===0
    ){

        reach =
            cfg.reach;

    }else{

        reach =
            cfg.diveReach;
    }

    /*
       A keeper cannot cover
       the opposite side while diving.
    */

    if(
        keeper.direction===-1 &&
        x>-.45
    ){

        reach=.08;
    }

    if(
        keeper.direction===1 &&
        x<.45
    ){

        reach=.08;
    }

    /*
       High shots are harder to reach.
    */

    if(z>1.65)
        reach*=.68;

    /*
       Extreme corners are harder.
    */

    if(Math.abs(x)>2.7)
        reach*=.78;

    const saved =
        distance<=reach;

    if(saved){

        finishShot(
            false,
            ball.owner==="you"
            ? "SAVED!"
            : "GREAT SAVE!"
        );

    }else{

        finishShot(
            true,
            ball.owner==="you"
            ? "GOAL!"
            : "CPU SCORES!"
        );
    }
}


/* =========================================================
   FINISH SHOT
========================================================= */

function finishShot(scored,text){

    const owner =
        ball.owner;

    const currentRound =
        game.round-1;

    if(owner==="you"){

        game.yourTaken=true;

        if(scored){

            game.yourScore++;

            markSlot(
                "you",
                "goal",
                currentRound
            );

        }else{

            markSlot(
                "you",
                "miss",
                currentRound
            );
        }

    }else{

        game.opponentTaken=true;

        if(scored){

            game.opponentScore++;

            markSlot(
                "opp",
                "goal",
                currentRound
            );

        }else{

            markSlot(
                "opp",
                "miss",
                currentRound
            );
        }
    }

    /*
       IMPORTANT:
       Scoreboard is updated immediately.
    */

    updateScoreboard();

    status(
        text,
        `${game.yourTeam.short} ${game.yourScore} - ${game.opponentScore} ${game.opponentTeam.short}`
    );

    setTimeout(
        nextTurn,
        1000
    );
}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    if(!game.active)
        return;

    keeper.active=false;

    ball.active=false;

    /*
       CPU's turn.
    */

    if(
        game.yourTaken &&
        !game.opponentTaken
    ){

        beginDefense();

        return;
    }

    /*
       Both completed.
    */

    if(
        game.yourTaken &&
        game.opponentTaken
    ){

        /*
           Early win/loss detection.
        */

        const remaining =
            game.maxRounds-game.round;

        if(
            game.yourScore >
            game.opponentScore+
            remaining
        ){

            finishGame();

            return;
        }

        if(
            game.opponentScore >
            game.yourScore+
            remaining
        ){

            finishGame();

            return;
        }

        /*
           End of five rounds.
        */

        if(
            game.round>=game.maxRounds
        ){

            if(
                game.yourScore===
                game.opponentScore
            ){

                /*
                   Sudden death.
                */

                game.suddenDeath=true;

                game.maxRounds++;

            }else{

                finishGame();

                return;
            }
        }

        game.round++;

        game.yourTaken=false;

        game.opponentTaken=false;

        setupSlots();

        /*
           Rebuild previous round results.
        */

        rebuildScoreSlots();

        updateScoreboard();

        startYourPenalty();

        if(game.suddenDeath){

            status(
                "SUDDEN DEATH",
                "One penalty each — winner takes it"
            );
        }
    }
}

/* =========================================================
   FIELD GEOMETRY
========================================================= */

function view(){

    return {
        w:canvas.clientWidth,
        h:canvas.clientHeight
    };
}


/*
   Responsive goal placement.

   Desktop:
   large goal with realistic distance.

   Mobile:
   goal moves higher and player moves lower.
*/

function geometry(){

    const v=view();

    const mobile =
        v.w<700;

    const goalWidth =
        mobile
        ? Math.min(v.w*.82,420)
        : Math.min(v.w*.70,950);

    const goalLeft =
        (v.w-goalWidth)/2;

    const goalRight =
        goalLeft+goalWidth;

    const goalTop =
        mobile
        ? v.h*.28
        : v.h*.30;

    const goalBottom =
        mobile
        ? v.h*.46
        : v.h*.47;

    const playerY =
        mobile
        ? v.h*.78
        : v.h*.78;

    const keeperY =
        mobile
        ? (goalTop+goalBottom)/2+15
        : (goalTop+goalBottom)/2+12;

    return{
        mobile,
        goalLeft,
        goalRight,
        goalTop,
        goalBottom,
        goalWidth,
        keeperY,
        playerY
    };
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const v=view();

    const g =
        ctx.createLinearGradient(
            0,
            0,
            0,
            v.h
        );

    g.addColorStop(
        0,
        "#07131b"
    );

    g.addColorStop(
        .28,
        "#172b30"
    );

    g.addColorStop(
        .48,
        "#174a28"
    );

    g.addColorStop(
        1,
        "#073019"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        v.w,
        v.h
    );


    /*
       Stadium seating.
    */

    const stadiumEnd =
        v.h*.36;

    for(let y=75;y<stadiumEnd;y+=18){

        ctx.fillStyle =
            y%36===0
            ? "rgba(255,255,255,.035)"
            : "rgba(0,0,0,.12)";

        ctx.fillRect(
            0,
            y,
            v.w,
            14
        );

        for(
            let x=0;
            x<v.w;
            x+=18
        ){

            ctx.fillStyle =
                "rgba(255,255,255,.09)";

            ctx.fillRect(
                x+3,
                y+4,
                2,
                2
            );
        }
    }


    /*
       Floodlights.
    */

    const lights=[
        v.w*.13,
        v.w*.28,
        v.w*.72,
        v.w*.87
    ];

    lights.forEach(x=>{

        const glow =
            ctx.createRadialGradient(
                x,
                v.h*.17,
                2,
                x,
                v.h*.17,
                80
            );

        glow.addColorStop(
            0,
            "rgba(255,255,220,.45)"
        );

        glow.addColorStop(
            1,
            "rgba(255,255,220,0)"
        );

        ctx.fillStyle=glow;

        ctx.fillRect(
            x-100,
            v.h*.08,
            200,
            160
        );

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x,
            v.h*.17,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}


/* =========================================================
   PITCH
========================================================= */

function drawPitch(){

    const v=view();

    const pitchTop =
        v.h*.37;

    const g =
        ctx.createLinearGradient(
            0,
            pitchTop,
            0,
            v.h
        );

    g.addColorStop(
        0,
        "#2c8242"
    );

    g.addColorStop(
        1,
        "#07351b"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        pitchTop,
        v.w,
        v.h-pitchTop
    );


    /*
       Grass stripes.
    */

    const rows=12;

    const rowH =
        (v.h-pitchTop)/rows;

    for(let i=0;i<rows;i++){

        ctx.fillStyle =
            i%2===0
            ? "rgba(255,255,255,.035)"
            : "rgba(0,0,0,.045)";

        ctx.fillRect(
            0,
            pitchTop+i*rowH,
            v.w,
            rowH
        );
    }


    /*
       Perspective penalty box.
    */

    const boxTop =
        pitchTop;

    const boxLeft =
        v.w*.30;

    const boxRight =
        v.w*.70;

    ctx.strokeStyle =
        "rgba(255,255,255,.62)";

    ctx.lineWidth =
        Math.max(1.5,v.w*.0015);

    ctx.beginPath();

    ctx.moveTo(
        boxLeft,
        boxTop
    );

    ctx.lineTo(
        v.w*.22,
        v.h
    );

    ctx.moveTo(
        boxRight,
        boxTop
    );

    ctx.lineTo(
        v.w*.78,
        v.h
    );

    ctx.stroke();


    /*
       Penalty spot.
    */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        v.w/2,
        v.h*.75,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   GOAL
========================================================= */

function drawGoal(){

    const g =
        geometry();

    const left =
        g.goalLeft;

    const right =
        g.goalRight;

    const top =
        g.goalTop;

    const bottom =
        g.goalBottom;


    /*
       Net backing.
    */

    ctx.fillStyle =
        "rgba(8,16,20,.55)";

    ctx.fillRect(
        left,
        top,
        right-left,
        bottom-top
    );


    /*
       Net vertical lines.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.28)";

    ctx.lineWidth=1;

    const spacing =
        Math.max(
            10,
            (right-left)/30
        );

    for(
        let x=left;
        x<=right;
        x+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }


    /*
       Horizontal net.
    */

    const hSpacing =
        Math.max(
            9,
            (bottom-top)/8
        );

    for(
        let y=top;
        y<=bottom;
        y+=hSpacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }


    /*
       Posts.
    */

    ctx.strokeStyle="#f2f4f5";

    ctx.lineWidth =
        Math.max(
            5,
            g.goalWidth*.008
        );

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        left,
        bottom
    );

    ctx.lineTo(
        left,
        top
    );

    ctx.lineTo(
        right,
        top
    );

    ctx.lineTo(
        right,
        bottom
    );

    ctx.stroke();


    /*
       Ground shadow.
    */

    ctx.fillStyle="#0005";

    ctx.beginPath();

    ctx.ellipse(
        (left+right)/2,
        bottom+7,
        (right-left)*.45,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   GOALKEEPER
========================================================= */

function drawKeeper(){

    if(!game.opponentTeam)
        return;

    const g =
        geometry();

    const team =
        game.opponentTeam;

    const goalWidth =
        g.goalRight-g.goalLeft;

    const x =
        g.goalLeft+
        ((keeper.x+3.66)/7.32)*
        goalWidth;

    const y =
        g.keeperY;

    const scale =
        g.mobile
        ? Math.min(
            .72,
            goalWidth/480
          )
        : Math.min(
            1,
            goalWidth/700
          );

    const lean =
        clamp(
            (keeper.targetX-keeper.startX)/3,
            -1,
            1
        );

    ctx.save();

    ctx.translate(x,y);

    ctx.scale(scale,scale);

    if(keeper.active){

        ctx.rotate(
            lean*.20
        );
    }


    /*
       Shadow.
    */

    ctx.fillStyle="#0007";

    ctx.beginPath();

    ctx.ellipse(
        0,
        61,
        38+Math.abs(lean)*20,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -17,
        18,
        13,
        40
    );

    ctx.fillRect(
        4,
        18,
        13,
        40
    );


    /*
       Body / jersey.
    */

    ctx.fillStyle=
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -25,
        -43,
        50,
        65,
        7
    );

    ctx.fill();


    /*
       Jersey stripe.
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -4,
        -43,
        8,
        65
    );


    /*
       Arms.
    */

    const armLength =
        32+
        Math.abs(lean)*35;

    ctx.strokeStyle=
        team.primary;

    ctx.lineWidth=13;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -20,
        -25
    );

    ctx.lineTo(
        lean<0
        ? -armLength
        : -31,
        -10
    );

    ctx.moveTo(
        20,
        -25
    );

    ctx.lineTo(
        lean>0
        ? armLength
        : 31,
        -10
    );

    ctx.stroke();


    /*
       Gloves.
    */

    ctx.fillStyle="#f1f4f5";

    ctx.beginPath();

    ctx.arc(
        lean<0
        ? -armLength
        : -31,
        -10,
        8,
        0,
        Math.PI*2
    );

    ctx.arc(
        lean>0
        ? armLength
        : 31,
        -10,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Head.
    */

    ctx.fillStyle="#b9795d";

    ctx.beginPath();

    ctx.arc(
        0,
        -61,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair.
    */

    ctx.fillStyle="#15171a";

    ctx.beginPath();

    ctx.arc(
        0,
        -66,
        16,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   PLAYER

    /*

        28,

    );

    );

    );


    /*

    );


    /*
       Arms.
    */

    ctx.strokeStyle=

    ctx.lineWidth=16;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -28,
        -32
    );

    ctx.lineTo(
        -46,
        18
    );

    ctx.moveTo(
        28,
        -32
    );

    ctx.lineTo(
        46,
        18
    );

    ctx.stroke();


    /*
       Hands.
    */

    ctx.fillStyle="#b9795d";

    ctx.beginPath();

    ctx.arc(
        -46,
        20,
        8,
        0,
        Math.PI*2
    );

    ctx.arc(
        46,
        20,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Neck.
    */

    ctx.fillStyle="#b9795d";

    ctx.fillRect(
        -8,
        -65,
        16,
        16
    );


    /*
       Head.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        -77,
        21,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair.
    */

    ctx.fillStyle="#17191b";

    ctx.beginPath();

    ctx.arc(
        0,

        Math.PI,

    );

    ctx.fill();


    /*
       Jersey number.
    */

    ctx.fillStyle=

        ? "#111"
        : "#fff";

    ctx.textAlign="center";

    ctx.fillText(
        "10",
        0,

    );


    /*
       Team abbreviation.
    */

    ctx.font=

    ctx.fillText(
        team.short,

    );

    ctx.restore();

/* =========================================================
   BALL POSITION
========================================================= */

function ballScreen(t){

    const g =
        geometry();

    const v=view();

    /*
       Ball begins close to player
       and travels toward goal.
    */

    const startX =
        v.w/2;

    const startY =
        g.playerY-25;

    const endX =
        g.goalLeft+
        ((ball.targetX+3.66)/7.32)*
        (g.goalRight-g.goalLeft);

    const endY =
        g.goalBottom-
        (ball.targetZ/2.44)*
        (g.goalBottom-g.goalTop);

    return{

        x:lerp(
            startX,
            endX,
            ease(t)
        ),

        y:
            lerp(
                startY,
                endY,
                t
            )-
            Math.sin(Math.PI*t)*
            (g.mobile?25:35)
    };
}


/* =========================================================
   BALL DRAW
========================================================= */

function drawBall(){

    if(!ball.active)
        return;

    ball.trail.forEach(
        (p,i)=>{

            const alpha =
                i/
                ball.trail.length*.18;

            ctx.fillStyle=
                `rgba(255,255,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );

    const t =
        clamp(
            (performance.now()-ball.startTime)/
            (1000*ball.duration),
            0,
            1
        );

    const p =
        ballScreen(t);

    const g =
        geometry();

    const r =
        lerp(
            g.mobile?10:13,
            g.mobile?5:7,
            t
        );


    /*
       Shadow.
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+r*.8,
        r*1.2,
        r*.35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball.
    */

    const grad =
        ctx.createRadialGradient(
            p.x-r*.35,
            p.y-r*.35,
            1,
            p.x,
            p.y,
            r
        );

    grad.addColorStop(
        0,
        "#ffffff"
    );

    grad.addColorStop(
        .75,
        "#e4e7e9"
    );

    grad.addColorStop(
        1,
        "#858e94"
    );

    ctx.fillStyle=grad;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#222";

    ctx.lineWidth=
        Math.max(
            .5,
            r*.08
        );

    ctx.beginPath();

    ctx.moveTo(
        p.x-r*.45,
        p.y
    );

    ctx.lineTo(
        p.x+r*.45,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-r*.45
    );

    ctx.lineTo(
        p.x,
        p.y+r*.45
    );

    ctx.stroke();
}


/* =========================================================
   TARGET
========================================================= */

function drawTarget(){

    if(
        game.phase!=="shoot" ||
        !game.yourTeam
    )
        return;

    const g =
        geometry();

    const x =
        g.goalLeft+
        ((selectedZone.x+3.66)/7.32)*
        (g.goalRight-g.goalLeft);

    const y =
        g.goalBottom-
        (selectedZone.z/2.44)*
        (g.goalBottom-g.goalTop);

    const radius =
        g.mobile
        ? 15
        : 20;

    ctx.save();

    ctx.strokeStyle=
        game.yourTeam.primary;

    ctx.lineWidth=3;

    ctx.shadowColor=
        game.yourTeam.primary;

    ctx.shadowBlur=14;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.beginPath();

    ctx.moveTo(
        x-radius-6,
        y
    );

    ctx.lineTo(
        x+radius+6,
        y
    );

    ctx.moveTo(
        x,
        y-radius-6
    );

    ctx.lineTo(
        x,
        y+radius+6
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const v=view();

    ctx.clearRect(
        0,
        0,
        v.w,
        v.h
    );

    drawBackground();

    drawPitch();

    drawGoal();

    drawKeeper();

    drawPlayer();

    drawTarget();

    drawBall();


    /*
       Bottom vignette.
    */

    const vignette =
        ctx.createLinearGradient(
            0,
            v.h*.55,
            0,
            v.h
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.30)"
    );

    ctx.fillStyle=vignette;

    ctx.fillRect(
        0,
        v.h*.55,
        v.w,
        v.h*.45
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

$("difficulty").addEventListener(
    "change",
    ()=>{
        game.difficulty =
            $("difficulty").value;

        if(game.active){

            status(
                "DIFFICULTY UPDATED",
                "Keeper AI changed for the next shot"
            );
        }
    }
);


/* =========================================================
   LOOP
========================================================= */

function loop(now){

    updateBall(now);

    updateKeeper(now);

    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   INITIAL
========================================================= */

setupSlots();

updateScoreboard();

status(
    "SELECT TEAMS",
    "Choose your team and opponent"
);

</script>
