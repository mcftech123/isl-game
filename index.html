<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ISL Penalty Shootout</title>
<style>
:root{--accent:#f4c400;--accent2:#123d91;--bg:#05090c;--panel:#0a1218;--muted:#9da8ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020508;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
button,select,input{font:inherit}button{cursor:pointer}
#app,#gameFrame{width:100%;height:100%}
#gameFrame{position:relative;overflow:hidden;background:#0b2413;border:1px solid #ffffff20;border-radius:15px;box-shadow:0 30px 100px #000d}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* FIFA-STYLE TEAM SELECT */
#teamScreen{position:absolute;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#02070aeF,#010508FA);backdrop-filter:blur(14px)}
.teamPanel{width:min(1050px,100%);max-height:94%;overflow:auto;padding:28px;border:1px solid #fff2;border-radius:20px;background:linear-gradient(145deg,#15232bFA,#050c12FC);box-shadow:0 30px 90px #000}
.gameTitle{text-align:center;font-size:clamp(25px,4vw,48px);font-weight:1000;letter-spacing:2px}
.gameSubtitle{text-align:center;margin:7px 0 22px;color:#89979e;font-size:10px;font-weight:800;letter-spacing:2px}
.vsHeader{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:12px;margin:8px auto 22px;max-width:780px}
.sideTitle{text-align:center;color:#8e9ba2;font-size:9px;font-weight:1000;letter-spacing:1.5px}
.vsCircle{width:62px;height:62px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#101a21;border:2px solid #ffffff26;font-size:18px;font-weight:1000}
.selectedTeams{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:15px;max-width:780px;margin:0 auto 22px}
.selectedTeam{min-height:105px;border-radius:14px;border:1px solid #fff2;background:#0b151c;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}
.selectedTeam.away{flex-direction:row-reverse}
.selectedBadge{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:1000;border:3px solid #fff5;flex:none}
.selectedName{font-size:14px;font-weight:1000}
.selectedShort{font-size:8px;color:#89979e;margin-top:4px;letter-spacing:1px}
.teamGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.selectionTitle{margin:15px 0 8px;color:#9ba8af;font-size:10px;font-weight:1000;letter-spacing:1.5px}
.teamCard{min-height:78px;padding:8px 5px;border-radius:10px;border:1px solid #fff2;background:linear-gradient(180deg,#17262f,#091117);color:#fff;transition:.15s}
.teamCard.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 25px #ffd43b20}
.teamCard:active{transform:scale(.97)}
.teamBadge{width:35px;height:35px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:8px;font-weight:1000;border:2px solid #fff6}
.teamName{margin-top:7px;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#startMatch{display:block;width:300px;max-width:100%;height:50px;margin:22px auto 0;border:0;border-radius:9px;background:linear-gradient(180deg,#ffe75b,#d4a717);color:#171200;font-size:11px;font-weight:1000;letter-spacing:1px}
#startMatch:disabled{opacity:.3}

/* MOBILE GAME HUD */
#topHUD{position:absolute;z-index:100;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;pointer-events:none}
.scoreBox{width:100%;max-width:360px;overflow:hidden;border-radius:10px;background:#03090ef2;border:1px solid #fff3;box-shadow:0 12px 35px #0009;backdrop-filter:blur(10px)}
.scoreTeam{display:grid;grid-template-columns:58px 1fr 42px;min-height:42px;border-bottom:1px solid #fff2}
.scoreTeam:last-child{border-bottom:0}
.scoreName{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:1000}
.scoreSlots{display:flex;align-items:center;justify-content:center;gap:4px}
.slot{width:18px;height:12px;border-radius:2px;border:1px solid #fff;background:#e7ebed}.slot.goal{background:#24d47b;border-color:#a5ffd1}.slot.miss{background:#ed4b59;border-color:#ffafb7}
.scoreNumber{display:flex;align-items:center;justify-content:center;background:#f4cf1b;color:#111;font-size:18px;font-weight:1000}
#centerInfo{min-width:150px;padding:7px 15px;text-align:center;border-radius:30px;background:#03090ee8;border:1px solid #fff2;backdrop-filter:blur(9px)}
#centerInfo small{display:block;color:#89979e;font-size:6px;letter-spacing:1.7px}#centerInfo strong{font-size:11px}
#gameButtons{display:flex;justify-content:flex-end;gap:6px;pointer-events:auto}.smallBtn{height:36px;padding:0 12px;border-radius:8px;border:1px solid #fff3;background:#040c12f5;color:#fff;font-size:8px;font-weight:1000}.smallBtn:active{transform:scale(.96)}#resetBtn{background:#b73543}
#statusBox{position:absolute;z-index:90;top:91px;left:50%;transform:translateX(-50%);min-width:270px;padding:10px 18px;text-align:center;border-radius:12px;background:#03090ec7;border:1px solid #fff2;backdrop-filter:blur(10px)}
#statusMain{font-size:19px;font-weight:1000;letter-spacing:1px}#statusSub{margin-top:3px;color:#aab5bb;font-size:9px}
#difficultyBox{position:absolute;z-index:100;top:62px;right:12px;display:none;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;background:#030a0ff5;border:1px solid #fff2}
#difficultyBox span{color:#87949b;font-size:7px;font-weight:1000}#difficulty{background:transparent;color:#fff;border:0;outline:0;font-size:8px;font-weight:1000}

/* CONTROLS */
#shootControls{position:absolute;z-index:120;left:50%;bottom:14px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:7px}
.zoneGrid{display:grid;grid-template-columns:repeat(3,72px);gap:5px}.zone{height:34px;border-radius:6px;border:1px solid #fff3;background:#030b11f5;color:#fff;font-size:8px;font-weight:1000}.zone.selected{background:var(--accent);color:#111;border-color:#fff4a0}
.powerWrap{width:220px;padding:4px 8px;border-radius:20px;background:#030a0ff5;border:1px solid #fff3}#power{width:100%;accent-color:var(--accent)}
#shootBtn{width:155px;height:40px;border:0;border-radius:8px;background:linear-gradient(180deg,#ffe965,#d5a619);color:#151200;font-size:10px;font-weight:1000;letter-spacing:1px}
#defendControls{position:absolute;z-index:120;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:7px;width:min(440px,calc(100% - 20px))}
.diveBtn{flex:1;height:43px;border-radius:8px;border:1px solid #fff3;background:#030b11f5;color:#fff;font-size:9px;font-weight:1000}.diveBtn.center{background:linear-gradient(180deg,#31d87d,#109b51);color:#03170b}

/* MOBILE */
@media(max-width:700px){
#gameFrame{width:100vw;height:100svh;border:0;border-radius:0;box-shadow:none}
#topHUD{top:max(6px,env(safe-area-inset-top));left:6px;right:6px;grid-template-columns:minmax(0,1fr) auto minmax(0,auto);gap:5px}
.scoreBox{width:100%;min-width:0;border-radius:8px}.scoreTeam{grid-template-columns:38px 1fr 28px;min-height:29px}.scoreName{font-size:7px}.scoreSlots{gap:2px}.slot{width:11px;height:8px}.scoreNumber{font-size:13px}
#centerInfo{min-width:92px;padding:5px 7px;border-radius:9px;align-self:start}.centerInfo small{font-size:4px}#centerInfo small{font-size:4.5px;letter-spacing:1px}#centerInfo strong{font-size:8px}
#gameButtons{gap:3px}.smallBtn{height:29px;padding:0 7px;font-size:6px}
#statusBox{top:70px;min-width:165px;max-width:calc(100vw - 18px);padding:6px 9px;border-radius:8px}#statusMain{font-size:11px}#statusSub{font-size:6px}
#difficultyBox{top:106px;right:6px;padding:4px 6px;border-radius:6px}#difficultyBox span{font-size:5px}#difficulty{font-size:6px}
#shootControls{bottom:max(8px,env(safe-area-inset-bottom));width:100%;gap:5px}
.zoneGrid{grid-template-columns:repeat(3,58px);gap:3px}.zone{height:30px;font-size:6px}.powerWrap{width:190px;padding:3px 7px}#power{height:18px}#shootBtn{width:140px;height:39px;font-size:8px}
#defendControls{bottom:max(9px,env(safe-area-inset-bottom));gap:4px}.diveBtn{height:44px;font-size:7px}
#teamScreen{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom))}.teamPanel{width:100%;max-height:100%;padding:14px 8px;border-radius:14px}
.gameTitle{font-size:22px;letter-spacing:1px}.gameSubtitle{margin:4px 0 10px;font-size:6px}
.vsHeader{grid-template-columns:1fr 45px 1fr;gap:5px;margin-bottom:8px}.vsCircle{width:38px;height:38px;font-size:11px}.sideTitle{font-size:6px}
.selectedTeams{grid-template-columns:1fr 40px 1fr;gap:5px;margin-bottom:10px}.selectedTeam{min-height:68px;padding:6px;gap:5px;border-radius:9px}.selectedTeam.away{flex-direction:row}.selectedBadge{width:35px;height:35px;font-size:7px;border-width:2px}.selectedName{font-size:7px}.selectedShort{font-size:5px}
.selectionTitle{margin:7px 0 5px;font-size:7px}.teamGrid{grid-template-columns:repeat(4,1fr);gap:4px}.teamCard{min-height:58px;padding:5px 2px;border-radius:7px}.teamBadge{width:25px;height:25px;font-size:5px}.teamName{margin-top:4px;font-size:6px}
#startMatch{height:42px;margin-top:10px;font-size:8px}
}
@media(max-width:390px){
.scoreTeam{grid-template-columns:34px 1fr 25px}.slot{width:9px}.scoreName{font-size:6px}.scoreNumber{font-size:12px}#centerInfo{min-width:82px}#centerInfo strong{font-size:7px}.smallBtn{padding:0 5px}.teamGrid{grid-template-columns:repeat(4,1fr)}.teamCard{min-height:54px}.selectedTeam{min-height:62px}
}
@media(max-height:500px) and (orientation:landscape){
#shootControls{transform:translateX(-50%) scale(.76);transform-origin:center bottom;bottom:2px}#defendControls{transform:translateX(-50%) scale(.82);transform-origin:center bottom;bottom:3px}#statusBox{top:48px;transform:translateX(-50%) scale(.78)}
}
</style>
</head>
<body>
<div id="app"><div id="gameFrame"><canvas id="game"></canvas>

<div id="teamScreen">
<div class="teamPanel">
<div class="gameTitle">ISL PENALTY SHOOTOUT</div>
<div class="gameSubtitle">FIFA-STYLE MATCH SETUP</div>

<div class="vsHeader">
<div class="sideTitle">HOME TEAM</div><div class="vsCircle">VS</div><div class="sideTitle">AWAY TEAM</div>
</div>

<div class="selectedTeams">
<div class="selectedTeam" id="homePreview"><div class="selectedBadge" id="homeBadge">?</div><div><div class="selectedName" id="homeName">SELECT HOME</div><div class="selectedShort" id="homeShort">HOME</div></div></div>
<div></div>
<div class="selectedTeam away" id="awayPreview"><div class="selectedBadge" id="awayBadge">?</div><div><div class="selectedName" id="awayName">SELECT AWAY</div><div class="selectedShort" id="awayShort">AWAY</div></div></div>
</div>

<div class="selectionTitle">HOME TEAM</div><div class="teamGrid" id="yourTeams"></div>
<div class="selectionTitle">AWAY TEAM</div><div class="teamGrid" id="opponentTeams"></div>
<button id="startMatch" disabled>START MATCH</button>
</div></div>

<div id="topHUD">
<div class="scoreBox"><div class="scoreTeam"><div class="scoreName" id="yourName">YOU</div><div class="scoreSlots" id="yourSlots"></div><div class="scoreNumber" id="yourScore">0</div></div><div class="scoreTeam"><div class="scoreName" id="oppName">CPU</div><div class="scoreSlots" id="oppSlots"></div><div class="scoreNumber" id="oppScore">0</div></div></div>
<div id="centerInfo"><small>ISL PENALTY SHOOTOUT</small><strong>ROUND <span id="round">1</span> / <span id="maxRound">5</span></strong></div>
<div id="gameButtons"><button class="smallBtn" id="changeTeams">TEAMS</button><button class="smallBtn" id="resetBtn">RESET</button></div>
</div>

<div id="statusBox"><div id="statusMain">SELECT TEAMS</div><div id="statusSub">Choose your home and away team</div></div>
<div id="difficultyBox"><span>LEVEL</span><select id="difficulty"><option value="easy">EASY</option><option value="medium" selected>MEDIUM</option><option value="hard">HARD</option></select></div>

<div id="shootControls"><div class="zoneGrid">
<button class="zone" data-x="-2.75" data-z="2.05">↖ HIGH</button><button class="zone" data-x="0" data-z="2.05">↑ HIGH</button><button class="zone" data-x="2.75" data-z="2.05">↗ HIGH</button>
<button class="zone" data-x="-2.75" data-z="1.20">← MID</button><button class="zone selected" data-x="0" data-z="1.20">CENTER</button><button class="zone" data-x="2.75" data-z="1.20">MID →</button>
<button class="zone" data-x="-2.75" data-z=".32">↙ LOW</button><button class="zone" data-x="0" data-z=".32">↓ LOW</button><button class="zone" data-x="2.75" data-z=".32">↘ LOW</button>
</div><div class="powerWrap"><input id="power" type="range" min="40" max="100" value="76"></div><button id="shootBtn">SHOOT</button></div>

<div id="defendControls"><button class="diveBtn" data-dir="-1">← LEFT</button><button class="diveBtn center" data-dir="0">CENTER</button><button class="diveBtn" data-dir="1">RIGHT →</button></div>
</div></div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let W=1280,H=720;
function resizeCanvas(){const r=canvas.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resizeCanvas);addEventListener("orientationchange",()=>setTimeout(resizeCanvas,120));resizeCanvas();
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,easeOut=t=>1-Math.pow(1-t,3),rand=(a,b)=>a+Math.random()*(b-a),isMobile=()=>W<700;
const TEAMS={
kbfc:{name:"Kerala Blasters",short:"KBFC",primary:"#f4c400",secondary:"#123d91",badge:"KB"},
mbsg:{name:"Mohun Bagan",short:"MBSG",primary:"#008f52",secondary:"#7b173d",badge:"MB"},
mumbai:{name:"Mumbai City",short:"MCFC",primary:"#65c4e8",secondary:"#123c73",badge:"MC"},
bengaluru:{name:"Bengaluru FC",short:"BFC",primary:"#0871c9",secondary:"#e8edf1",badge:"BFC"},
eastbengal:{name:"East Bengal",short:"EBFC",primary:"#df332f",secondary:"#f3c300",badge:"EB"},
goa:{name:"FC Goa",short:"FCG",primary:"#e66d16",secondary:"#243b8c",badge:"GOA"},
chennaiyin:{name:"Chennaiyin FC",short:"CFC",primary:"#087bb9",secondary:"#102f61",badge:"CFC"},
hyderabad:{name:"Hyderabad FC",short:"HFC",primary:"#f4a900",secondary:"#171717",badge:"HFC"},
odisha:{name:"Odisha FC",short:"OFC",primary:"#241b78",secondary:"#e33d43",badge:"OFC"},
jamshedpur:{name:"Jamshedpur FC",short:"JFC",primary:"#d71920",secondary:"#102b55",badge:"JFC"},
northeast:{name:"NorthEast United",short:"NEUFC",primary:"#e9b51d",secondary:"#15285d",badge:"NEU"},
punjab:{name:"Punjab FC",short:"PFC",primary:"#ed2939",secondary:"#f2b300",badge:"PFC"}};
let selectedYour=null,selectedOpponent=null;
function updatePreview(){const h=selectedYour?TEAMS[selectedYour]:null,a=selectedOpponent?TEAMS[selectedOpponent]:null;$("homeName").textContent=h?h.name:"SELECT HOME";$("homeShort").textContent=h?h.short:"HOME";$("homeBadge").textContent=h?h.badge:"?";$("homeBadge").style.background=h?h.primary:"#101820";$("homeBadge").style.color=h?h.secondary:"#fff";$("homeBadge").style.borderColor=h?h.secondary:"#fff5";$("awayName").textContent=a?a.name:"SELECT AWAY";$("awayShort").textContent=a?a.short:"AWAY";$("awayBadge").textContent=a?a.badge:"?";$("awayBadge").style.background=a?a.primary:"#101820";$("awayBadge").style.color=a?a.secondary:"#fff";$("awayBadge").style.borderColor=a?a.secondary:"#fff5"}
function createTeamCards(){$("yourTeams").innerHTML="";$("opponentTeams").innerHTML="";Object.entries(TEAMS).forEach(([id,t])=>{$("yourTeams").appendChild(createTeamCard(id,t,"your"));$("opponentTeams").appendChild(createTeamCard(id,t,"opponent"))});updatePreview()}
function createTeamCard(id,t,type){const b=document.createElement("button");b.className="teamCard";b.innerHTML=`<div class="teamBadge" style="background:${t.primary};color:${t.secondary};border-color:${t.secondary}">${t.badge}</div><div class="teamName">${t.name}</div>`;b.onclick=()=>{if(type==="your"){selectedYour=id;document.querySelectorAll("#yourTeams .teamCard").forEach(x=>x.classList.remove("selected"))}else{selectedOpponent=id;document.querySelectorAll("#opponentTeams .teamCard").forEach(x=>x.classList.remove("selected"))}b.classList.add("selected");updatePreview();$("startMatch").disabled=!selectedYour||!selectedOpponent||selectedYour===selectedOpponent};return b}createTeamCards();

const game={active:false,phase:"selection",round:1,maxRounds:5,yourScore:0,opponentScore:0,yourTaken:false,opponentTaken:false,suddenDeath:false,yourTeam:null,opponentTeam:null,difficulty:"medium"};
const DIFFICULTY={easy:{reaction:.48,sideReach:.70,centerReach:.82,diveReach:1.45,error:.65},medium:{reaction:.30,sideReach:.52,centerReach:.66,diveReach:1.75,error:.42},hard:{reaction:.15,sideReach:.40,centerReach:.55,diveReach:2.10,error:.25}};
const ball={active:false,owner:null,x:0,z:.12,targetX:0,targetZ:1.2,startTime:0,duration:1,trail:[]};
const keeper={x:0,startX:0,targetX:0,direction:0,active:false,startTime:0,duration:.4};
let selectedZone={x:0,z:1.2};
function status(main,sub=""){$("statusMain").textContent=main;$("statusSub").textContent=sub}
function showShootControls(v){$("shootControls").style.display=v?"flex":"none"}function showDefendControls(v){$("defendControls").style.display=v?"flex":"none"}
function setupScoreSlots(){$("yourSlots").innerHTML="";$("oppSlots").innerHTML="";for(let i=0;i<game.maxRounds;i++){let a=document.createElement("span"),b=document.createElement("span");a.className=b.className="slot";$("yourSlots").appendChild(a);$("oppSlots").appendChild(b)}}
function updateScoreboard(){$("yourName").textContent=game.yourTeam?game.yourTeam.short:"YOU";$("oppName").textContent=game.opponentTeam?game.opponentTeam.short:"CPU";$("yourScore").textContent=game.yourScore;$("oppScore").textContent=game.opponentScore;$("round").textContent=game.round;$("maxRound").textContent=game.maxRounds}
function markSlot(team,result,index){const c=team==="you"?$("yourSlots"):$("oppSlots"),s=c.children[index];if(s)s.className="slot "+result}
function resetGameState(){game.phase="selection";game.round=1;game.maxRounds=5;game.yourScore=0;game.opponentScore=0;game.yourTaken=false;game.opponentTaken=false;game.suddenDeath=false;ball.active=false;keeper.active=false;ball.trail=[];keeper.x=0;setupScoreSlots();updateScoreboard()}
$("startMatch").onclick=()=>{if(!selectedYour||!selectedOpponent||selectedYour===selectedOpponent)return;game.yourTeam=TEAMS[selectedYour];game.opponentTeam=TEAMS[selectedOpponent];document.documentElement.style.setProperty("--accent",game.yourTeam.primary);document.documentElement.style.setProperty("--accent2",game.yourTeam.secondary);game.difficulty=$("difficulty").value;$("teamScreen").style.display="none";$("difficultyBox").style.display="flex";resetGameState();game.active=true;startYourPenalty()};
function resetAll(){game.active=false;showShootControls(false);showDefendControls(false);$("difficultyBox").style.display="none";$("teamScreen").style.display="flex";status("SELECT TEAMS","Choose your home and away team");updatePreview()}
$("changeTeams").onclick=resetAll;
$("resetBtn").onclick=()=>{if(!game.yourTeam){resetAll();return}resetGameState();game.active=true;startYourPenalty()};
function startYourPenalty(){game.phase="shoot";ball.active=false;keeper.x=0;keeper.active=false;showShootControls(true);showDefendControls(false);status("YOUR PENALTY","Aim for a corner and choose power");selectZone(document.querySelector('.zone[data-x="0"][data-z="1.20"]'))}
function selectZone(b){if(!b)return;document.querySelectorAll(".zone").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");selectedZone.x=Number(b.dataset.x);selectedZone.z=Number(b.dataset.z)}
document.querySelectorAll(".zone").forEach(b=>b.onclick=()=>selectZone(b));
$("shootBtn").onclick=()=>{if(!game.active||game.phase!=="shoot"||ball.active)return;shootBall(selectedZone.x,selectedZone.z,Number($("power").value),"you")};
function shootBall(x,z,power,owner){if(ball.active)return;const cfg=DIFFICULTY[game.difficulty];ball.active=true;ball.owner=owner;ball.x=0;ball.z=.12;let error=owner==="you"?.025+(100-power)*.0008:(game.difficulty==="easy"?.22:game.difficulty==="medium"?.13:.08);ball.targetX=clamp(x+rand(-error,error),-3.8,3.8);ball.targetZ=clamp(z+rand(-error,error),.05,2.4);const speed=19+power*.115;ball.duration=10.8/speed;if(power>88)ball.duration*=.91;ball.startTime=performance.now();ball.trail=[];game.phase=owner==="you"?"playerFlight":"cpuFlight";showShootControls(false);showDefendControls(false);if(owner==="you"){status("SHOT!",game.opponentTeam.name+" goalkeeper reacts...");startCPUKeeper()}else status("CPU SHOOTS!","Your goalkeeper is diving...")}
function startCPUKeeper(){const cfg=DIFFICULTY[game.difficulty],prediction=rand(-cfg.error,cfg.error);keeper.startX=0;keeper.x=0;keeper.targetX=clamp(ball.targetX+prediction,-3.35,3.35);keeper.direction=keeper.targetX<-.55?-1:keeper.targetX>.55?1:0;keeper.startTime=performance.now()+cfg.reaction*1000;keeper.duration=.42;keeper.active=true}
function beginDefense(){game.phase="defend";ball.active=false;keeper.x=0;keeper.targetX=0;keeper.active=false;showShootControls(false);showDefendControls(true);status(game.opponentTeam.short+" PENALTY","Choose LEFT, CENTER or RIGHT");setTimeout(()=>{if(game.active&&game.phase==="defend")chooseDive(0)},3000)}
document.querySelectorAll(".diveBtn").forEach(b=>b.onclick=()=>chooseDive(Number(b.dataset.dir)));
function chooseDive(direction){if(!game.active||game.phase!=="defend")return;keeper.direction=direction;keeper.startX=keeper.x;keeper.targetX=direction===-1?-3.15:direction===1?3.15:0;keeper.startTime=performance.now();keeper.duration=direction===0?.28:.43;keeper.active=true;showDefendControls(false);status(direction<0?"DIVING LEFT":direction>0?"DIVING RIGHT":"STAYING CENTER","Read the striker...");setTimeout(()=>{if(game.active&&game.phase==="defend")cpuShoot()},210)}
function cpuShoot(){if(!game.active||game.phase!=="defend")return;const r=Math.random();let x=r<.32?rand(-3.25,-2.15):r<.64?rand(2.15,3.25):r<.82?rand(-.65,.65):rand(-2.8,2.8);let z=Math.random()<.3?rand(1.75,2.3):rand(.3,1.55);let power=rand(67,96);if(game.difficulty==="easy"){x+=rand(-.55,.55);z+=rand(-.25,.25)}if(game.difficulty==="hard"){x+=rand(-.12,.12);z+=rand(-.08,.08)}shootBall(x,z,power,"cpu")}
function updateBall(now){if(!ball.active)return;const t=clamp((now-ball.startTime)/(1000*ball.duration),0,1);ball.x=lerp(0,ball.targetX,easeOut(t));ball.z=lerp(.12,ball.targetZ,t)+Math.sin(Math.PI*t)*.62;const p=ballScreen(t);ball.trail.push({x:p.x,y:p.y});if(ball.trail.length>12)ball.trail.shift();if(t>=1){ball.active=false;resolveShot()}}
function updateKeeper(now){if(!keeper.active)return;if(ball.owner==="you"&&now<keeper.startTime)return;const t=clamp((now-keeper.startTime)/(1000*keeper.duration),0,1);keeper.x=lerp(keeper.startX,keeper.targetX,easeOut(t));if(t>=1)keeper.active=false}
function resolveShot(){const x=ball.targetX,z=ball.targetZ;if(x<-3.66||x>3.66||z<0||z>2.44){finishShot(false,x<-3.66||x>3.66?"WIDE!":"OVER THE BAR!");return}const cfg=DIFFICULTY[game.difficulty],distance=Math.abs(x-keeper.x);let reach=keeper.direction===0?cfg.centerReach:cfg.diveReach;if(keeper.direction===-1&&x>-.45)reach=.16;if(keeper.direction===1&&x<.45)reach=.16;if(keeper.direction===0&&Math.abs(x)>1.05)reach=.12;if(z>1.65)reach*=.72;if(z<.48)reach*=.86;const saved=distance<=reach;finishShot(!saved,saved?(ball.owner==="you"?"SAVED!":"GREAT SAVE!"):(ball.owner==="you"?"GOAL!":"CPU SCORES!"))}
function finishShot(scored,text){const owner=ball.owner,index=game.round-1;if(owner==="you"){if(scored)game.yourScore++;markSlot("you",scored?"goal":"miss",index);game.yourTaken=true}else{if(scored)game.opponentScore++;markSlot("opp",scored?"goal":"miss",index);game.opponentTaken=true}updateScoreboard();status(text,`${game.yourTeam.short} ${game.yourScore} - ${game.opponentScore} ${game.opponentTeam.short}`);setTimeout(nextTurn,1150)}
function nextTurn(){ball.active=false;keeper.active=false;if(game.yourTaken&&!game.opponentTaken){beginDefense();return}if(game.yourTaken&&game.opponentTaken){if(game.round>=game.maxRounds&&game.yourScore!==game.opponentScore){finishGame();return}if(game.round>=game.maxRounds&&game.yourScore===game.opponentScore){game.suddenDeath=true;game.maxRounds++}game.round++;game.yourTaken=false;game.opponentTaken=false;if($("yourSlots").children.length<game.maxRounds){let a=document.createElement("span"),b=document.createElement("span");a.className=b.className="slot";$("yourSlots").appendChild(a);$("oppSlots").appendChild(b)}updateScoreboard();if(game.suddenDeath)status("SUDDEN DEATH","One penalty each — winner takes it");startYourPenalty()}}
function finishGame(){game.active=false;showShootControls(false);showDefendControls(false);const title=game.yourScore>game.opponentScore?game.yourTeam.name.toUpperCase()+" WIN!":game.opponentTeam.name.toUpperCase()+" WIN!";status(title,`${game.yourScore} - ${game.opponentScore} • RESET TO PLAY AGAIN`)}

function scene(){return isMobile()?{goalTop:H*.245,goalBottom:H*.405,goalWidth:Math.min(W*.82,360),keeperY:H*.355,kickerY:H*.755,pitchTop:H*.34}:{goalTop:H*.205,goalBottom:H*.445,goalWidth:Math.min(W*.46,740),keeperY:H*.365,kickerY:H*.735,pitchTop:H*.325}}
function goalX(x){const s=scene();return W/2+x/3.66*s.goalWidth/2}function goalY(z){const s=scene();return lerp(s.goalBottom,s.goalTop,z/2.44)}
function ballScreen(t){const s=scene(),xScale=lerp(s.goalWidth*.52,s.goalWidth*.50,t);return{x:W/2+ball.x/3.66*xScale,y:lerp(s.kickerY,s.goalBottom,t)-ball.z*(s.goalBottom-s.goalTop)/2.44}}
function drawStadium(){const s=scene(),sky=ctx.createLinearGradient(0,0,0,s.pitchTop);sky.addColorStop(0,"#07121a");sky.addColorStop(.48,"#172a34");sky.addColorStop(1,"#0b1519");ctx.fillStyle=sky;ctx.fillRect(0,0,W,s.pitchTop+30);ctx.fillStyle="#0b1115";ctx.fillRect(0,s.pitchTop*.45,W,s.pitchTop*.5);const rows=isMobile()?9:7,dots=isMobile()?26:70;for(let r=0;r<rows;r++){const y=s.pitchTop*.52+r*s.pitchTop*.042;for(let i=0;i<dots;i++){const x=i*(W/dots)+(r%2)*5;ctx.fillStyle=r%3===0?"#ffffff26":"#ffffff17";ctx.fillRect(x,y,isMobile()?3:6,isMobile()?3:6)}}ctx.fillStyle="#111c21";ctx.fillRect(0,s.pitchTop*.82,W,s.pitchTop*.14);for(let i=0;i<Math.ceil(W/95);i++){ctx.fillStyle=i%2===0?"#26363b":"#17252a";ctx.fillRect(i*95,s.pitchTop*.86,88,s.pitchTop*.095)}const n=isMobile()?4:8;for(let i=0;i<n;i++){const x=W*(.08+i*(.84/Math.max(1,n-1))),y=s.pitchTop*.29+(i%2)*18;ctx.fillStyle="#ffffe6e6";ctx.beginPath();ctx.arc(x,y,isMobile()?4:5,0,Math.PI*2);ctx.fill()}}
function drawPitch(){const s=scene(),p=ctx.createLinearGradient(0,s.pitchTop,0,H);p.addColorStop(0,"#2d873f");p.addColorStop(.5,"#176a31");p.addColorStop(1,"#0a3d20");ctx.fillStyle=p;ctx.fillRect(0,s.pitchTop,W,H-s.pitchTop);const sh=(H-s.pitchTop)/12;for(let i=0;i<12;i++){ctx.fillStyle=i%2===0?"#ffffff06":"#0000000b";ctx.fillRect(0,s.pitchTop+i*sh,W,sh)}const near=s.goalBottom,topW=s.goalWidth*.78,bottomW=Math.min(W*.82,s.goalWidth*1.7);ctx.strokeStyle="#ffffff9e";ctx.lineWidth=isMobile()?1.4:2;ctx.beginPath();ctx.moveTo(W/2-topW/2,near+4);ctx.lineTo(W/2-bottomW/2,H);ctx.moveTo(W/2+topW/2,near+4);ctx.lineTo(W/2+bottomW/2,H);ctx.stroke();const bw=s.goalWidth*.54,bb=near+2+(isMobile()?H*.10:H*.15);ctx.strokeStyle="#ffffff6b";ctx.beginPath();ctx.moveTo(W/2-bw/2,near+2);ctx.lineTo(W/2+bw/2,near+2);ctx.lineTo(W/2+bw*.66,bb);ctx.lineTo(W/2-bw*.66,bb);ctx.closePath();ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(W/2,s.kickerY,isMobile()?3:4,0,Math.PI*2);ctx.fill()}
function drawGoal(){const s=scene(),l=W/2-s.goalWidth/2,r=W/2+s.goalWidth/2,t=s.goalTop,b=s.goalBottom;ctx.save();ctx.strokeStyle="#ffffff38";ctx.lineWidth=isMobile()?.7:1;for(let x=l;x<=r;x+=isMobile()?12:16){ctx.beginPath();ctx.moveTo(x,t);ctx.lineTo(x,b);ctx.stroke()}for(let y=t;y<=b;y+=isMobile()?10:13){ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke()}ctx.restore();ctx.strokeStyle="#f3f5f6";ctx.lineWidth=isMobile()?5:7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(l,b);ctx.lineTo(l,t);ctx.lineTo(r,t);ctx.lineTo(r,b);ctx.stroke()}
function drawPlayer(){const team=ball.owner==="cpu"?game.opponentTeam:game.yourTeam;if(!team)return;const s=scene(),x=W/2,y=s.kickerY,sc=isMobile()?Math.min(1,W/390):Math.min(1,W/1280);ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.fillStyle="#00000073";ctx.beginPath();ctx.ellipse(0,48,30,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111923";ctx.fillRect(-14,18,11,37);ctx.fillRect(3,18,11,37);ctx.fillStyle="#090b0d";ctx.fillRect(-18,49,18,7);ctx.fillRect(1,49,18,7);ctx.fillStyle=team.primary;ctx.beginPath();ctx.roundRect(-23,-36,46,60,7);ctx.fill();ctx.fillStyle=team.secondary;ctx.fillRect(-4,-36,8,60);ctx.strokeStyle=team.primary;ctx.lineWidth=12;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-20,-22);ctx.lineTo(-39,3);ctx.moveTo(20,-22);ctx.lineTo(39,3);ctx.stroke();ctx.fillStyle="#9b6954";ctx.beginPath();ctx.arc(0,-52,16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#171719";ctx.beginPath();ctx.arc(0,-58,16,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function drawKeeper(){const team=game.phase==="defend"||ball.owner==="cpu"?game.yourTeam:game.opponentTeam;if(!team)return;const s=scene(),x=goalX(keeper.x),y=s.keeperY,sc=isMobile()?Math.min(1.08,W/350):Math.min(1,W/1280),m=keeper.targetX-keeper.startX,lean=clamp(m/3,-1,1);ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);if(keeper.active)ctx.rotate(lean*.25);ctx.fillStyle="#0000008c";ctx.beginPath();ctx.ellipse(0,65,38+Math.abs(lean)*30,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=team.secondary;ctx.fillRect(-18,20,13,43);ctx.fillRect(5,20,13,43);ctx.fillStyle=team.primary;ctx.beginPath();ctx.roundRect(-26,-43,52,70,8);ctx.fill();ctx.fillStyle=team.secondary;ctx.fillRect(-4,-43,8,70);const st=31+Math.abs(lean)*45;ctx.strokeStyle=team.primary;ctx.lineWidth=14;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-21,-27);ctx.lineTo(lean<0?-st:-31,-17);ctx.moveTo(21,-27);ctx.lineTo(lean>0?st:31,-17);ctx.stroke();ctx.fillStyle="#f2f4f4";ctx.beginPath();ctx.arc(lean<0?-st:-31,-17,9,0,Math.PI*2);ctx.arc(lean>0?st:31,-17,9,0,Math.PI*2);ctx.fill();ctx.fillStyle="#a96f56";ctx.beginPath();ctx.arc(0,-61,17,0,Math.PI*2);ctx.fill();ctx.fillStyle="#151719";ctx.beginPath();ctx.arc(0,-67,17,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function drawBall(){if(!ball.active)return;ball.trail.forEach((p,i)=>{ctx.fillStyle=`rgba(255,255,255,${(i/Math.max(1,ball.trail.length))*.22})`;ctx.beginPath();ctx.arc(p.x,p.y,isMobile()?3.5:5,0,Math.PI*2);ctx.fill()});const t=clamp((performance.now()-ball.startTime)/(1000*ball.duration),0,1),p=ballScreen(t),r=lerp(isMobile()?12:16,isMobile()?5:7,t);ctx.fillStyle="#00000080";ctx.beginPath();ctx.ellipse(p.x,p.y+10,r*1.25,r*.34,0,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(p.x-r*.3,p.y-r*.35,1,p.x,p.y,r);g.addColorStop(0,"#fff");g.addColorStop(.72,"#e5e8e9");g.addColorStop(1,"#8b9499");ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#222";ctx.lineWidth=Math.max(.5,r*.07);ctx.beginPath();ctx.moveTo(p.x-r*.42,p.y);ctx.lineTo(p.x+r*.42,p.y);ctx.moveTo(p.x,p.y-r*.42);ctx.lineTo(p.x,p.y+r*.42);ctx.stroke()}
function drawTarget(){if(game.phase!=="shoot")return;const x=goalX(selectedZone.x),y=goalY(selectedZone.z),c=game.yourTeam?game.yourTeam.primary:"#ffd43b",sz=isMobile()?13:18;ctx.save();ctx.strokeStyle=c;ctx.lineWidth=isMobile()?2:3;ctx.shadowColor=c;ctx.shadowBlur=isMobile()?8:15;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(x-sz-5,y);ctx.lineTo(x+sz+5,y);ctx.moveTo(x,y-sz-5);ctx.lineTo(x,y+sz+5);ctx.stroke();ctx.restore()}
function drawVignette(){const g=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.25,W/2,H*.5,Math.max(W,H)*.75);g.addColorStop(0,"#0000");g.addColorStop(1,"#00000066");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function render(){ctx.clearRect(0,0,W,H);drawStadium();drawPitch();drawGoal();drawPlayer();drawKeeper();drawTarget();drawBall();drawVignette()}
function loop(now){updateBall(now);updateKeeper(now);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$("difficulty").onchange=()=>{game.difficulty=$("difficulty").value;if(game.active)status("LEVEL UPDATED","Keeper AI adjusted for the next shot")};
setupScoreSlots();updateScoreboard();status("SELECT TEAMS","Choose your home and away team");
</script>
