<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>ISL Penalty Shootout</title>

<style>
:root{
    --accent:#f4c400;
    --accent2:#123d91;
    --bg:#05090c;
    --panel:#091118;
    --white:#fff;
    --muted:#9da8ae;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020508;
    color:#fff;
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

button,
select,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   GAME FRAME
========================================================= */

#gameFrame{
    position:relative;
    width:min(100vw,177.7778vh);
    height:min(100vh,56.25vw);

    overflow:hidden;

    background:#0b2413;

    border:1px solid rgba(255,255,255,.18);
    border-radius:15px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.85),
        0 0 0 1px rgba(255,255,255,.04);
}

#game{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}

/* =========================================================
   TEAM SCREEN
========================================================= */

#teamScreen{
    position:absolute;
    inset:0;
    z-index:500;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    background:
        linear-gradient(
            180deg,
            rgba(2,7,10,.91),
            rgba(1,5,8,.98)
        );

    backdrop-filter:blur(12px);
}

.teamPanel{
    width:min(920px,100%);
    max-height:94%;

    overflow:auto;

    padding:28px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(16,26,34,.98),
            rgba(4,10,15,.99)
        );

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 30px 90px #000;
}

.gameTitle{
    text-align:center;

    font-size:clamp(25px,4vw,48px);
    font-weight:1000;

    letter-spacing:2px;
}

.gameSubtitle{
    margin-top:6px;
    margin-bottom:24px;

    text-align:center;

    color:#87959d;

    font-size:10px;
    font-weight:700;

    letter-spacing:2px;
}

.selectionTitle{
    margin:18px 0 9px;

    color:#9ba8af;

    font-size:10px;
    font-weight:1000;

    letter-spacing:1.5px;
}

.teamGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.teamCard{
    min-height:86px;

    padding:10px 6px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            180deg,
            #17262f,
            #091117
        );

    color:#fff;

    transition:.16s ease;
}

.teamCard:active{
    transform:scale(.97);
}

.teamCard.selected{
    border-color:var(--accent);

    box-shadow:
        0 0 0 2px var(--accent),
        0 0 30px rgba(255,205,40,.16);
}

.teamBadge{
    width:35px;
    height:35px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:9px;
    font-weight:1000;

    border:2px solid rgba(255,255,255,.4);
}

.teamName{
    margin-top:8px;

    font-size:10px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#startMatch{
    display:block;

    width:270px;
    max-width:100%;
    height:49px;

    margin:25px auto 0;

    border:0;
    border-radius:9px;

    background:
        linear-gradient(
            180deg,
            #ffe75b,
            #d4a717
        );

    color:#171200;

    font-size:11px;
    font-weight:1000;
    letter-spacing:1px;
}

#startMatch:disabled{
    opacity:.35;
}

/* =========================================================
   HUD
========================================================= */

#topHUD{
    position:absolute;
    z-index:100;

    top:13px;
    left:13px;
    right:13px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    pointer-events:none;
}

.scoreBox{
    width:340px;
    max-width:44%;

    overflow:hidden;

    border-radius:8px;

    background:rgba(3,9,14,.94);

    border:1px solid rgba(255,255,255,.17);

    box-shadow:0 12px 35px #0009;

    backdrop-filter:blur(10px);
}

.scoreTeam{
    display:grid;

    grid-template-columns:70px 1fr 50px;

    min-height:47px;

    border-bottom:1px solid rgba(255,255,255,.1);
}

.scoreTeam:last-child{
    border-bottom:0;
}

.scoreName{
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:1000;
}

.scoreSlots{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;
}

.slot{
    width:21px;
    height:15px;

    border-radius:2px;

    border:1px solid rgba(255,255,255,.8);

    background:#e7ebed;
}

.slot.goal{
    background:#24d47b;
    border-color:#a5ffd1;
}

.slot.miss{
    background:#ed4b59;
    border-color:#ffafb7;
}

.scoreNumber{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#f4cf1b;

    color:#111;

    font-size:21px;
    font-weight:1000;
}

#centerInfo{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    min-width:155px;

    padding:7px 18px;

    text-align:center;

    border-radius:30px;

    background:rgba(3,9,14,.9);

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(9px);
}

#centerInfo small{
    display:block;

    color:#89979e;

    font-size:7px;

    letter-spacing:2px;
}

#centerInfo strong{
    font-size:12px;
}

#gameButtons{
    display:flex;
    gap:7px;

    pointer-events:auto;
}

.smallBtn{
    height:37px;

    padding:0 13px;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.17);

    background:rgba(4,12,18,.95);

    color:#fff;

    font-size:9px;
    font-weight:1000;
}

#resetBtn{
    background:#b73543;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    z-index:90;

    top:91px;
    left:50%;

    transform:translateX(-50%);

    min-width:270px;

    padding:10px 18px;

    text-align:center;

    border-radius:12px;

    background:rgba(3,9,14,.78);

    border:1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(10px);
}

#statusMain{
    font-size:19px;
    font-weight:1000;
    letter-spacing:1px;
}

#statusSub{
    margin-top:3px;

    color:#aab5bb;

    font-size:9px;
}

/* =========================================================
   DIFFICULTY
========================================================= */

#difficultyBox{
    position:absolute;

    z-index:100;

    top:63px;
    right:13px;

    display:none;
    align-items:center;

    gap:7px;

    padding:7px 9px;

    border-radius:7px;

    background:rgba(3,10,15,.94);

    border:1px solid rgba(255,255,255,.14);
}

#difficultyBox span{
    color:#87949b;

    font-size:7px;
    font-weight:1000;
}

#difficulty{
    background:transparent;

    color:#fff;

    border:0;
    outline:0;

    font-size:8px;
    font-weight:1000;
}

/* =========================================================
   SHOOT CONTROLS
========================================================= */

#shootControls{
    position:absolute;

    z-index:120;

    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    display:none;

    flex-direction:column;
    align-items:center;

    gap:8px;
}

.zoneGrid{
    display:grid;

    grid-template-columns:repeat(3,72px);

    gap:5px;
}

.zone{
    height:35px;

    border-radius:6px;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(3,11,17,.95);

    color:#fff;

    font-size:8px;
    font-weight:1000;
}

.zone.selected{
    background:var(--accent);

    color:#111;

    border-color:#fff4a0;
}

.powerWrap{
    width:220px;

    padding:5px 8px;

    border-radius:20px;

    background:rgba(3,10,15,.94);

    border:1px solid rgba(255,255,255,.17);
}

#power{
    width:100%;
    accent-color:var(--accent);
}

#shootBtn{
    width:155px;
    height:40px;

    border:0;
    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #ffe965,
            #d5a619
        );

    color:#151200;

    font-size:10px;
    font-weight:1000;

    letter-spacing:1px;
}

/* =========================================================
   DEFEND CONTROLS
========================================================= */

#defendControls{
    position:absolute;

    z-index:120;

    left:50%;
    bottom:16px;

    transform:translateX(-50%);

    display:none;

    gap:7px;
}

.diveBtn{
    min-width:95px;
    height:43px;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(3,11,17,.95);

    color:#fff;

    font-size:9px;
    font-weight:1000;
}

.diveBtn.center{
    background:
        linear-gradient(
            180deg,
            #31d87d,
            #109b51
        );

    color:#03170b;
}

/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media(max-width:700px){

    body{
        width:100vw;
        height:100svh;
    }

    #gameFrame{
        width:100vw;
        height:100svh;

        min-width:0;
        min-height:0;

        border:0;
        border-radius:0;

        box-shadow:none;
    }

    #topHUD{
        top:
            max(
                7px,
                env(safe-area-inset-top)
            );

        left:7px;
        right:7px;
    }

    .scoreBox{
        width:196px;
        max-width:none;
    }

    .scoreTeam{
        grid-template-columns:39px 1fr 30px;
        min-height:31px;
    }

    .scoreName{
        font-size:8px;
    }

    .scoreSlots{
        gap:3px;
    }

    .slot{
        width:13px;
        height:9px;
    }

    .scoreNumber{
        font-size:14px;
    }

    #centerInfo{
        top:
            max(
                7px,
                env(safe-area-inset-top)
            );

        min-width:118px;

        padding:6px 10px;
    }

    #centerInfo small{
        font-size:5px;
        letter-spacing:1.5px;
    }

    #centerInfo strong{
        font-size:9px;
    }

    #gameButtons{
        gap:5px;
    }

    .smallBtn{
        height:31px;
        padding:0 8px;
        font-size:6px;
    }

    #statusBox{
        top:74px;

        min-width:180px;
        max-width:calc(100vw - 28px);

        padding:7px 11px;

        border-radius:9px;
    }

    #statusMain{
        font-size:12px;
    }

    #statusSub{
        font-size:7px;
    }

    #difficultyBox{
        top:112px;
        right:7px;

        padding:5px 7px;
    }

    #difficultyBox span{
        font-size:5px;
    }

    #difficulty{
        font-size:7px;
    }

    /* -----------------------------------------------------
       MOBILE SHOOTING
    ----------------------------------------------------- */

    #shootControls{
        bottom:
            max(
                10px,
                env(safe-area-inset-bottom)
            );

        width:100%;

        gap:7px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,64px);
        gap:4px;
    }

    .zone{
        height:35px;

        border-radius:7px;

        font-size:7px;
    }

    .powerWrap{
        width:210px;

        padding:5px 9px;
    }

    #power{
        height:20px;
    }

    #shootBtn{
        width:150px;
        height:42px;

        border-radius:9px;

        font-size:9px;
    }

    /* -----------------------------------------------------
       MOBILE DEFENDING
    ----------------------------------------------------- */

    #defendControls{
        bottom:
            max(
                12px,
                env(safe-area-inset-bottom)
            );

        width:100%;

        padding:0 10px;

        gap:5px;
    }

    .diveBtn{
        flex:1;

        min-width:0;

        height:48px;

        border-radius:9px;

        font-size:8px;
    }

    /* -----------------------------------------------------
       TEAM SCREEN
    ----------------------------------------------------- */

    #teamScreen{
        padding:
            max(10px,env(safe-area-inset-top))
            9px
            max(10px,env(safe-area-inset-bottom))
            9px;
    }

    .teamPanel{
        width:100%;
        max-height:100%;

        padding:17px 10px;

        border-radius:13px;
    }

    .gameTitle{
        font-size:24px;
        letter-spacing:1.2px;
    }

    .gameSubtitle{
        margin-bottom:13px;
        font-size:7px;
    }

    .selectionTitle{
        margin:10px 0 6px;
        font-size:8px;
    }

    .teamGrid{
        grid-template-columns:repeat(3,1fr);
        gap:5px;
    }

    .teamCard{
        min-height:67px;

        padding:6px 3px;

        border-radius:8px;
    }

    .teamBadge{
        width:27px;
        height:27px;
        font-size:6px;
    }

    .teamName{
        margin-top:5px;
        font-size:7px;
    }

    #startMatch{
        height:44px;
        margin-top:13px;

        font-size:9px;
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:390px){

    .scoreBox{
        width:177px;
    }

    .scoreTeam{
        grid-template-columns:35px 1fr 27px;
    }

    .slot{
        width:11px;
    }

    #centerInfo{
        min-width:105px;
    }

    #centerInfo small{
        display:none;
    }

    .smallBtn{
        padding:0 6px;
    }

    .zoneGrid{
        grid-template-columns:repeat(3,57px);
    }

    .zone{
        height:32px;
        font-size:6px;
    }

    .powerWrap{
        width:190px;
    }

    #shootBtn{
        width:140px;
    }
}

/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(max-height:500px) and (orientation:landscape){

    #gameFrame{
        width:100vw;
        height:100vh;
    }

    #shootControls{
        transform:
            translateX(-50%)
            scale(.78);

        transform-origin:
            center bottom;

        bottom:3px;
    }

    #defendControls{
        transform:
            translateX(-50%)
            scale(.82);

        transform-origin:
            center bottom;

        bottom:4px;
    }

    #statusBox{
        top:50px;

        transform:
            translateX(-50%)
            scale(.8);
    }
}
</style>
</head>

</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 1280;
let H = 720;

function resizeCanvas(){

    const rect =
        canvas.parentElement.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = Math.max(1,rect.width);
    H = Math.max(1,rect.height);

    canvas.width =
        Math.round(W*dpr);

    canvas.height =
        Math.round(H*dpr);

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            resizeCanvas,
            120
        );
    }
);

resizeCanvas();


/* =========================================================
   HELPERS
========================================================= */

const $ =
    id => document.getElementById(id);

const clamp =
    (v,min,max)=>
        Math.max(
            min,
            Math.min(max,v)
        );

const lerp =
    (a,b,t)=>
        a+(b-a)*t;

const easeOut =
    t =>
        1-Math.pow(1-t,3);

const rand =
    (a,b)=>
        a+Math.random()*(b-a);

const isMobile =
    () =>
        W < 700;


/* =========================================================
   TEAMS

/* =========================================================
   SHOOT BALL
========================================================= */

function shootBall(
    x,
    z,
    power,
    owner
){

    if(ball.active)
        return;

    const cfg =
        DIFFICULTY[game.difficulty];

    ball.active=true;

    ball.owner=owner;

    ball.x=0;

    ball.z=.12;

    let error;

    if(owner==="you"){

        error =
            .025+
            (100-power)*.0008;

    }else{

        error =
            game.difficulty==="easy"
                ? .22
                : game.difficulty==="medium"
                    ? .13
                    : .08;
    }

    ball.targetX =
        clamp(
            x+
            rand(
                -error,
                error
            ),
            -3.8,
            3.8
        );

    ball.targetZ =
        clamp(
            z+
            rand(
                -error,
                error
            ),
            .05,
            2.4
        );

    const speed =
        19+
        power*.115;

    ball.duration =
        10.8/speed;

    if(power>88)
        ball.duration*=.91;

    ball.startTime=
        performance.now();

    ball.trail=[];

    game.phase =
        owner==="you"
            ? "playerFlight"
            : "cpuFlight";

    showShootControls(false);

    showDefendControls(false);

    if(owner==="you"){

        status(
            "SHOT!",
            game.opponentTeam.name+
            " goalkeeper reacts..."
        );

        startCPUKeeper();

    }else{

        status(
            "CPU SHOOTS!",
            "Your goalkeeper is diving..."
        );
    }
}


/* =========================================================
   CPU KEEPER
========================================================= */

function startCPUKeeper(){

    const cfg =
        DIFFICULTY[game.difficulty];

    let prediction =
        rand(
            -cfg.error,
            cfg.error
        );

    keeper.startX=0;

    keeper.x=0;

    keeper.targetX =
        clamp(
            ball.targetX+
            prediction,
            -3.35,
            3.35
        );

    if(keeper.targetX<-.55)
        keeper.direction=-1;
    else if(keeper.targetX>.55)
        keeper.direction=1;
    else
        keeper.direction=0;

    keeper.startTime =
        performance.now()+
        cfg.reaction*1000;

    keeper.duration=.42;

    keeper.active=true;
}

/* =========================================================
   CPU SHOOT
========================================================= */

function cpuShoot(){

    if(
        !game.active ||
        game.phase!=="defend"
    )
        return;

    const r=Math.random();

    let x;

    if(r<.32)
        x=rand(-3.25,-2.15);
    else if(r<.64)
        x=rand(2.15,3.25);
    else if(r<.82)
        x=rand(-.65,.65);
    else
        x=rand(-2.8,2.8);

    let z;

    if(Math.random()<.3)
        z=rand(1.75,2.3);
    else
        z=rand(.3,1.55);

    let power=rand(67,96);

    if(game.difficulty==="easy"){

        x+=rand(-.55,.55);
        z+=rand(-.25,.25);

    }

    if(game.difficulty==="hard"){

        x+=rand(-.12,.12);
        z+=rand(-.08,.08);
    }

    shootBall(
        x,
        z,
        power,
        "cpu"
    );
}


/* =========================================================
   UPDATE BALL
========================================================= */

function updateBall(now){

    if(!ball.active)
        return;

    const t =
        clamp(
            (
                now-
                ball.startTime
            )/
            (
                1000*
                ball.duration
            ),
            0,
            1
        );

    ball.x =
        lerp(
            0,
            ball.targetX,
            easeOut(t)
        );

    const arc =
        Math.sin(
            Math.PI*t
        );

    ball.z =
        lerp(
            .12,
            ball.targetZ,
            t
        )+
        arc*.62;

    const p =
        ballScreen(t);

    ball.trail.push({
        x:p.x,
        y:p.y
    });

    if(ball.trail.length>12)
        ball.trail.shift();

    if(t>=1){

        ball.active=false;

        resolveShot();
    }
}


/* =========================================================
   UPDATE KEEPER
========================================================= */

function updateKeeper(now){

    if(!keeper.active)
        return;

    if(
        ball.owner==="you" &&
        now<keeper.startTime
    )
        return;

    const t =
        clamp(
            (
                now-
                keeper.startTime
            )/
            (
                1000*
                keeper.duration
            ),
            0,
            1
        );

    keeper.x =
        lerp(
            keeper.startX,
            keeper.targetX,
            easeOut(t)
        );

    if(t>=1)
        keeper.active=false;
}


/* =========================================================
   RESOLVE SHOT
========================================================= */

function resolveShot(){

    const x=ball.targetX;
    const z=ball.targetZ;

    if(
        x<-3.66 ||
        x>3.66 ||
        z<0 ||
        z>2.44
    ){

        finishShot(
            false,
            x<-3.66 ||
            x>3.66
                ? "WIDE!"
                : "OVER THE BAR!"
        );

        return;
    }

    const cfg =
        DIFFICULTY[
            game.difficulty
        ];

    const distance =
        Math.abs(
            x-keeper.x
        );

    let reach;

    if(
        keeper.direction===0
    )
        reach=cfg.centerReach;
    else
        reach=cfg.diveReach;

    if(
        keeper.direction===-1 &&
        x>-.45
    )
        reach=.16;

    if(
        keeper.direction===1 &&
        x<.45
    )
        reach=.16;

    if(
        keeper.direction===0 &&
        Math.abs(x)>1.05
    )
        reach=.12;

    if(z>1.65)
        reach*=.72;

    if(z<.48)
        reach*=.86;

    const saved =
        distance<=reach;

    finishShot(
        !saved,
        saved
            ? ball.owner==="you"
                ? "SAVED!"
                : "GREAT SAVE!"
            : ball.owner==="you"
                ? "GOAL!"
                : "CPU SCORES!"
    );
}


/* =========================================================
   FINISH SHOT
========================================================= */

function finishShot(
    scored,
    text
){

    const owner=ball.owner;

    const shotRound =
        game.round-1;

    if(owner==="you"){

        if(scored){

            game.yourScore++;

            markSlot(
                "you",
                "goal",
                shotRound
            );

        }else{

            markSlot(
                "you",
                "miss",
                shotRound
            );
        }

        game.yourTaken=true;

    }else{

        if(scored){

            game.opponentScore++;

            markSlot(
                "opp",
                "goal",
                shotRound
            );

        }else{

            markSlot(
                "opp",
                "miss",
                shotRound
            );
        }

        game.opponentTaken=true;
    }

    updateScoreboard();

    status(
        text,
        `${game.yourTeam.short} ${game.yourScore} - `+
        `${game.opponentScore} ${game.opponentTeam.short}`
    );

    setTimeout(
        nextTurn,
        1150
    );
}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    ball.active=false;

    keeper.active=false;

    if(
        game.yourTaken &&
        !game.opponentTaken
    ){

        beginDefense();

        return;
    }

    if(
        game.yourTaken &&
        game.opponentTaken
    ){

        if(
            game.round>=game.maxRounds &&
            game.yourScore!==game.opponentScore
        ){

            finishGame();

            return;
        }

        if(
            game.round>=game.maxRounds &&
            game.yourScore===game.opponentScore
        ){

            game.suddenDeath=true;

            game.maxRounds++;
        }

        game.round++;

        game.yourTaken=false;

        game.opponentTaken=false;

        if(
            $("yourSlots").children.length<
            game.maxRounds
        ){

            const a =
                document.createElement("span");

            const b =
                document.createElement("span");

            a.className="slot";
            b.className="slot";

            $("yourSlots")
                .appendChild(a);

            $("oppSlots")
                .appendChild(b);
        }

        updateScoreboard();

        if(game.suddenDeath){

            status(
                "SUDDEN DEATH",
                "One penalty each — winner takes it"
            );
        }

        startYourPenalty();
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function finishGame(){

    game.active=false;

    showShootControls(false);

    showDefendControls(false);

    let title;

    if(
        game.yourScore>

    ){

        title =
            game.yourTeam.name.toUpperCase()+
            " WIN!";

    }else{

        `${game.yourScore} - ${game.opponentScore} • RESET TO PLAY AGAIN`
    );
}


/* =========================================================
   RESPONSIVE WORLD
========================================================= */

/*
    This is the important part.

    Instead of using the old fixed
    1280x720 coordinates, the scene is
    calculated from the real screen.

    Desktop:
        wide football-camera view

    Mobile:
        portrait penalty-camera view
*/

function scene(){

    const mobile =
        isMobile();

    if(mobile){

        return {

            goalTop:H*.245,

            goalBottom:H*.405,

            goalWidth:
                Math.min(
                    W*.82,
                    360
                ),

            keeperY:
                H*.355,

            kickerY:
                H*.755,

            pitchTop:
                H*.34

        };

    }

    return {

        goalTop:H*.205,

        goalBottom:H*.445,

        goalWidth:
            Math.min(
                W*.46,
                740
            ),

        keeperY:
            H*.365,

        kickerY:
            H*.735,

        pitchTop:
            H*.325
    };
}


/* =========================================================
   WORLD TO SCREEN
========================================================= */

function goalX(x){

    const s=scene();

    return W/2+
        (
            x/3.66
        )*
        (
            s.goalWidth/2
        );
}

function goalY(z){

    const s=scene();

    return lerp(
        s.goalBottom,
        s.goalTop,
        z/2.44
    );
}

function ballScreen(t){

    const s=scene();

    const xScale =
        lerp(
            s.goalWidth*.52,
            s.goalWidth*.50,
            t
        );

    return {

        x:
            W/2+
            ball.x/
            3.66*
            xScale,

        y:
            lerp(
                s.kickerY,
                s.goalBottom,
                t
            )-
            ball.z*
            (
                s.goalBottom-
                s.goalTop
            )/
            2.44
    };
}


/* =========================================================
   STADIUM
========================================================= */

function drawStadium(){

    const s=scene();

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            s.pitchTop
        );

    sky.addColorStop(
        0,
        "#07121a"
    );

    sky.addColorStop(
        .48,
        "#172a34"
    );

    sky.addColorStop(
        1,
        "#0b1519"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        s.pitchTop+30
    );


    /*
       Stadium roof / upper stands
    */

    ctx.fillStyle="#0b1115";

    ctx.fillRect(
        0,
        s.pitchTop*.45,
        W,
        s.pitchTop*.5
    );


    /*
       Crowd
    */

    const rows =
        isMobile()
            ? 9
            : 7;

    const dots =
        isMobile()
            ? 26
            : 70;

    for(
        let row=0;
        row<rows;
        row++
    ){

        const y =
            s.pitchTop*.52+
            row*
            (
                s.pitchTop*.042
            );

        for(
            let i=0;
            i<dots;
            i++
        ){

            const x =
                i*
                (
                    W/dots
                )+
                (
                    row%2
                )*
                5;

            const size =
                isMobile()
                    ? 3
                    : 6;

            ctx.fillStyle =
                row%3===0
                    ? "rgba(255,255,255,.15)"
                    : "rgba(255,255,255,.09)";

            ctx.fillRect(
                x,
                y,
                size,
                size
            );
        }
    }


    /*
       Stadium boards
    */

    ctx.fillStyle="#111c21";

    ctx.fillRect(
        0,
        s.pitchTop*.82,
        W,
        s.pitchTop*.14
    );

    for(
        let i=0;
        i<Math.ceil(W/95);
        i++
    ){

        ctx.fillStyle =
            i%2===0
                ? "#26363b"
                : "#17252a";

        ctx.fillRect(
            i*95,
            s.pitchTop*.86,
            88,
            s.pitchTop*.095
        );
    }


    /*
       Lights
    */

    const lightCount =
        isMobile()
            ? 4
            : 8;

    for(
        let i=0;
        i<lightCount;
        i++
    ){

        const x =
            W*
            (
                .08+
                i*
                (
                    .84/
                    Math.max(
                        1,
                        lightCount-1
                    )
                )
            );

        const y =
            s.pitchTop*.29+
            (
                i%2
            )*
            18;

        ctx.fillStyle=
            "rgba(255,255,230,.9)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            isMobile()?4:5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle=
            "rgba(255,255,220,.06)";

        ctx.beginPath();

        ctx.moveTo(
            x-8,
            y+6
        );

        ctx.lineTo(
            x+8,
            y+6
        );

        ctx.lineTo(
            x+
            (
                isMobile()
                    ? 45
                    : 90
            ),
            s.pitchTop
        );

        ctx.lineTo(
            x-
            (
                isMobile()
                    ? 45
                    : 90
            ),
            s.pitchTop
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================================================
   PITCH
========================================================= */

function drawPitch(){

    const s=scene();

    const pitch =
        ctx.createLinearGradient(
            0,
            s.pitchTop,
            0,
            H
        );

    pitch.addColorStop(
        0,
        "#2d873f"
    );

    pitch.addColorStop(
        .5,
        "#176a31"
    );

    pitch.addColorStop(
        1,
        "#0a3d20"
    );

    ctx.fillStyle=pitch;

    ctx.fillRect(
        0,
        s.pitchTop,
        W,
        H-s.pitchTop
    );


    /*
       Grass stripes
    */

    const stripeHeight =
        (H-s.pitchTop)/12;

    for(
        let i=0;
        i<12;
        i++
    ){

        ctx.fillStyle =
            i%2===0
                ? "rgba(255,255,255,.025)"
                : "rgba(0,0,0,.045)";

        ctx.fillRect(
            0,
            s.pitchTop+
            i*stripeHeight,
            W,
            stripeHeight
        );
    }


    /*
       Penalty area
    */

    const nearY=s.goalBottom;

    const farY=H;

    const topWidth=
        s.goalWidth*.78;

    const bottomWidth=
        Math.min(
            W*.82,
            s.goalWidth*1.7
        );

    ctx.strokeStyle=
        "rgba(255,255,255,.62)";

    ctx.lineWidth=
        isMobile()?1.4:2;

    ctx.beginPath();

    ctx.moveTo(
        W/2-topWidth/2,
        nearY+4
    );

    ctx.lineTo(
        W/2-bottomWidth/2,
        farY
    );

    ctx.moveTo(
        W/2+topWidth/2,
        nearY+4
    );

    ctx.lineTo(
        W/2+bottomWidth/2,
        farY
    );

    ctx.stroke();


    /*
       Six-yard box
    */

    const boxTop=nearY+2;

    const boxWidth=
        s.goalWidth*.54;

    const boxBottom=
        boxTop+
        (
            isMobile()
                ? H*.10
                : H*.15
        );

    ctx.strokeStyle=
        "rgba(255,255,255,.42)";

    ctx.beginPath();

    ctx.moveTo(
        W/2-boxWidth/2,
        boxTop
    );

    ctx.lineTo(
        W/2+boxWidth/2,
        boxTop
    );

    ctx.lineTo(
        W/2+
        boxWidth*.66,
        boxBottom
    );

    ctx.lineTo(
        W/2-
        boxWidth*.66,
        boxBottom
    );

    ctx.closePath();

    ctx.stroke();


    /*
       Penalty spot
    */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        W/2,
        s.kickerY,
        isMobile()?3:4,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   GOAL
========================================================= */

function drawGoal(){

    const s=scene();

    const left=
        W/2-
        s.goalWidth/2;

    const right=
        W/2+
        s.goalWidth/2;

    const top=s.goalTop;

    const bottom=s.goalBottom;


    /*
       Net
    */

    ctx.save();

    ctx.strokeStyle=
        "rgba(255,255,255,.22)";

    ctx.lineWidth=
        isMobile()?0.7:1;

    const verticalStep =
        isMobile()
            ? 12
            : 16;

    for(
        let x=left;
        x<=right;
        x+=verticalStep
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }

    const horizontalStep =
        isMobile()
            ? 10
            : 13;

    for(
        let y=top;
        y<=bottom;
        y+=horizontalStep
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }

    ctx.restore();


    /*
       Goal frame
    */

    ctx.strokeStyle="#f3f5f6";

    ctx.lineWidth=
        isMobile()?5:7;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        left,
        bottom
    );

    ctx.lineTo(
        left,
        top
    );

    ctx.lineTo(
        right,
        top
    );

    ctx.lineTo(
        right,
        bottom
    );

    ctx.stroke();
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const team =
        ball.owner==="cpu"
            ? game.opponentTeam
            : game.yourTeam;

    if(!team)
        return;

    const s=scene();

    const x=W/2;

    const y=s.kickerY;

    const scale =
        isMobile()
            ? Math.min(
                1,
                W/390
            )
            : Math.min(
                1,
                W/1280
            );

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );


    /*
       Shadow
    */

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        48,
        30,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs
    */

    ctx.fillStyle="#111923";

    ctx.fillRect(
        -14,
        18,
        11,
        37
    );

    ctx.fillRect(
        3,
        18,
        11,
        37
    );


    /*
       Boots
    */

    ctx.fillStyle="#090b0d";

    ctx.fillRect(
        -18,
        49,
        18,
        7
    );

    ctx.fillRect(
        1,
        49,
        18,
        7
    );


    /*
       Jersey
    */

    ctx.fillStyle=
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -23,
        -36,
        46,
        60,
        7
    );

    ctx.fill();


    /*
       Secondary stripe
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -4,
        -36,
        8,
        60
    );


    /*
       Arms
    */

    ctx.strokeStyle=
        team.primary;

    ctx.lineWidth=12;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -20,
        -22
    );

    ctx.lineTo(
        -39,
        3
    );

    ctx.moveTo(
        20,
        -22
    );

    ctx.lineTo(
        39,
        3
    );

    ctx.stroke();


    /*
       Head
    */

    ctx.fillStyle="#9b6954";

    ctx.beginPath();

    ctx.arc(
        0,
        -52,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair
    */

    ctx.fillStyle="#171719";

    ctx.beginPath();

    ctx.arc(
        0,
        -58,
        16,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
       Badge
    */

    ctx.fillStyle=
        team.secondary;

    ctx.beginPath();

    ctx.arc(
        -13,
        -21,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   KEEPER
========================================================= */

function drawKeeper(){

    const team =
        game.phase==="defend" ||
        ball.owner==="cpu"
            ? game.yourTeam
            : game.opponentTeam;

    if(!team)
        return;

    const s=scene();

    const x=
        goalX(keeper.x);

    const y=
        s.keeperY;

    const scale =
        isMobile()
            ? Math.min(
                1.08,
                W/350
            )
            : Math.min(
                1,
                W/1280
            );

    const movement =
        keeper.targetX-
        keeper.startX;

    const lean=
        clamp(
            movement/3,
            -1,
            1
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    if(keeper.active)
        ctx.rotate(
            lean*.25
        );


    /*
       Shadow
    */

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        65,
        38+
        Math.abs(lean)*30,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Legs
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -18,
        20,
        13,
        43
    );

    ctx.fillRect(
        5,
        20,
        13,
        43
    );


    /*
       Body
    */

    ctx.fillStyle=
        team.primary;

    ctx.beginPath();

    ctx.roundRect(
        -26,
        -43,
        52,
        70,
        8
    );

    ctx.fill();


    /*
       Stripe
    */

    ctx.fillStyle=
        team.secondary;

    ctx.fillRect(
        -4,
        -43,
        8,
        70
    );


    /*
       Arms
    */

    const stretch =
        31+
        Math.abs(lean)*45;

    ctx.strokeStyle=
        team.primary;

    ctx.lineWidth=14;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -21,
        -27
    );

    ctx.lineTo(
        lean<0
            ? -stretch
            : -31,
        -17
    );

    ctx.moveTo(
        21,
        -27
    );

    ctx.lineTo(
        lean>0
            ? stretch
            : 31,
        -17
    );

    ctx.stroke();


    /*
       Gloves
    */

    ctx.fillStyle="#f2f4f4";

    ctx.beginPath();

    ctx.arc(
        lean<0
            ? -stretch
            : -31,
        -17,
        9,
        0,
        Math.PI*2
    );

    ctx.arc(
        lean>0
            ? stretch
            : 31,
        -17,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Head
    */

    ctx.fillStyle="#a96f56";

    ctx.beginPath();

    ctx.arc(
        0,
        -61,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Hair
    */

    ctx.fillStyle="#151719";

    ctx.beginPath();

    ctx.arc(
        0,
        -67,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   BALL
========================================================= */

function drawBall(){

    if(!ball.active)
        return;

    ball.trail.forEach(
        (p,i)=>{

            const alpha =
                (
                    i/
                    Math.max(
                        1,
                        ball.trail.length
                    )
                )*.22;

            ctx.fillStyle=
                `rgba(255,255,255,${alpha})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                isMobile()?3.5:5,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );


    const t =
        clamp(
            (
                performance.now()-
                ball.startTime
            )/
            (
                1000*
                ball.duration
            ),
            0,
            1
        );

    const p=
        ballScreen(t);

    const radius=
        lerp(
            isMobile()?12:16,
            isMobile()?5:7,
            t
        );


    /*
       Shadow
    */

    ctx.fillStyle=
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+10,
        radius*1.25,
        radius*.34,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball
    */

    const gradient =
        ctx.createRadialGradient(
            p.x-radius*.3,
            p.y-radius*.35,
            1,
            p.x,
            p.y,
            radius
        );

    gradient.addColorStop(
        0,
        "#fff"
    );

    gradient.addColorStop(
        .72,
        "#e5e8e9"
    );

    gradient.addColorStop(
        1,
        "#8b9499"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Simple football pattern
    */

    ctx.strokeStyle="#222";

    ctx.lineWidth=
        Math.max(
            .5,
            radius*.07
        );

    ctx.beginPath();

    ctx.moveTo(
        p.x-radius*.42,
        p.y
    );

    ctx.lineTo(
        p.x+radius*.42,
        p.y
    );

    ctx.moveTo(
        p.x,
        p.y-radius*.42
    );

    ctx.lineTo(
        p.x,
        p.y+radius*.42
    );

    ctx.stroke();
}


/* =========================================================
   TARGET
========================================================= */

function drawTarget(){

    if(game.phase!=="shoot")
        return;

    const x=
        goalX(
            selectedZone.x
        );

    const y=
        goalY(
            selectedZone.z
        );

    const color=
        game.yourTeam
            ? game.yourTeam.primary
            : "#ffd43b";

    const size=
        isMobile()?13:18;

    ctx.save();

    ctx.strokeStyle=color;

    ctx.lineWidth=
        isMobile()?2:3;

    ctx.shadowColor=color;

    ctx.shadowBlur=
        isMobile()?8:15;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.beginPath();

    ctx.moveTo(
        x-size-5,
        y
    );

    ctx.lineTo(
        x+size+5,
        y
    );

    ctx.moveTo(
        x,
        y-size-5
    );

    ctx.lineTo(
        x,
        y+size+5
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   VIGNETTE
========================================================= */

function drawVignette(){

    const gradient =
        ctx.createRadialGradient(
            W/2,
            H*.48,
            Math.min(W,H)*.25,
            W/2,
            H*.5,
            Math.max(W,H)*.75
        );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.40)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawStadium();

    drawPitch();

    drawGoal();

    drawPlayer();

    drawKeeper();

    drawTarget();

    drawBall();

    drawVignette();
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    updateBall(now);

    updateKeeper(now);

    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   DIFFICULTY
========================================================= */

$("difficulty").onchange=()=>{

    game.difficulty =
        $("difficulty").value;

    if(game.active){

        status(
            "DIFFICULTY UPDATED",
            "Keeper AI adjusted for the next shot"
        );
    }
};


/* =========================================================
   INITIAL
========================================================= */

setupScoreSlots();

updateScoreboard();

status(
    "SELECT TEAMS",
    "Choose your team and opponent"
);

</script>
